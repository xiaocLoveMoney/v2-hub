# hub-server 配置（入库，本地与部署共用）。凭据只从环境变量读，见 ../v2-hub-contract/deploy/.env.example。
server:
  listenAddr: ":8080"
  readTimeout: 10s
  writeTimeout: 30s
  shutdownTimeout: 15s
  # 只有来自这些网段的直连请求才采信 X-Forwarded-For（生产为 Caddy 所在 docker 网络；8080 不对外暴露）
  trustedProxies: ["127.0.0.1/32", "::1/128", "172.16.0.0/12"]
# 连接串（含口令）只从环境变量 HUB_DATABASE_URL 读；make run 会从 contract/deploy/.env 拼出开发库地址。
database:
  maxConns: 10
  pingTimeout: 2s
# 会话与登录频控，语义见 docs/03 §4.2。本机 HTTP 开发由 make run 设置 HUB_INSECURE_DEV_COOKIE=1 关闭 Secure。
auth:
  secureCookie: true
  sessionIdleTimeout: 2h
  sessionMaxAge: 168h
  sessionTouchInterval: 1m
  sessionCleanupInterval: 10m
  loginMaxFailures: 5
  loginWindow: 15m
  loginLockout: 15m
  loginMaxTrackedKeys: 10000
# 面板探测与同步，语义见 docs/03 §5.1
panel:
  probeInterval: 30s
  syncInterval: 5m
  requestTimeout: 15s
  concurrency: 8
# 用量采集、对账兜底与配额时区，语义见 docs/03 §5.2
user:
  trafficInterval: 1m
  reconcileInterval: 5m
  timeZone: Local
# 终端用户会话，语义见 docs/03 §5.3；登录频控与 Cookie 的 Secure 沿用 auth 段
portal:
  sessionIdleTimeout: 168h
  sessionMaxAge: 720h
  loginLogRetention: 2160h
