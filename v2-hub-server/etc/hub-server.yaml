# hub-server 配置（入库，本地与部署共用）。凭据只从环境变量读，见 ../v2-hub-contract/deploy/.env.example。
server:
  listenAddr: ":8080"
  readTimeout: 10s
  writeTimeout: 30s
  shutdownTimeout: 15s
  # 只有来自这些网段的直连请求才采信 X-Forwarded-For（生产为 Caddy 所在 docker 网络；8080 不对外暴露）
  trustedProxies: ["127.0.0.1/32", "::1/128", "172.16.0.0/12"]
# 连接串（含密码）只从环境变量 HUB_DATABASE_URL 读；make run 会从 contract/deploy/.env 拼出开发库地址。
database:
  maxConns: 10
  pingTimeout: 2s
# 会话与登录频控，语义见 docs/03 §4.2。本机 HTTP 开发由 make run 设置 HUB_INSECURE_DEV_COOKIE=1 关闭 Secure。
auth:
  secureCookie: true
  sessionIdleTimeout: 2h
  sessionMaxAge: 168h
  sessionTouchInterval: 1m
  sessionCleanupInterval: 10m
  loginMaxFailures: 5
  loginWindow: 15m
  loginLockout: 15m
  loginMaxTrackedKeys: 10000
# 面板探测与同步，语义见 docs/03 §5.1
panel:
  probeInterval: 30s
  syncInterval: 5m
  requestTimeout: 15s
  concurrency: 8
# 用量采集、对账兜底与配额时区，语义见 docs/03 §5.2
user:
  trafficInterval: 1m
  reconcileInterval: 5m
  timeZone: Local
# 服务端链式下发，语义见 docs/03 §5.19：后台检查间隔；同一台服务器两次下发的最小间隔（每次下发都会重启该服务器的 Xray）
# userWriteLimit / userWriteWindow：每个用户在一个时间窗内最多改几次服务端规则（新建、修改、删除、调顺序）
chain:
  applyInterval: 30s
  minApplyInterval: 60s
  userWriteLimit: 10
  userWriteWindow: 1h
  # 每个用户发起出口延迟测试的频率（docs/03 §5.21）
  userTestLimit: 6
  userTestWindow: 1m
# 服务器位置扫描用的在线 IP 库，语义见 docs/03 §5.1（Ruling-65）：{ip} 处替换成面板报出的公网 IP，响应取 JSON 的 country；
# 写成 lookupUrl: "" 即关闭扫描。环境变量 HUB_GEOIP_LOOKUP_URL 可覆盖（联调用）
geoip:
  lookupUrl: https://api.country.is/{ip}
  timeout: 5s
# 总览分析，语义见 docs/03 §5.20（Ruling-66）：同一分区同一参数的结果缓存多久，0 = 不缓存
analytics:
  cacheTtl: 60s
# 大陆连通检测用的探测服务（Globalping），语义见 docs/03 §5.20（Ruling-67）：功能开关与检测间隔在系统设置里，这里只是接口地址与节奏。
# 令牌只走环境变量 HUB_GLOBALPING_TOKEN（可空）；环境变量 HUB_REACH_API_URL 可覆盖 apiUrl（联调用）
reach:
  apiUrl: https://api.globalping.io
  timeout: 40s
  checkInterval: 1m
# SSH 托管与面板部署，语义见 docs/03 §5.22：同时执行的主机任务数、领取排队任务的间隔、SSH 连接 / 普通动作 / 安装升级的时限、
# 每个管理员做连接测试与发起动作的频率、一次批量新建的上限。allowLoopback 只给联调用，这里必须是 false。
deploy:
  concurrency: 3
  pollInterval: 5s
  connectTimeout: 15s
  commandTimeout: 3m
  installTimeout: 20m
  testLimit: 20
  testWindow: 10m
  actionLimit: 60
  actionWindow: 10m
  maxBatch: 50
  allowLoopback: false
# 终端用户会话，语义见 docs/03 §5.3；登录频控与 Cookie 的 Secure 沿用 auth 段
portal:
  sessionIdleTimeout: 168h
  sessionMaxAge: 720h
  loginLogRetention: 2160h
# 订阅，语义见 docs/03 §5.4。自 M4 起以系统设置表为准（管理端 → 系统设置），这里只是设置表里还没有对应键时的默认值。
# baseUrl 留空时用请求自身的地址；生产填用户域名根地址
subscription:
  baseUrl: ""
  title: v2-hub
  updateIntervalHours: 12
  infoNodes: true
  logRetention: 720h
