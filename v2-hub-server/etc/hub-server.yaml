# hub-server 配置（入库，本地与部署共用）。凭据只从环境变量读，见 ../v2-hub-contract/deploy/.env.example。
server:
  listenAddr: ":8080"
  readTimeout: 10s
  writeTimeout: 30s
  shutdownTimeout: 15s
  # 只有来自这些网段的直连请求才采信 X-Forwarded-For（生产为 Caddy 所在 docker 网络；8080 不对外暴露）
  trustedProxies: ["127.0.0.1/32", "::1/128", "172.16.0.0/12"]
# 连接串（含密码）只从环境变量 HUB_DATABASE_URL 读；make run 会从 contract/deploy/.env 拼出开发库地址。
database:
  maxConns: 10
  pingTimeout: 2s
# 会话与登录频控，语义见 docs/03 §4.2。本机 HTTP 开发由 make run 设置 HUB_INSECURE_DEV_COOKIE=1 关闭 Secure。
auth:
  secureCookie: true
  sessionIdleTimeout: 2h
  sessionMaxAge: 168h
  sessionTouchInterval: 1m
  sessionCleanupInterval: 10m
  loginMaxFailures: 5
  loginWindow: 15m
  loginLockout: 15m
  loginMaxTrackedKeys: 10000
# 面板探测与同步，语义见 docs/03 §5.1
panel:
  probeInterval: 30s
  syncInterval: 5m
  requestTimeout: 15s
  concurrency: 8
# 用量采集、对账兜底与配额时区，语义见 docs/03 §5.2
user:
  trafficInterval: 1m
  reconcileInterval: 5m
  timeZone: Local
# 服务端链式下发，语义见 docs/03 §5.19：后台检查间隔；同一台服务器两次下发的最小间隔（每次下发都会重启该服务器的 Xray）
# userWriteLimit / userWriteWindow：每个用户在一个时间窗内最多改几次服务端规则（新建、修改、删除、调顺序）
chain:
  applyInterval: 30s
  minApplyInterval: 60s
  userWriteLimit: 10
  userWriteWindow: 1h
  # 每个用户发起出口延迟测试的频率（docs/03 §5.21）
  userTestLimit: 6
  userTestWindow: 1m
# 终端用户会话，语义见 docs/03 §5.3；登录频控与 Cookie 的 Secure 沿用 auth 段
portal:
  sessionIdleTimeout: 168h
  sessionMaxAge: 720h
  loginLogRetention: 2160h
# 订阅，语义见 docs/03 §5.4。自 M4 起以系统设置表为准（管理端 → 系统设置），这里只是设置表里还没有对应键时的默认值。
# baseUrl 留空时用请求自身的地址；生产填用户域名根地址
subscription:
  baseUrl: ""
  title: v2-hub
  updateIntervalHours: 12
  infoNodes: true
  logRetention: 720h
