      tags: [user-chain]
      operationId: updateChainRule
      summary: 改规则的名称与启用开关；他人的返回 404（R8）
      description: |
        入口与落地不能改，要换线路请删除后新建。套餐没开链式时返回 403 feature_disabled。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainRuleUpdateInput" }
      responses:
        "200":
          description: 改后的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainRule" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [user-chain]
      operationId: deleteChainRule
      summary: 删除规则；套餐没开链式时也允许；他人的返回 404（R8）
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/user/chain/custom-nodes:
    post:
      tags: [user-chain]
      operationId: createCustomNode
      summary: 添加一个自有落地节点
      description: |
        链接保存时解析校验，解析不了或协议不支持返回 400；套餐没开自有落地返回 403 feature_disabled；
        超过上限返回 400；同名返回 409。平台不向该地址发起任何连接（Ruling-38）。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomNodeInput" }
      responses:
        "200":
          description: 新建的自有落地节点
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CustomNode" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/user/chain/custom-nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [user-chain]
      operationId: updateCustomNode
      summary: 改自有落地节点的名称或链接；他人的返回 404（R8）
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomNodeUpdateInput" }
      responses:
        "200":
          description: 改后的自有落地节点
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CustomNode" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [user-chain]
      operationId: deleteCustomNode
      summary: 删除自有落地节点，引用它的规则一并删除；他人的返回 404（R8）
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/user/chain/custom-nodes/{id}/link:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [user-chain]
      operationId: getCustomNodeLink
      summary: 取自有落地节点的原链接（凭据）；他人的返回 404（R8）
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 原链接
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/NodeLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/user/chain/server-rules:
    post:
      tags: [user-chain]
      operationId: createServerChainRule
      summary: 新建一条服务端链式规则（docs/03 §5.19，0.4.2）
      description: |
        入口与落地都必须是本人当前可用的平台节点，入口所在面板须支持改内核配置；落地不能是 hysteria2、不能与入口相同。
        套餐没开服务端链式返回 403 feature_disabled；超过上限或节点不合要求返回 400；同一入口已有服务端规则返回 409。
        规则保存后由后台下发到入口面板，状态见 applyStatus。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerChainRuleInput" }
      responses:
        "200":
          description: 新建的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ServerChainRule" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/user/chain/server-rules/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [user-chain]
      operationId: updateServerChainRule
      summary: 启用或停用服务端规则；他人的返回 404（R8）（0.4.2）
      description: 入口与落地不能改，要换线路请删除后新建。套餐没开服务端链式时返回 403 feature_disabled。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerChainRuleUpdateInput" }
      responses:
        "200":
          description: 改后的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ServerChainRule" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [user-chain]
      operationId: deleteServerChainRule
      summary: 删除服务端规则；套餐没开时也允许；他人的返回 404（R8）（0.4.2）
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sub/{token}:
    get:
      tags: [subscription]
      operationId: getSubscription
      summary: 按格式渲染该用户的全部可用节点（docs/03 §5.4）
      description: |
        不走响应信封。响应头带 Subscription-Userinfo、Profile-Update-Interval、Profile-Title、Content-Disposition。
        用户非 active 时仍返回 200，内容只有一条说明状态的信息节点。
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{22,64}$" } }
        - name: format
          in: query
          description: 未指定时按 User-Agent 判断
          schema: { $ref: "#/components/schemas/SubscriptionFormat" }
      responses:
        "200":
          description: 订阅内容
          content:
            text/plain: { schema: { type: string } }
            application/yaml: { schema: { type: string } }
            application/json: { schema: { type: object, additionalProperties: true } }
        "400":
          description: format 取值不认识
          content:
            text/plain: { schema: { type: string } }
        "404":
          description: token 不存在
          content:
            text/plain: { schema: { type: string } }
        "429":
          description: 触发频控
          content:
            text/plain: { schema: { type: string } }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: hub_admin_session
    userSession:
      type: apiKey
      in: cookie
      name: hub_user_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Ok:
      description: 成功（data 为空）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    InvalidArgument:
      description: invalid_argument
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    PermissionDenied:
      description: permission_denied（缺权限码或 CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    AccountDisabled:
      description: account_disabled（账号已停用，只能查看本人信息与退出）或 permission_denied（CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Conflict:
      description: conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    UpstreamUnavailable:
      description: upstream_unavailable（面板不可达、拒绝 token 或返回异常）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    FeatureDisabled:
      description: feature_disabled（功能未开启：注册关闭、邮件未配置等）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    OrderConflict:
      description: insufficient_balance（余额不足，data.shortfall 为差额，单位分）或 conflict（商品当前不可买）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      shortfall: { type: integer, format: int64 }
    UserForbidden:
      description: account_disabled、feature_disabled（功能未开启）或 permission_denied（CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    RateLimited:
      description: rate_limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Envelope:
      type: object
      description: 业务接口统一响应信封（/healthz、/readyz 与 /sub 除外）
      required: [code, message]
      properties:
        code:
          type: string
          description: "\"0\" 表示成功，其余取值见 docs/03 §5"
        message:
          type: string
        data: {}
    Username:
      type: string
      pattern: "^[a-zA-Z0-9_.-]{3,64}$"
    Password:
      type: string
      minLength: 12
      maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 1, maxLength: 128 }
        totpCode: { $ref: "#/components/schemas/TotpCode" }
    TotpCode:
      type: string
      pattern: "^[0-9]{6}$"
    TotpCodeInput:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/TotpCode" }
    TotpSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: Base32 密钥，供无法扫码时手动输入 }
        otpauthUri: { type: string, description: "otpauth://totp/... 地址，前端渲染为二维码" }
    AdminBrief:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    Session:
      type: object
      required: [admin, permissions, csrfToken, totpEnabled]
      properties:
        admin: { $ref: "#/components/schemas/AdminBrief" }
        totpEnabled: { type: boolean }
        permissions:
          type: array
          description: 有效权限码（super_admin 返回全部）
          items: { type: string }
        csrfToken: { type: string }
    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Session" }
    Permission:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Role:
      type: object
      required: [id, code, name, isBuiltin, permissions]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        isBuiltin: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
          description: 仅新建时必填，创建后不可改
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 64
          items: { type: string }
    RoleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Role" }
    Admin:
      type: object
      required: [id, username, isDisabled, totpEnabled, roles, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        isDisabled: { type: boolean }
        totpEnabled: { type: boolean }
        roles:
          type: array
          items: { type: string, description: 角色 code }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminCreateInput:
      type: object
      required: [username, password, roles]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/Password" }
        roles:
          type: array
          maxItems: 16
          items: { type: string }
    AdminUpdateInput:
      type: object
      required: [roles, isDisabled]
      properties:
        roles:
          type: array
          maxItems: 16
          items: { type: string }
        isDisabled: { type: boolean }
    AdminEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Admin" }
    AuditLog:
      type: object
      required: [id, actorType, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorType: { type: string, enum: [admin, user, system] }
        actorId: { type: [integer, "null"], format: int64 }
        action: { type: string }
        targetType: { type: [string, "null"] }
        targetId: { type: [string, "null"] }
        detail: { type: [object, "null"], additionalProperties: true }
        clientIp: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    PanelBaseUrl:
      type: string
      maxLength: 512
      description: 面板根地址，含 scheme、端口与 web base path，如 https://panel.example.com:2053/abc
    TlsMode:
      type: string
      enum: [verify, pin, skip]
    ServerConnInput:
      type: object
      required: [providerType, baseUrl, apiToken, tlsMode]
      properties:
        providerType: { type: string, enum: [xui] }
        baseUrl: { $ref: "#/components/schemas/PanelBaseUrl" }
        apiToken: { type: string, maxLength: 512, description: 只写；更新时留空表示沿用原值 }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        certPinSha256: { type: string, maxLength: 128 }
    ServerInput:
      allOf:
        - $ref: "#/components/schemas/ServerConnInput"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 64 }
            region: { type: string, maxLength: 64 }
            remark: { type: string, maxLength: 255 }
            isDisabled: { type: boolean }
    PanelInfo:
      type: object
      required: [version, guid]
      properties:
        version: { type: string }
        guid: { type: string }
        status:
          type: [object, "null"]
          additionalProperties: true
          description: 资源快照（cpu、mem、uptime、xray 运行状态等，原样透传，字段随面板而定）
    Server:
      type: object
      required: [id, name, providerType, baseUrl, tlsMode, region, remark, isDisabled, status, lastError, panelVersion, inboundCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        providerType: { type: string }
        baseUrl: { type: string }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        certPinSha256: { type: [string, "null"] }
        region: { type: string }
        remark: { type: string }
        isDisabled: { type: boolean }
        status: { type: string, enum: [unknown, online, offline, auth_failed] }
        lastError: { type: string }
        lastSeenAt: { type: [string, "null"], format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        panelVersion: { type: string }
        statusSnapshot: { type: [object, "null"], additionalProperties: true }
        inboundCount: { type: integer }
        createdAt: { type: string, format: date-time }
    ServerEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Server" }
    SyncResult:
      type: object
      required: [inbounds, added, updated, missing, drifted]
      properties:
        inbounds: { type: integer, description: 面板上的入站总数 }
        added: { type: integer }
        updated: { type: integer }
        missing: { type: integer, description: 平台有、面板已不存在的入站数 }
        drifted: { type: integer, description: 本次发现面板侧改动的入站数 }
    Endpoint:
      type: object
      required: [id, address, port, remark, isDisabled, isMissing]
      properties:
        id: { type: integer, format: int64 }
        address: { type: string }
        port: { type: integer, description: 0 表示沿用入站端口 }
        remark: { type: string }
        isDisabled: { type: boolean }
        isMissing: { type: boolean }
    Inbound:
      type: object
      required: [id, serverId, remoteRef, protocol, port, listen, tag, remark, isEnabled, network, security, coreType, config, clientCount, isMissing, endpoints, createdAt]
      properties:
        id: { type: integer, format: int64 }
        serverId: { type: integer, format: int64 }
        remoteRef: { type: string }
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        tag: { type: string }
        remark: { type: string }
        isEnabled: { type: boolean }
        network: { type: string }
        security: { type: string }
        coreType: { type: string, enum: [xray] }
        config: { type: object, additionalProperties: true, description: 面板配置副本（settings、streamSettings、sniffing），敏感字段已删除 }
        clientCount: { type: integer }
        driftDetectedAt: { type: [string, "null"], format: date-time }
        isMissing: { type: boolean }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        createdAt: { type: string, format: date-time }
    InboundEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Inbound" }
    InboundTemplate:
      type: string
      enum: [vless-reality, vmess-ws, shadowsocks-2022]
    InboundCreateInput:
      type: object
      required: [remark, port]
      description: template 与 config 二选一；template 时按其参数生成配置与密钥，config 为高级 JSON（settings、streamSettings、sniffing）
      properties:
        remark: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        listen: { type: string, maxLength: 64 }
        enabled: { type: boolean, default: true }
        template: { $ref: "#/components/schemas/InboundTemplate" }
        templateParams:
          type: object
          description: vless-reality 需 target（如 www.cloudflare.com:443）与 serverNames；vmess-ws 需 path；shadowsocks-2022 可选 method
          additionalProperties: true
        protocol: { type: string, maxLength: 32, description: 高级 JSON 模式必填 }
        config: { type: object, additionalProperties: true, description: 高级 JSON 模式必填 }
    InboundPanelConfig:
      type: object
      required: [protocol, port, listen, remark, enabled, config]
      properties:
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        remark: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: 面板上的 settings / streamSettings / sniffing（含密钥，settings 不含 clients） }
    PanelKeyKind:
      type: string
      enum: [x25519, mldsa65, vlessenc]
    InboundUpdateInput:
      type: object
      required: [remark, port]
      properties:
        remark: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        listen: { type: string, maxLength: 64 }
        config: { type: object, additionalProperties: true, description: 省略则不改配置；提供时整体替换（敏感字段与 clients 由服务端补回） }
    EndpointInput:
      type: object
      required: [inboundIds, addresses]
      properties:
        inboundIds:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: integer, format: int64 }
        addresses:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 0, maximum: 65535, description: 0 表示沿用入站端口 }
        remark: { type: string, maxLength: 255 }
    Node:
      type: object
      required: [id, inboundId, serverId, serverName, protocol, address, port, displayName, region, tags, sortOrder, isEnabled, isMissing, groupIds]
      properties:
        id: { type: integer, format: int64 }
        inboundId: { type: integer, format: int64 }
        endpointId: { type: [integer, "null"], format: int64 }
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        protocol: { type: string }
        address: { type: string, description: 直连节点为面板主机名，Host 节点为对外地址 }
        port: { type: integer }
        displayName: { type: string }
        region: { type: string }
        tags:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
        isEnabled: { type: boolean }
        isMissing: { type: boolean, description: 来源入站或地址在面板上已不存在 }
        groupIds:
          type: array
          items: { type: integer, format: int64 }
    NodeInput:
      type: object
      required: [displayName, region, tags, sortOrder, isEnabled]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        region: { type: string, maxLength: 64 }
        tags:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 32 }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
        isEnabled: { type: boolean }
    NodeGroup:
      type: object
      required: [id, name, remark, nodeIds]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        remark: { type: string }
        nodeIds:
          type: array
          items: { type: integer, format: int64 }
    NodeGroupInput:
      type: object
      required: [name, nodeIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        remark: { type: string, maxLength: 255 }
        nodeIds:
          type: array
          maxItems: 5000
          items: { type: integer, format: int64 }
    TrafficReset:
      type: string
      enum: [never, hourly, daily, weekly, monthly]
    UserStatus:
      type: string
      enum: [active, limited, expired, disabled]
    ProvisionStatus:
      type: string
      enum: [pending, synced, failed]
    PlanBase:
      type: object
      required: [name, trafficLimit, durationDays, nodeGroupIds]
      description: 套餐的额度模板与售卖属性（docs/03 §5.2、§5.12）；免费续期自 0.4.0 起只在用户上（Ruling-20）
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        trafficLimit: { type: integer, format: int64, minimum: 0, description: 流量额度（字节），0 不限 }
        durationDays: { type: integer, minimum: 0, maximum: 36500, description: 时长（天），0 不限 }
        startOnFirstUse: { type: boolean, default: false, description: 首次使用后才开始计时 }
        limitIp: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        trafficResetDay: { type: integer, minimum: 1, maximum: 31, default: 1 }
        allowClientChain: { type: boolean, default: false }
        allowCustomNode: { type: boolean, default: false }
        allowServerChain: { type: boolean, default: false, description: 服务端链式（0.4.2，Ruling-41） }
        remark: { type: string, maxLength: 255 }
        nodeGroupIds:
          type: array
          maxItems: 500
          items: { type: integer, format: int64 }
        isOnSale: { type: boolean, default: false, description: 是否在商店上架；没有时长选项的套餐上架了也不显示（0.4.0） }
        isTrial: { type: boolean, default: false, description: 试用套餐：每个用户终身只能下单一次（0.4.0） }
        sortOrder: { type: integer, minimum: 0, maximum: 100000, default: 0, description: 商店里的排序，小的在前（0.4.0） }
        description: { type: string, maxLength: 500, description: 卖点说明，纯文本，一行一条（0.4.0） }
    PlanInput:
      allOf:
        - $ref: "#/components/schemas/PlanBase"
        - type: object
          properties:
            prices:
              type: array
              maxItems: 6
              description: 时长选项，整体替换；天数不得重复；省略 = 不改（新建时为空）（0.4.0）
              items: { $ref: "#/components/schemas/PlanPriceInput" }
    Plan:
      allOf:
        - $ref: "#/components/schemas/PlanBase"
        - type: object
          required: [id, userCount, createdAt, prices]
          properties:
            id: { type: integer, format: int64 }
            userCount: { type: integer, description: 当前分配了该套餐的用户数 }
            createdAt: { type: string, format: date-time }
            prices: { type: array, items: { $ref: "#/components/schemas/PlanPrice" }, description: 按天数升序（0.4.0） }
    UserQuotaInput:
      type: object
      required: [trafficLimit, trafficUsed, expiresAt, pendingDays, limitIp, renewEveryDays, renewMonthDay, renewWeekday, renewMax, trafficReset, trafficResetDay]
      properties:
        trafficLimit: { type: integer, format: int64, minimum: 0 }
        trafficUsed: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: [string, "null"], format: date-time, description: null 表示不过期（或等待首次使用） }
        pendingDays: { type: integer, minimum: 0, maximum: 36500, description: ">0 且 expiresAt 为 null：首次使用后起算的天数" }
        limitIp: { type: integer, minimum: 0, maximum: 1000 }
        renewEveryDays: { type: integer, minimum: 0, maximum: 3650 }
        renewMonthDay: { type: integer, minimum: 0, maximum: 31 }
        renewWeekday: { type: integer, minimum: 0, maximum: 7 }
        renewMax: { type: integer, minimum: 0, maximum: 10000 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        trafficResetDay: { type: integer, minimum: 1, maximum: 31 }
    User:
      allOf:
        - $ref: "#/components/schemas/UserQuotaInput"
        - type: object
          required: [id, username, remark, planId, planName, status, isDisabled, renewCount, provisions, createdAt]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
            remark: { type: string }
            planId: { type: [integer, "null"], format: int64 }
            planName: { type: string }
            status: { $ref: "#/components/schemas/UserStatus" }
            isDisabled: { type: boolean }
            renewCount: { type: integer }
            provisions:
              type: object
              description: 各面板下发状态计数
              required: [synced, pending, failed]
              properties:
                synced: { type: integer }
                pending: { type: integer }
                failed: { type: integer }
            totpEnabled: { type: boolean, description: 是否已开启两步验证（0.2.6） }
            lastUsedAt: { type: [string, "null"], format: date-time, description: 最近一次产生流量的时间（0.2.6） }
            email: { type: [string, "null"], description: 未绑定为 null（0.3.0） }
            isEmailVerified: { type: boolean, description: 0.3.0 }
            invitedBy: { type: [integer, "null"], format: int64, description: 邀请人用户 id（0.3.0） }
            invitedByUsername: { type: string, description: 没有邀请人时为空串（0.3.0） }
            balance: { type: integer, format: int64, description: 余额（分）（0.4.0） }
            autoRenew: { type: boolean, description: 是否开了扣余额自动续费（0.4.0） }
            createdAt: { type: string, format: date-time }
    UserCreateInput:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/UserPassword" }
        email: { $ref: "#/components/schemas/Email" }
        remark: { type: string, maxLength: 255 }
        planId: { type: integer, format: int64, minimum: 1, description: 省略则不分配套餐（无可用节点） }
    UserUpdateInput:
      type: object
      required: [remark, isDisabled]
      properties:
        remark: { type: string, maxLength: 255 }
        isDisabled: { type: boolean }
        email: { type: string, maxLength: 254, description: 省略不改；空串清除；其余按邮箱校验并视为已验证（0.3.0） }
    Provision:
      type: object
      required: [serverId, serverName, email, status, lastError, retryCount, syncedAt, updatedAt]
      properties:
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        email: { type: string, description: 面板上的 client email }
        status: { $ref: "#/components/schemas/ProvisionStatus" }
        lastError: { type: string }
        retryCount: { type: integer }
        syncedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    UserPassword:
      type: string
      minLength: 8
      maxLength: 128
    UserPasswordChangeInput:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { $ref: "#/components/schemas/UserPassword" }
    UserSession:
      type: object
      required: [user, csrfToken, totpEnabled]
      properties:
        user:
          type: object
          required: [id, username, status]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
            status: { $ref: "#/components/schemas/UserStatus" }
            email: { type: [string, "null"], description: 未绑定为 null（0.3.0） }
            isEmailVerified: { type: boolean, description: 0.3.0 }
        totpEnabled: { type: boolean }
        csrfToken: { type: string }
        impersonated: { type: boolean, description: 真 = 管理员代入的只读会话，除退出外的写请求都会被拒（0.4.0，Ruling-33） }
        features:
          type: object
          description: 当前套餐开了哪些功能，决定菜单显隐；后端仍做最终校验（0.4.1）
          required: [clientChain, customNode, serverChain]
          properties:
            clientChain: { type: boolean, description: 可以使用客户端链式 }
            customNode: { type: boolean, description: 可以添加自有落地节点 }
            serverChain: { type: boolean, description: 可以使用服务端链式（0.4.2） }
    UserSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserSession" }
    UserDashboard:
      type: object
      required: [status, planName, trafficLimit, trafficUsed, trafficToday, expiresAt, pendingDays, limitIp, onlineDevices, lastUsedAt, nodeCount]
      properties:
        status: { $ref: "#/components/schemas/UserStatus" }
        planName: { type: string, description: 没有套餐时为空串 }
        trafficLimit: { type: integer, format: int64, description: 字节，0 不限 }
        trafficUsed: { type: integer, format: int64 }
        trafficToday: { type: integer, format: int64, description: 今日（平台时区）已用字节 }
        expiresAt: { type: [string, "null"], format: date-time }
        pendingDays: { type: integer, description: 大于 0 表示首次使用后才开始计时的天数 }
        limitIp: { type: integer, description: 同时在线 IP 数，0 不限 }
        onlineDevices: { type: [integer, "null"], description: 各面板在线 client 数之和；面板都不提供时为 null }
        lastUsedAt: { type: [string, "null"], format: date-time }
        nodeCount: { type: integer, description: 当前可用节点数 }
        announcement: { oneOf: [{ $ref: "#/components/schemas/Announcement" }, { type: "null" }], description: 最新一条已发布公告（0.3.0） }
        popupAnnouncement: { oneOf: [{ $ref: "#/components/schemas/Announcement" }, { type: "null" }], description: 最新一条标了弹窗的已发布公告（0.3.0） }
        balance: { type: integer, format: int64, description: 余额（分）（0.4.0） }
    TrafficPoint:
      type: object
      required: [hour, up, down]
      properties:
        hour: { type: string, format: date-time }
        up: { type: integer, format: int64 }
        down: { type: integer, format: int64 }
    UserNode:
      type: object
      required: [id, name, region, protocol, isServerOnline, serverLoad, onlineClients]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        region: { type: string }
        protocol: { type: string }
        isServerOnline: { type: boolean }
        serverLoad: { type: [number, "null"], description: 所在服务器的 CPU 占用百分比，未知为 null }
        onlineClients: { type: integer, description: 所在服务器的在线 client 数 }
    UserNodeGroup:
      type: object
      required: [id, name, nodes]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/UserNode" } }
    NodeLink:
      type: object
      required: [link]
      properties:
        link: { type: string, description: 分享链接，属于凭据 }
    SubscriptionFormat:
      type: string
      enum: [base64, mihomo, singbox, xray]
    SubscriptionInfo:
      type: object
      required: [url, formats, updateIntervalHours]
      properties:
        url: { type: string, description: 不带 format 参数的订阅地址，属于凭据 }
        formats:
          type: array
          items:
            type: object
            required: [format, url]
            properties:
              format: { $ref: "#/components/schemas/SubscriptionFormat" }
              url: { type: string }
        updateIntervalHours: { type: integer }
    LoginLog:
      type: object
      required: [clientIp, isSuccess, createdAt]
      properties:
        clientIp: { type: string }
        isSuccess: { type: boolean }
        createdAt: { type: string, format: date-time }
    SubscribeLog:
      type: object
      required: [id, userId, username, format, clientIp, userAgent, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        format: { $ref: "#/components/schemas/SubscriptionFormat" }
        clientIp: { type: string }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
    SubscribeLogPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SubscribeLog" } }
        total: { type: integer, format: int64 }
    Email:
      type: string
      format: email
      maxLength: 254
    EmailCode:
      type: string
      pattern: "^[0-9]{6}$"
    Markdown:
      type: string
      maxLength: 20000
      description: Markdown 源文本；前端渲染不执行原始 HTML（Ruling-25）
    RegisterMode:
      type: string
      enum: [open, invite, closed]
    SiteInfo:
      type: object
      required: [siteName, registerMode, emailVerifyRequired, mailEnabled, checkinEnabled, ticketEnabled, sharedEnabled]
      properties:
        siteName: { type: string }
        registerMode: { $ref: "#/components/schemas/RegisterMode" }
        emailVerifyRequired: { type: boolean, description: 注册是否要先验证邮箱（设置为真且邮件可用） }
        mailEnabled: { type: boolean, description: 邮件是否可用；为假时找回口令与换绑邮箱不可用 }
        checkinEnabled: { type: boolean }
        ticketEnabled: { type: boolean }
        sharedEnabled: { type: boolean }
        shopEnabled: { type: boolean, description: 商店与钱包是否开启（0.4.0） }
        currency: { $ref: "#/components/schemas/Currency" }
        landing:
          type: object
          description: 落地页（0.4.3）；enabled 为假时 headline 与 intro 为空串
          required: [enabled, headline, intro]
          properties:
            enabled: { type: boolean }
            headline: { type: string, description: 空串 = 用站点名 }
            intro: { type: string, description: Markdown，按公告规则渲染（Ruling-25） }
        support:
          type: object
          description: 客服入口（0.4.3，Ruling-44）；url 为空串时不显示
          required: [url, label]
          properties:
            url: { type: string }
            label: { type: string }
    Settings:
      type: object
      description: 全部系统设置（docs/03 §5.6 设置清单），键名去掉点号改驼峰分组
      required: [site, register, invite, checkin, ticket, shared, mail, subscription, shop, rebate, notify, mailEnabled, alert, telegram, report, landing, support, telegramEnabled]
      properties:
        mailEnabled: { type: boolean, readOnly: true, description: SMTP 环境变量是否已配置（Ruling-24），不可经接口修改 }
        telegramEnabled: { type: boolean, readOnly: true, description: 环境变量 HUB_TELEGRAM_BOT_TOKEN 是否已配置（0.4.3，Ruling-42） }
        alert:
          type: object
          description: 掉线告警（0.4.3，docs/03 §5.20）
          required: [emails, offlineMinutes]
          properties:
            emails: { type: array, maxItems: 10, items: { type: string, maxLength: 254 } }
            offlineMinutes: { type: integer, minimum: 1, maximum: 60 }
        telegram:
          type: object
          description: Telegram 管理员通知（0.4.3，Ruling-42）
          required: [chatId, notifyAlerts, notifyTickets, notifyPayments]
          properties:
            chatId: { type: string, maxLength: 64, description: 空串 = 不发 }
            notifyAlerts: { type: boolean }
            notifyTickets: { type: boolean }
            notifyPayments: { type: boolean }
        report:
          type: object
          description: 运营日报（0.4.3）
          required: [dailyEnabled, dailyHour]
          properties:
            dailyEnabled: { type: boolean }
            dailyHour: { type: integer, minimum: 0, maximum: 23 }
        landing:
          type: object
          description: 落地页（0.4.3）
          required: [enabled, headline, intro]
          properties:
            enabled: { type: boolean }
            headline: { type: string, maxLength: 64 }
            intro: { type: string, maxLength: 2000 }
        support:
          type: object
          description: 客服入口（0.4.3，Ruling-44）
          required: [url, label]
          properties:
            url: { type: string, maxLength: 255, description: https:// 地址或空串 }
            label: { type: string, minLength: 1, maxLength: 16 }
        site:
          type: object
          required: [name, timezone]
          properties:
            name: { type: string, minLength: 1, maxLength: 32 }
            timezone: { type: string, minLength: 1, maxLength: 64, description: IANA 时区名 }
            portalUrl: { type: string, maxLength: 255, description: 客户门户的对外地址（https://…），切换为用户身份时用；空串 = 与管理端同源（0.4.0） }
        register:
          type: object
          required: [mode, emailVerify, emailAllow, emailBlock, planId]
          properties:
            mode: { $ref: "#/components/schemas/RegisterMode" }
            emailVerify: { type: boolean }
            emailAllow: { type: array, maxItems: 100, items: { type: string, maxLength: 253 } }
            emailBlock: { type: array, maxItems: 100, items: { type: string, maxLength: 253 } }
            planId: { type: integer, format: int64, minimum: 0, description: 0 = 注册不送套餐 }
        invite:
          type: object
          required: [userEnabled, userMaxUses]
          properties:
            userEnabled: { type: boolean }
            userMaxUses: { type: integer, minimum: 0, maximum: 10000 }
        checkin:
          type: object
          required: [enabled, minMb, maxMb]
          properties:
            enabled: { type: boolean }
            minMb: { type: integer, minimum: 1, maximum: 102400 }
            maxMb: { type: integer, minimum: 1, maximum: 102400 }
        ticket:
          type: object
          required: [enabled, notifyEmail]
          properties:
            enabled: { type: boolean }
            notifyEmail: { type: string, maxLength: 254, description: 空串 = 不通知 }
        shared:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
        mail:
          type: object
          required: [ratePerMinute]
          properties:
            ratePerMinute: { type: integer, minimum: 1, maximum: 600 }
        shop:
          type: object
          required: [enabled, currency]
          properties:
            enabled: { type: boolean }
            currency: { $ref: "#/components/schemas/Currency" }
        rebate:
          type: object
          required: [percent, mode]
          properties:
            percent: { type: integer, minimum: 0, maximum: 100, description: 0 = 关闭返利 }
            mode: { type: string, enum: [first, always], description: 只返被邀请人的首笔消费 / 每笔都返 }
        notify:
          type: object
          required: [expireDays, trafficPercent]
          properties:
            expireDays: { type: integer, minimum: 0, maximum: 30, description: 到期前几天提醒，0 = 不提醒 }
            trafficPercent: { type: integer, minimum: 0, maximum: 50, description: 剩余流量低于额度的百分之几时提醒，0 = 不提醒 }
        subscription:
          type: object
          required: [baseUrl, title, updateIntervalHours, infoNodes, logRetentionDays]
          properties:
            baseUrl: { type: string, maxLength: 255, description: 空串 = 取请求的协议与主机 }
            title: { type: string, minLength: 1, maxLength: 64 }
            updateIntervalHours: { type: integer, minimum: 1, maximum: 168 }
            infoNodes: { type: boolean }
            logRetentionDays: { type: integer, minimum: 1, maximum: 365 }
    SettingsInput:
      type: object
      description: 与 Settings 同形，但各分组与各键都可省略；只改出现的键
      properties:
        site: { type: object, additionalProperties: true }
        register: { type: object, additionalProperties: true }
        invite: { type: object, additionalProperties: true }
        checkin: { type: object, additionalProperties: true }
        ticket: { type: object, additionalProperties: true }
        shared: { type: object, additionalProperties: true }
        mail: { type: object, additionalProperties: true }
        shop: { type: object, additionalProperties: true }
        rebate: { type: object, additionalProperties: true }
        notify: { type: object, additionalProperties: true }
        subscription: { type: object, additionalProperties: true }
        alert: { type: object, additionalProperties: true }
        telegram: { type: object, additionalProperties: true }
        report: { type: object, additionalProperties: true }
        landing: { type: object, additionalProperties: true }
        support: { type: object, additionalProperties: true }
    TestMailInput:
      type: object
      required: [to]
      properties:
        to: { $ref: "#/components/schemas/Email" }
    MailStatus:
      type: string
      enum: [pending, sent, failed]
    MailOutboxItem:
      type: object
      required: [id, recipient, subject, status, attempts, lastError, createdAt, sentAt]
      properties:
        id: { type: integer, format: int64 }
        recipient: { type: string }
        subject: { type: string }
        status: { $ref: "#/components/schemas/MailStatus" }
        attempts: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
    MailOutboxPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MailOutboxItem" } }
        total: { type: integer, format: int64 }
    MailBatchResult:
      type: object
      required: [queued]
      properties:
        queued: { type: integer, description: 入发件箱的封数 }
    InviteCodeInput:
      type: object
      required: [maxUses, isDisabled]
      properties:
        maxUses: { type: integer, minimum: 0, maximum: 100000, description: 0 = 不限；个人码忽略本项 }
        expiresAt: { type: [string, "null"], format: date-time }
        remark: { type: string, maxLength: 255 }
        isDisabled: { type: boolean }
    InviteCode:
      type: object
      required: [id, code, kind, ownerUsername, maxUses, usedCount, expiresAt, isDisabled, remark, createdAt]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        kind: { type: string, enum: [admin, user] }
        ownerUserId: { type: [integer, "null"], format: int64 }
