openapi: 3.1.0
info:
  title: v2-hub API
  version: 0.2.0
  description: |
    v2-hub 对外接口契约（hub-server 提供，v2-hub-admin-web / v2-hub-user-web 消费）。
    - 管理端接口前缀 /api/admin，客户端接口前缀 /api/user，订阅端点前缀 /sub。
    - 会话用 HttpOnly + SameSite=Lax Cookie；非 GET/HEAD 请求必须带 X-CSRF-Token（docs/03 §4.2）。
    - 业务接口统一响应信封 Envelope；错误码表见 docs/03 §5。授权规则 R1–R7 见 docs/03 §4.1。
    版本纪律：additive 变更升修订号，破坏性变更升次版本号并在同一 PR 改引用方。
    0.2.0：新增管理员认证、管理员 / 角色 / 权限、审计日志接口。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: system
    description: 探活与系统信息
  - name: admin-auth
    description: 管理员登录、登出、当前会话
  - name: admin-rbac
    description: 管理员、角色、权限码（需 admin:read / admin:write）
  - name: admin-audit
    description: 审计日志（需 audit:read）
security:
  - adminSession: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: 存活探针（只说明进程在跑，不探测依赖）
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: 就绪探针（数据库可达才返回 200；失败原因只写服务端日志）
      security: []
      responses:
        "200":
          description: 依赖就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: 用户名口令登录，成功后 Set-Cookie hub_admin_session
      description: 失败一律 401“用户名或密码错误”；触发频控返回 429（docs/03 §4.2）。本接口不需要 CSRF 头。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: 登出并删除当前会话
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/auth/me:
    get:
      tags: [admin-auth]
      operationId: adminMe
      summary: 当前管理员、有效权限码与 CSRF token（前端据此渲染菜单）
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/admin/permissions:
    get:
      tags: [admin-rbac]
      operationId: listPermissions
      summary: 全部权限码（admin:read）
      responses:
        "200":
          description: 权限码列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Permission" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/roles:
    get:
      tags: [admin-rbac]
      operationId: listRoles
      summary: 全部角色及其权限码（admin:read）
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-rbac]
      operationId: createRole
      summary: 新建角色（admin:write；权限须为操作者子集，R2）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 新建的角色
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: updateRole
      summary: 修改角色名称与权限码（admin:write；内置角色不可改，R2、R6）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 修改后的角色
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin-rbac]
      operationId: deleteRole
      summary: 删除角色（admin:write；内置或被引用的角色不可删，R6）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins:
    get:
      tags: [admin-rbac]
      operationId: listAdmins
      summary: 分页列出管理员（admin:read）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 管理员分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Admin" }
                          total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-rbac]
      operationId: createAdmin
      summary: 新建管理员（admin:write；只能分配权限为自己子集的角色，R3）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateInput" }
      responses:
        "200":
          description: 新建的管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: updateAdmin
      summary: 修改管理员角色与禁用状态（admin:write；R3、R4、R5、R7）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateInput" }
      responses:
        "200":
          description: 修改后的管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}/password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: resetAdminPassword
      summary: 重置管理员口令（admin:write；对方全部会话失效，R7）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/audit-logs:
    get:
      tags: [admin-audit]
      operationId: listAuditLogs
      summary: 分页列出审计日志，按时间倒序（audit:read）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审计日志分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/AuditLog" }
                          total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: hub_admin_session
    userSession:
      type: apiKey
      in: cookie
      name: hub_user_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Ok:
      description: 成功（data 为空）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    InvalidArgument:
      description: invalid_argument
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    PermissionDenied:
      description: permission_denied（缺权限码或 CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Conflict:
      description: conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    RateLimited:
      description: rate_limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Envelope:
      type: object
      description: 业务接口统一响应信封（/healthz、/readyz 与 /sub 除外）
      required: [code, message]
      properties:
        code:
          type: string
          description: "\"0\" 表示成功，其余取值见 docs/03 §5"
        message:
          type: string
        data: {}
    Username:
      type: string
      pattern: "^[a-zA-Z0-9_.-]{3,64}$"
    Password:
      type: string
      minLength: 12
      maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 1, maxLength: 128 }
    AdminBrief:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    Session:
      type: object
      required: [admin, permissions, csrfToken]
      properties:
        admin: { $ref: "#/components/schemas/AdminBrief" }
        permissions:
          type: array
          description: 有效权限码（super_admin 返回全部）
          items: { type: string }
        csrfToken: { type: string }
    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Session" }
    Permission:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Role:
      type: object
      required: [id, code, name, isBuiltin, permissions]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        isBuiltin: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
          description: 仅新建时必填，创建后不可改
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 64
          items: { type: string }
    RoleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Role" }
    Admin:
      type: object
      required: [id, username, isDisabled, roles, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        isDisabled: { type: boolean }
        roles:
          type: array
          items: { type: string, description: 角色 code }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminCreateInput:
      type: object
      required: [username, password, roles]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/Password" }
        roles:
          type: array
          maxItems: 16
          items: { type: string }
    AdminUpdateInput:
      type: object
      required: [roles, isDisabled]
      properties:
        roles:
          type: array
          maxItems: 16
          items: { type: string }
        isDisabled: { type: boolean }
    AdminEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Admin" }
    AuditLog:
      type: object
      required: [id, actorType, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorType: { type: string, enum: [admin, user, system] }
        actorId: { type: [integer, "null"], format: int64 }
        action: { type: string }
        targetType: { type: [string, "null"] }
        targetId: { type: [string, "null"] }
        detail: { type: [object, "null"] }
        clientIp: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
