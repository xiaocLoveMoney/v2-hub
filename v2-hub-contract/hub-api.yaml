        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
    post:
      tags: [user-shop]
      operationId: createOrder
      summary: 下单并从余额扣款，成功即生效（docs/03 §5.13，Ruling-28）
      description: |
        余额不足返回 409 insufficient_balance，data.shortfall 为差额（分）；商品不可买返回 409 conflict。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "200":
          description: 下单并从余额扣款，成功即生效
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "409": { $ref: "#/components/responses/OrderConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/wallet:
    get:
      tags: [user-shop]
      operationId: getWallet
      summary: 余额、自动续费状态、可用的充值方式与累计返利（docs/03 §5.14）
