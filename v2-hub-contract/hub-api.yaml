      description: |
        商品不可买（未上架、试用已用过、没有套餐却买流量包等）返回 409；优惠码无效返回 400。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "200":
          description: 询价：原价、优惠、应付、差额与下单后的到期时间；不落库、不占优惠码次数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/orders:
