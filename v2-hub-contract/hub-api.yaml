openapi: 3.1.0
info:
  title: v2-hub API
  version: 0.2.4
  description: |
    v2-hub 对外接口契约（hub-server 提供，v2-hub-admin-web / v2-hub-user-web 消费）。
    - 管理端接口前缀 /api/admin，客户端接口前缀 /api/user，订阅端点前缀 /sub。
    - 会话用 HttpOnly + SameSite=Lax Cookie；非 GET/HEAD 请求必须带 X-CSRF-Token（docs/03 §4.2）。
    - 业务接口统一响应信封 Envelope；错误码表见 docs/03 §5。授权规则 R1–R7 见 docs/03 §4.1。
    版本纪律：additive 变更升修订号，破坏性变更升次版本号并在同一 PR 改引用方。
    0.2.0：新增管理员认证、管理员 / 角色 / 权限、审计日志接口。
    0.2.2：M1 服务器接入、入站增删改查、Host 端点、节点目录与节点组；错误响应 UpstreamUnavailable（502）。
    0.2.1：两步验证（docs/03 §4.3）——登录可带 totpCode，新增 totp_required 错误码与 TOTP 开启 / 关闭 / 重置接口。
    0.2.3：删除对外地址只删所点的那一个；对“面板上已不存在”的入站做编辑 / 启停 / 确认漂移 / 添加对外地址返回 409（docs/03 §5.1）。
    0.2.4：入站表单与 3x-ui 同构（Ruling-16）——新增读取面板完整入站配置、代理面板生成密钥两个接口。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: system
    description: 探活与系统信息
  - name: admin-auth
    description: 管理员登录、登出、当前会话
  - name: admin-rbac
    description: 管理员、角色、权限码（需 admin:read / admin:write）
  - name: admin-audit
    description: 审计日志（需 audit:read）
  - name: admin-panel
    description: 服务器（server:*）、入站与节点（node:*），docs/03 §5.1
security:
  - adminSession: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: 存活探针（只说明进程在跑，不探测依赖）
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: 就绪探针（数据库可达才返回 200；失败原因只写服务端日志）
      security: []
      responses:
        "200":
          description: 依赖就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: 用户名口令登录，成功后 Set-Cookie hub_admin_session
      description: 失败一律 401“用户名或密码错误”；触发频控返回 429（docs/03 §4.2）。本接口不需要 CSRF 头。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401":
          description: unauthenticated（用户名或口令错误）或 totp_required（需再提交验证码）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: 登出并删除当前会话
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/auth/me:
    get:
      tags: [admin-auth]
      operationId: adminMe
      summary: 当前管理员、有效权限码与 CSRF token（前端据此渲染菜单）
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/admin/auth/totp/setup:
    post:
      tags: [admin-auth]
      operationId: adminTotpSetup
      summary: 生成待确认的 TOTP 密钥，返回 otpauth 地址与 Base32 密钥（只返回这一次）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 待确认的密钥
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/auth/totp/enable:
    post:
      tags: [admin-auth]
      operationId: adminTotpEnable
      summary: 提交验证码确认并开启两步验证
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/totp/disable:
    post:
      tags: [admin-auth]
      operationId: adminTotpDisable
      summary: 提交当前验证码关闭两步验证
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/admin/permissions:
    get:
      tags: [admin-rbac]
      operationId: listPermissions
      summary: 全部权限码（admin:read）
      responses:
        "200":
          description: 权限码列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Permission" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/roles:
    get:
      tags: [admin-rbac]
      operationId: listRoles
      summary: 全部角色及其权限码（admin:read）
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-rbac]
      operationId: createRole
      summary: 新建角色（admin:write；权限须为操作者子集，R2）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 新建的角色
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: updateRole
      summary: 修改角色名称与权限码（admin:write；内置角色不可改，R2、R6）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 修改后的角色
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin-rbac]
      operationId: deleteRole
      summary: 删除角色（admin:write；内置或被引用的角色不可删，R6）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins:
    get:
      tags: [admin-rbac]
      operationId: listAdmins
      summary: 分页列出管理员（admin:read）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 管理员分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Admin" }
                          total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-rbac]
      operationId: createAdmin
      summary: 新建管理员（admin:write；只能分配权限为自己子集的角色，R3）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateInput" }
      responses:
        "200":
          description: 新建的管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: updateAdmin
      summary: 修改管理员角色与禁用状态（admin:write；R3、R4、R5、R7）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateInput" }
      responses:
        "200":
          description: 修改后的管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}/password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: resetAdminPassword
      summary: 重置管理员口令（admin:write；对方全部会话失效，R7）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/admins/{id}/totp:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [admin-rbac]
      operationId: resetAdminTotp
      summary: 清除他人的两步验证（遗失设备时；admin:write，R3、R4；对方全部会话失效）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/audit-logs:
    get:
      tags: [admin-audit]
      operationId: listAuditLogs
      summary: 分页列出审计日志，按时间倒序（audit:read）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审计日志分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/AuditLog" }
                          total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }

  /api/admin/servers:
    get:
      tags: [admin-panel]
      operationId: listServers
      summary: 全部服务器及其连接状态（server:read）
      responses:
        "200":
          description: 服务器列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-panel]
      operationId: createServer
      summary: 接入一台面板（server:write）；保存前先探测，探测失败不保存
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerInput" }
      responses:
        "200":
          description: 新接入的服务器（已完成一次同步）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/test:
    post:
      tags: [admin-panel]
      operationId: testServer
      summary: 用未保存的接入信息探测面板（server:write），返回面板版本等信息
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerConnInput" }
      responses:
        "200":
          description: 探测成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PanelInfo" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/cert-fingerprint:
    post:
      tags: [admin-panel]
      operationId: serverCertFingerprint
      summary: 不校验证书地连接 https 面板，返回叶子证书 SHA-256（Base64），供 tlsMode=pin 使用（server:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl]
              properties:
                baseUrl: { $ref: "#/components/schemas/PanelBaseUrl" }
      responses:
        "200":
          description: 证书指纹
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sha256]
                        properties:
                          sha256: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-panel]
      operationId: getServer
      summary: 服务器详情（server:read）
      responses:
        "200":
          description: 服务器
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin-panel]
      operationId: updateServer
      summary: 修改服务器（server:write）；apiToken 留空表示沿用原值；连接信息变化时先探测
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerInput" }
      responses:
        "200":
          description: 修改后的服务器
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      tags: [admin-panel]
      operationId: deleteServer
      summary: 移除服务器及其入站、节点的平台记录（server:write）；不改动面板本身
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/servers/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-panel]
      operationId: syncServer
      summary: 立即探测并同步该服务器的入站与 Host（server:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 同步结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SyncResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/{id}/inbounds:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-panel]
      operationId: listServerInbounds
      summary: 该服务器的入站（平台缓存，node:read）
      responses:
        "200":
          description: 入站列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Inbound" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin-panel]
      operationId: createInbound
      summary: 在该服务器上新建入站（node:write）：按模板或高级 JSON；写入面板后回读落库并生成直连节点
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboundCreateInput" }
      responses:
        "200":
          description: 新建的入站
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/{id}/endpoints:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-panel]
      operationId: createEndpoint
      summary: 为该服务器的入站添加对外地址（3x-ui Host，node:write），每个地址生成一个节点
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/inbounds/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-panel]
      operationId: getInbound
      summary: 入站详情（缓存副本，敏感字段已删除；node:read）
      responses:
        "200":
          description: 入站
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin-panel]
      operationId: updateInbound
      summary: 修改入站（node:write）；config 省略的敏感字段与面板现有 clients 由服务端保留
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboundUpdateInput" }
      responses:
        "200":
          description: 修改后的入站
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      tags: [admin-panel]
      operationId: deleteInbound
      summary: 删除入站（node:write）：先删面板，再删平台记录与节点
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/inbounds/{id}/enabled:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-panel]
      operationId: setInboundEnabled
      summary: 启用或停用入站（写面板，node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: 修改后的入站
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/inbounds/{id}/drift/ack:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-panel]
      operationId: ackInboundDrift
      summary: 确认面板侧改动（清除漂移标记，以当前面板配置为准；node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/inbounds/{id}/panel-config:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-panel]
      operationId: getInboundPanelConfig
      summary: 从面板实时读取入站完整配置（含私钥与口令、不含 clients），供编辑表单使用；每次读取记审计（Ruling-16，node:write）
      responses:
        "200":
          description: 面板上的入站配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InboundPanelConfig" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-panel]
      operationId: generatePanelKeys
      summary: 让该服务器的面板生成一组密钥（Reality x25519、ML-DSA-65、VLESS encryption），原样返回给表单（Ruling-16，node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: "#/components/schemas/PanelKeyKind" }
      responses:
        "200":
          description: 面板生成的密钥
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                        description: x25519 → {privateKey, publicKey}；mldsa65 → {seed, verify}；vlessenc → {auths:[{label, decryption, encryption}]}
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/endpoints/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [admin-panel]
      operationId: deleteEndpoint
      summary: 只删除这一个对外地址（该入站上的这个地址；同组其它地址保留，docs/03 §5.1，node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/nodes:
    get:
      tags: [admin-panel]
      operationId: listNodes
      summary: 节点目录（node:read），可按服务器、节点组过滤
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: serverId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: groupId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: 节点分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Node" }
                          total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-panel]
      operationId: updateNode
      summary: 修改节点的展示属性（只影响平台，node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/node-groups:
    get:
      tags: [admin-panel]
      operationId: listNodeGroups
      summary: 全部节点组（node:read）
      responses:
        "200":
          description: 节点组列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/NodeGroup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-panel]
      operationId: createNodeGroup
      summary: 新建节点组（node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeGroupInput" }
      responses:
        "200":
          description: 新建的节点组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/NodeGroup" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/node-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-panel]
      operationId: updateNodeGroup
      summary: 修改节点组名称、备注与成员（整体替换成员，node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeGroupInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin-panel]
      operationId: deleteNodeGroup
      summary: 删除节点组（不删除节点，node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: hub_admin_session
    userSession:
      type: apiKey
      in: cookie
      name: hub_user_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Ok:
      description: 成功（data 为空）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    InvalidArgument:
      description: invalid_argument
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    PermissionDenied:
      description: permission_denied（缺权限码或 CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Conflict:
      description: conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    UpstreamUnavailable:
      description: upstream_unavailable（面板不可达、拒绝 token 或返回异常）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    RateLimited:
      description: rate_limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Envelope:
      type: object
      description: 业务接口统一响应信封（/healthz、/readyz 与 /sub 除外）
      required: [code, message]
      properties:
        code:
          type: string
          description: "\"0\" 表示成功，其余取值见 docs/03 §5"
        message:
          type: string
        data: {}
    Username:
      type: string
      pattern: "^[a-zA-Z0-9_.-]{3,64}$"
    Password:
      type: string
      minLength: 12
      maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 1, maxLength: 128 }
        totpCode: { $ref: "#/components/schemas/TotpCode" }
    TotpCode:
      type: string
      pattern: "^[0-9]{6}$"
    TotpCodeInput:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/TotpCode" }
    TotpSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: Base32 密钥，供无法扫码时手动输入 }
        otpauthUri: { type: string, description: "otpauth://totp/... 地址，前端渲染为二维码" }
    AdminBrief:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    Session:
      type: object
      required: [admin, permissions, csrfToken, totpEnabled]
      properties:
        admin: { $ref: "#/components/schemas/AdminBrief" }
        totpEnabled: { type: boolean }
        permissions:
          type: array
          description: 有效权限码（super_admin 返回全部）
          items: { type: string }
        csrfToken: { type: string }
    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Session" }
    Permission:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Role:
      type: object
      required: [id, code, name, isBuiltin, permissions]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        isBuiltin: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
          description: 仅新建时必填，创建后不可改
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 64
          items: { type: string }
    RoleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Role" }
    Admin:
      type: object
      required: [id, username, isDisabled, totpEnabled, roles, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        isDisabled: { type: boolean }
        totpEnabled: { type: boolean }
        roles:
          type: array
          items: { type: string, description: 角色 code }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminCreateInput:
      type: object
      required: [username, password, roles]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/Password" }
        roles:
          type: array
          maxItems: 16
          items: { type: string }
    AdminUpdateInput:
      type: object
      required: [roles, isDisabled]
      properties:
        roles:
          type: array
          maxItems: 16
          items: { type: string }
        isDisabled: { type: boolean }
    AdminEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Admin" }
    AuditLog:
      type: object
      required: [id, actorType, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorType: { type: string, enum: [admin, user, system] }
        actorId: { type: [integer, "null"], format: int64 }
        action: { type: string }
        targetType: { type: [string, "null"] }
        targetId: { type: [string, "null"] }
        detail: { type: [object, "null"], additionalProperties: true }
        clientIp: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    PanelBaseUrl:
      type: string
      maxLength: 512
      description: 面板根地址，含 scheme、端口与 web base path，如 https://panel.example.com:2053/abc
    TlsMode:
      type: string
      enum: [verify, pin, skip]
    ServerConnInput:
      type: object
      required: [providerType, baseUrl, apiToken, tlsMode]
      properties:
        providerType: { type: string, enum: [xui] }
        baseUrl: { $ref: "#/components/schemas/PanelBaseUrl" }
        apiToken: { type: string, maxLength: 512, description: 只写；更新时留空表示沿用原值 }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        certPinSha256: { type: string, maxLength: 128 }
    ServerInput:
      allOf:
        - $ref: "#/components/schemas/ServerConnInput"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 64 }
            region: { type: string, maxLength: 64 }
            remark: { type: string, maxLength: 255 }
            isDisabled: { type: boolean }
    PanelInfo:
      type: object
      required: [version, guid]
      properties:
        version: { type: string }
        guid: { type: string }
        status:
          type: [object, "null"]
          additionalProperties: true
          description: 资源快照（cpu、mem、uptime、xray 运行状态等，原样透传，字段随面板而定）
    Server:
      type: object
      required: [id, name, providerType, baseUrl, tlsMode, region, remark, isDisabled, status, lastError, panelVersion, inboundCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        providerType: { type: string }
        baseUrl: { type: string }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        certPinSha256: { type: [string, "null"] }
        region: { type: string }
        remark: { type: string }
        isDisabled: { type: boolean }
        status: { type: string, enum: [unknown, online, offline, auth_failed] }
        lastError: { type: string }
        lastSeenAt: { type: [string, "null"], format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        panelVersion: { type: string }
        statusSnapshot: { type: [object, "null"], additionalProperties: true }
        inboundCount: { type: integer }
        createdAt: { type: string, format: date-time }
    ServerEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Server" }
    SyncResult:
      type: object
      required: [inbounds, added, updated, missing, drifted]
      properties:
        inbounds: { type: integer, description: 面板上的入站总数 }
        added: { type: integer }
        updated: { type: integer }
        missing: { type: integer, description: 平台有、面板已不存在的入站数 }
        drifted: { type: integer, description: 本次发现面板侧改动的入站数 }
    Endpoint:
      type: object
      required: [id, address, port, remark, isDisabled, isMissing]
      properties:
        id: { type: integer, format: int64 }
        address: { type: string }
        port: { type: integer, description: 0 表示沿用入站端口 }
        remark: { type: string }
        isDisabled: { type: boolean }
        isMissing: { type: boolean }
    Inbound:
      type: object
      required: [id, serverId, remoteRef, protocol, port, listen, tag, remark, isEnabled, network, security, coreType, config, clientCount, isMissing, endpoints, createdAt]
      properties:
        id: { type: integer, format: int64 }
        serverId: { type: integer, format: int64 }
        remoteRef: { type: string }
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        tag: { type: string }
        remark: { type: string }
        isEnabled: { type: boolean }
        network: { type: string }
        security: { type: string }
        coreType: { type: string, enum: [xray] }
        config: { type: object, additionalProperties: true, description: 面板配置副本（settings、streamSettings、sniffing），敏感字段已删除 }
        clientCount: { type: integer }
        driftDetectedAt: { type: [string, "null"], format: date-time }
        isMissing: { type: boolean }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        createdAt: { type: string, format: date-time }
    InboundEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Inbound" }
    InboundTemplate:
      type: string
      enum: [vless-reality, vmess-ws, shadowsocks-2022]
    InboundCreateInput:
      type: object
      required: [remark, port]
      description: template 与 config 二选一；template 时按其参数生成配置与密钥，config 为高级 JSON（settings、streamSettings、sniffing）
      properties:
        remark: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        listen: { type: string, maxLength: 64 }
        enabled: { type: boolean, default: true }
        template: { $ref: "#/components/schemas/InboundTemplate" }
        templateParams:
          type: object
          description: vless-reality 需 target（如 www.cloudflare.com:443）与 serverNames；vmess-ws 需 path；shadowsocks-2022 可选 method
          additionalProperties: true
        protocol: { type: string, maxLength: 32, description: 高级 JSON 模式必填 }
        config: { type: object, additionalProperties: true, description: 高级 JSON 模式必填 }
    InboundPanelConfig:
      type: object
      required: [protocol, port, listen, remark, enabled, config]
      properties:
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        remark: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: 面板上的 settings / streamSettings / sniffing（含密钥，settings 不含 clients） }
    PanelKeyKind:
      type: string
      enum: [x25519, mldsa65, vlessenc]
    InboundUpdateInput:
      type: object
      required: [remark, port]
      properties:
        remark: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        listen: { type: string, maxLength: 64 }
        config: { type: object, additionalProperties: true, description: 省略则不改配置；提供时整体替换（敏感字段与 clients 由服务端补回） }
    EndpointInput:
      type: object
      required: [inboundIds, addresses]
      properties:
        inboundIds:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: integer, format: int64 }
        addresses:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 0, maximum: 65535, description: 0 表示沿用入站端口 }
        remark: { type: string, maxLength: 255 }
    Node:
      type: object
      required: [id, inboundId, serverId, serverName, protocol, address, port, displayName, region, tags, sortOrder, isEnabled, isMissing, groupIds]
      properties:
        id: { type: integer, format: int64 }
        inboundId: { type: integer, format: int64 }
        endpointId: { type: [integer, "null"], format: int64 }
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        protocol: { type: string }
        address: { type: string, description: 直连节点为面板主机名，Host 节点为对外地址 }
        port: { type: integer }
        displayName: { type: string }
        region: { type: string }
        tags:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
        isEnabled: { type: boolean }
        isMissing: { type: boolean, description: 来源入站或地址在面板上已不存在 }
        groupIds:
          type: array
          items: { type: integer, format: int64 }
    NodeInput:
      type: object
      required: [displayName, region, tags, sortOrder, isEnabled]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        region: { type: string, maxLength: 64 }
        tags:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 32 }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
        isEnabled: { type: boolean }
    NodeGroup:
      type: object
      required: [id, name, remark, nodeIds]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        remark: { type: string }
        nodeIds:
          type: array
          items: { type: integer, format: int64 }
    NodeGroupInput:
      type: object
      required: [name, nodeIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        remark: { type: string, maxLength: 255 }
        nodeIds:
          type: array
          maxItems: 5000
          items: { type: integer, format: int64 }
