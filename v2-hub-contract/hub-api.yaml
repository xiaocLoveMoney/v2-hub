    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-panel]
      operationId: testChainExitAsAdmin
      summary: 从一台服务器测试出口的延迟（node:write；0.6.0）
      description: |
        由指定服务器的面板去连出口并返回结果，hub-server 自己不连出口（Ruling-52）。平台出口与用户出口都可测；
        用户出口先过服务端链式的地址限制（docs/03 §5.19），不过返回 400。不改任何状态，不记审计。
        同一台服务器同时只跑一个测试，占用中返回 409。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
