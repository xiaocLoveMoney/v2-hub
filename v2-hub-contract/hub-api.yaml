                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FinanceStats" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/finance/stats.csv:
    get:
      tags: [admin-finance]
      operationId: exportFinanceStats
      summary: 把收支统计导出为 CSV（finance:read；docs/03 §5.20，0.4.3）
      description: 参数同 /api/admin/finance/stats。不走响应信封；UTF-8 带 BOM，金额以元为单位、两位小数；记审计。
      parameters:
        - { name: granularity, in: query, schema: { $ref: "#/components/schemas/FinanceGranularity" } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 12 } }
      responses:
        "200":
          description: CSV 文件
          headers:
            Content-Disposition: { schema: { type: string }, description: attachment; filename=finance-<粒度>-<日期>.csv }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/users/{id}/balance:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-users]
      operationId: adjustUserBalance
      summary: 调整用户余额：可正可负，须写备注，记流水与审计（finance:write）
      description: |
        调整后余额为负或超过上限返回 409。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BalanceAdjustInput" }
      responses:
        "200":
          description: 调整用户余额：可正可负，须写备注，记流水与审计
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/users/{id}/impersonate:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-users]
      operationId: impersonateUser
      summary: 签发切换为该用户身份的一次性票据（impersonate:write，docs/03 §5.17）
      description: |
        票据 60 秒内有效、只能用一次；管理端拿到后打开 `{portalUrl}/impersonate#ticket=…`，由客户门户兑换成只读会话。
