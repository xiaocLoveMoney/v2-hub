          application/json:
            schema: { $ref: "#/components/schemas/UserQuotaInput" }
      responses:
        "200":
          description: 修改后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-users]
      operationId: resetUserPassword
      summary: 重置用户的客户后台登录口令（user:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { $ref: "#/components/schemas/UserPassword" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/users/{id}/provisions:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-users]
      operationId: listUserProvisions
      summary: 用户在各面板上的下发状态（user:read）
      responses:
        "200":
          description: 下发状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Provision" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/users/{id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-users]
      operationId: reconcileUser
      summary: 立即对账该用户涉及的全部面板（手动重试；user:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/users/{id}/subscription/reset:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-users]
      operationId: resetUserSubscription
      summary: 重置该用户的订阅地址并轮换连接凭据（user:write）；旧地址与旧凭据立即失效并触发对账
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/users/{id}/totp:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [admin-users]
      operationId: clearUserTotp
      summary: 清除该用户的两步验证（遗失设备时用；user:write），其全部会话失效
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/subscribe-logs:
    get:
      tags: [admin-users]
      operationId: listSubscribeLogs
      summary: 订阅拉取记录分页（user:read），按时间倒序
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: userId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: 订阅记录分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SubscribeLogPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }

  /api/user/auth/login:
    post:
      tags: [user-auth]
      operationId: userLogin
      summary: 终端用户登录，成功后 Set-Cookie hub_user_session
      description: 失败一律 401“用户名或密码错误”；触发频控返回 429（docs/03 §5.3）。本接口不需要 CSRF 头。停用的账号可以登录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSessionEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401":
          description: unauthenticated（用户名或口令错误）或 totp_required（需再提交验证码）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/auth/logout:
    post:
      tags: [user-auth]
      operationId: userLogout
      summary: 登出并删除当前会话
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/user/auth/me:
    get:
      tags: [user-auth]
      operationId: userMe
      summary: 当前用户、状态与 CSRF token（停用的账号也可访问）
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSessionEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/user/auth/password:
    put:
      tags: [user-auth]
      operationId: userChangePassword
      summary: 本人改口令（须提交旧口令）；成功后其余会话全部失效
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPasswordChangeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/auth/totp/setup:
    post:
      tags: [user-auth]
      operationId: userTotpSetup
      summary: 生成待确认的 TOTP 密钥（只返回这一次）
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 待确认的密钥
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/user/auth/totp/enable:
    post:
      tags: [user-auth]
      operationId: userTotpEnable
      summary: 提交验证码确认并开启两步验证
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/auth/totp/disable:
    post:
      tags: [user-auth]
      operationId: userTotpDisable
      summary: 提交当前验证码关闭两步验证
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/user/dashboard:
    get:
      tags: [user-portal]
      operationId: getUserDashboard
      summary: 仪表盘：套餐、额度与用量、到期、在线设备、最近使用（docs/03 §5.5）
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 仪表盘
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
  /api/user/traffic:
    get:
      tags: [user-portal]
      operationId: listUserTraffic
      summary: 最近若干小时按小时的用量，时间升序；没有用量的小时不返回
      security: [{ userSession: [] }]
      parameters:
        - { name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 720, default: 72 } }
      responses:
        "200":
          description: 按小时用量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/TrafficPoint" } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
  /api/user/nodes:
    get:
      tags: [user-portal]
      operationId: listUserNodes
      summary: 本人被授权且启用的节点，按节点组分段；状态取平台缓存
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 节点分段
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/UserNodeGroup" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
  /api/user/nodes/{id}/link:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [user-portal]
      operationId: getUserNodeLink
      summary: 该节点的分享链接（凭据）；节点不在本人授权范围内返回 404，账号非 active 返回 409
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 分享链接
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/NodeLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/user/subscription:
    get:
      tags: [user-portal]
      operationId: getUserSubscription
      summary: 本人的订阅地址（凭据，前端默认打码）与各格式地址；尚无 token 时生成
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 订阅地址
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SubscriptionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
  /api/user/subscription/reset:
    post:
      tags: [user-portal]
      operationId: resetOwnSubscription
      summary: 重置订阅地址并轮换连接凭据；旧地址与旧凭据立即失效，客户端需重新导入
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 新的订阅地址
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SubscriptionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/login-logs:
    get:
      tags: [user-portal]
      operationId: listUserLoginLogs
      summary: 本人最近 10 次登录记录
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 登录记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/LoginLog" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
  /api/user/subscribe-logs:
    get:
      tags: [user-portal]
      operationId: listOwnSubscribeLogs
      summary: 本人的订阅拉取记录分页，按时间倒序
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 订阅记录分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SubscribeLogPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }

  /sub/{token}:
    get:
      tags: [subscription]
      operationId: getSubscription
      summary: 按格式渲染该用户的全部可用节点（docs/03 §5.4）
      description: |
        不走响应信封。响应头带 Subscription-Userinfo、Profile-Update-Interval、Profile-Title、Content-Disposition。
        用户非 active 时仍返回 200，内容只有一条说明状态的信息节点。
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{22,64}$" } }
        - name: format
          in: query
          description: 未指定时按 User-Agent 判断
          schema: { $ref: "#/components/schemas/SubscriptionFormat" }
      responses:
        "200":
          description: 订阅内容
          content:
            text/plain: { schema: { type: string } }
            application/yaml: { schema: { type: string } }
            application/json: { schema: { type: object, additionalProperties: true } }
        "400":
          description: format 取值不认识
          content:
            text/plain: { schema: { type: string } }
        "404":
          description: token 不存在
          content:
            text/plain: { schema: { type: string } }
        "429":
          description: 触发频控
          content:
            text/plain: { schema: { type: string } }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: hub_admin_session
    userSession:
      type: apiKey
      in: cookie
      name: hub_user_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Ok:
      description: 成功（data 为空）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    InvalidArgument:
      description: invalid_argument
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    PermissionDenied:
      description: permission_denied（缺权限码或 CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    AccountDisabled:
      description: account_disabled（账号已停用，只能查看本人信息与退出）或 permission_denied（CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Conflict:
      description: conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    UpstreamUnavailable:
      description: upstream_unavailable（面板不可达、拒绝 token 或返回异常）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    RateLimited:
      description: rate_limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Envelope:
      type: object
      description: 业务接口统一响应信封（/healthz、/readyz 与 /sub 除外）
      required: [code, message]
      properties:
        code:
          type: string
          description: "\"0\" 表示成功，其余取值见 docs/03 §5"
        message:
          type: string
        data: {}
    Username:
      type: string
      pattern: "^[a-zA-Z0-9_.-]{3,64}$"
    Password:
      type: string
      minLength: 12
      maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 1, maxLength: 128 }
        totpCode: { $ref: "#/components/schemas/TotpCode" }
    TotpCode:
      type: string
      pattern: "^[0-9]{6}$"
    TotpCodeInput:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/TotpCode" }
    TotpSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: Base32 密钥，供无法扫码时手动输入 }
        otpauthUri: { type: string, description: "otpauth://totp/... 地址，前端渲染为二维码" }
    AdminBrief:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    Session:
      type: object
      required: [admin, permissions, csrfToken, totpEnabled]
      properties:
        admin: { $ref: "#/components/schemas/AdminBrief" }
        totpEnabled: { type: boolean }
        permissions:
          type: array
          description: 有效权限码（super_admin 返回全部）
          items: { type: string }
        csrfToken: { type: string }
    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Session" }
    Permission:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Role:
      type: object
      required: [id, code, name, isBuiltin, permissions]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        isBuiltin: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
          description: 仅新建时必填，创建后不可改
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 64
          items: { type: string }
    RoleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Role" }
    Admin:
      type: object
      required: [id, username, isDisabled, totpEnabled, roles, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        isDisabled: { type: boolean }
        totpEnabled: { type: boolean }
        roles:
          type: array
          items: { type: string, description: 角色 code }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminCreateInput:
      type: object
      required: [username, password, roles]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/Password" }
        roles:
          type: array
          maxItems: 16
          items: { type: string }
    AdminUpdateInput:
      type: object
      required: [roles, isDisabled]
      properties:
        roles:
          type: array
          maxItems: 16
          items: { type: string }
        isDisabled: { type: boolean }
    AdminEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Admin" }
    AuditLog:
      type: object
      required: [id, actorType, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorType: { type: string, enum: [admin, user, system] }
        actorId: { type: [integer, "null"], format: int64 }
        action: { type: string }
        targetType: { type: [string, "null"] }
        targetId: { type: [string, "null"] }
        detail: { type: [object, "null"], additionalProperties: true }
        clientIp: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    PanelBaseUrl:
      type: string
      maxLength: 512
      description: 面板根地址，含 scheme、端口与 web base path，如 https://panel.example.com:2053/abc
    TlsMode:
      type: string
      enum: [verify, pin, skip]
    ServerConnInput:
      type: object
      required: [providerType, baseUrl, apiToken, tlsMode]
      properties:
        providerType: { type: string, enum: [xui] }
        baseUrl: { $ref: "#/components/schemas/PanelBaseUrl" }
        apiToken: { type: string, maxLength: 512, description: 只写；更新时留空表示沿用原值 }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        certPinSha256: { type: string, maxLength: 128 }
    ServerInput:
      allOf:
        - $ref: "#/components/schemas/ServerConnInput"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 64 }
            region: { type: string, maxLength: 64 }
            remark: { type: string, maxLength: 255 }
            isDisabled: { type: boolean }
    PanelInfo:
      type: object
      required: [version, guid]
      properties:
        version: { type: string }
        guid: { type: string }
        status:
          type: [object, "null"]
          additionalProperties: true
          description: 资源快照（cpu、mem、uptime、xray 运行状态等，原样透传，字段随面板而定）
    Server:
      type: object
      required: [id, name, providerType, baseUrl, tlsMode, region, remark, isDisabled, status, lastError, panelVersion, inboundCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        providerType: { type: string }
        baseUrl: { type: string }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        certPinSha256: { type: [string, "null"] }
        region: { type: string }
        remark: { type: string }
        isDisabled: { type: boolean }
        status: { type: string, enum: [unknown, online, offline, auth_failed] }
        lastError: { type: string }
        lastSeenAt: { type: [string, "null"], format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        panelVersion: { type: string }
        statusSnapshot: { type: [object, "null"], additionalProperties: true }
        inboundCount: { type: integer }
        createdAt: { type: string, format: date-time }
    ServerEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Server" }
    SyncResult:
      type: object
      required: [inbounds, added, updated, missing, drifted]
      properties:
        inbounds: { type: integer, description: 面板上的入站总数 }
        added: { type: integer }
        updated: { type: integer }
        missing: { type: integer, description: 平台有、面板已不存在的入站数 }
        drifted: { type: integer, description: 本次发现面板侧改动的入站数 }
    Endpoint:
      type: object
      required: [id, address, port, remark, isDisabled, isMissing]
      properties:
        id: { type: integer, format: int64 }
        address: { type: string }
        port: { type: integer, description: 0 表示沿用入站端口 }
        remark: { type: string }
        isDisabled: { type: boolean }
        isMissing: { type: boolean }
    Inbound:
      type: object
      required: [id, serverId, remoteRef, protocol, port, listen, tag, remark, isEnabled, network, security, coreType, config, clientCount, isMissing, endpoints, createdAt]
      properties:
        id: { type: integer, format: int64 }
        serverId: { type: integer, format: int64 }
        remoteRef: { type: string }
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        tag: { type: string }
        remark: { type: string }
        isEnabled: { type: boolean }
        network: { type: string }
        security: { type: string }
        coreType: { type: string, enum: [xray] }
        config: { type: object, additionalProperties: true, description: 面板配置副本（settings、streamSettings、sniffing），敏感字段已删除 }
        clientCount: { type: integer }
        driftDetectedAt: { type: [string, "null"], format: date-time }
        isMissing: { type: boolean }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        createdAt: { type: string, format: date-time }
    InboundEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Inbound" }
    InboundTemplate:
      type: string
      enum: [vless-reality, vmess-ws, shadowsocks-2022]
    InboundCreateInput:
      type: object
      required: [remark, port]
      description: template 与 config 二选一；template 时按其参数生成配置与密钥，config 为高级 JSON（settings、streamSettings、sniffing）
      properties:
        remark: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        listen: { type: string, maxLength: 64 }
        enabled: { type: boolean, default: true }
        template: { $ref: "#/components/schemas/InboundTemplate" }
        templateParams:
          type: object
          description: vless-reality 需 target（如 www.cloudflare.com:443）与 serverNames；vmess-ws 需 path；shadowsocks-2022 可选 method
          additionalProperties: true
        protocol: { type: string, maxLength: 32, description: 高级 JSON 模式必填 }
        config: { type: object, additionalProperties: true, description: 高级 JSON 模式必填 }
    InboundPanelConfig:
      type: object
      required: [protocol, port, listen, remark, enabled, config]
      properties:
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        remark: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: 面板上的 settings / streamSettings / sniffing（含密钥，settings 不含 clients） }
    PanelKeyKind:
      type: string
      enum: [x25519, mldsa65, vlessenc]
    InboundUpdateInput:
      type: object
      required: [remark, port]
      properties:
        remark: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        listen: { type: string, maxLength: 64 }
        config: { type: object, additionalProperties: true, description: 省略则不改配置；提供时整体替换（敏感字段与 clients 由服务端补回） }
    EndpointInput:
      type: object
      required: [inboundIds, addresses]
      properties:
        inboundIds:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: integer, format: int64 }
        addresses:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 0, maximum: 65535, description: 0 表示沿用入站端口 }
        remark: { type: string, maxLength: 255 }
    Node:
      type: object
      required: [id, inboundId, serverId, serverName, protocol, address, port, displayName, region, tags, sortOrder, isEnabled, isMissing, groupIds]
      properties:
        id: { type: integer, format: int64 }
        inboundId: { type: integer, format: int64 }
        endpointId: { type: [integer, "null"], format: int64 }
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        protocol: { type: string }
        address: { type: string, description: 直连节点为面板主机名，Host 节点为对外地址 }
        port: { type: integer }
        displayName: { type: string }
        region: { type: string }
        tags:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
        isEnabled: { type: boolean }
        isMissing: { type: boolean, description: 来源入站或地址在面板上已不存在 }
        groupIds:
          type: array
          items: { type: integer, format: int64 }
    NodeInput:
      type: object
      required: [displayName, region, tags, sortOrder, isEnabled]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        region: { type: string, maxLength: 64 }
        tags:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 32 }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
        isEnabled: { type: boolean }
    NodeGroup:
      type: object
      required: [id, name, remark, nodeIds]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        remark: { type: string }
        nodeIds:
          type: array
          items: { type: integer, format: int64 }
    NodeGroupInput:
      type: object
      required: [name, nodeIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        remark: { type: string, maxLength: 255 }
        nodeIds:
          type: array
          maxItems: 5000
          items: { type: integer, format: int64 }
    TrafficReset:
      type: string
      enum: [never, hourly, daily, weekly, monthly]
    UserStatus:
      type: string
      enum: [active, limited, expired, disabled]
    ProvisionStatus:
      type: string
      enum: [pending, synced, failed]
    PlanInput:
      type: object
      required: [name, trafficLimit, durationDays, nodeGroupIds]
      description: 配额模型照 3x-ui 的 client（docs/03 §5.2）；自动续期三种方式最多选一种
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        trafficLimit: { type: integer, format: int64, minimum: 0, description: 流量额度（字节），0 不限 }
        durationDays: { type: integer, minimum: 0, maximum: 36500, description: 时长（天），0 不限 }
        startOnFirstUse: { type: boolean, default: false, description: 首次使用后才开始计时 }
        limitIp: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        renewEveryDays: { type: integer, minimum: 0, maximum: 3650, default: 0 }
        renewMonthDay: { type: integer, minimum: 0, maximum: 31, default: 0 }
        renewWeekday: { type: integer, minimum: 0, maximum: 7, default: 0, description: 1–7 = 周一至周日 }
        renewMax: { type: integer, minimum: 0, maximum: 10000, default: 0, description: 0 不限 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        trafficResetDay: { type: integer, minimum: 1, maximum: 31, default: 1 }
        allowClientChain: { type: boolean, default: false }
        allowCustomNode: { type: boolean, default: false }
        remark: { type: string, maxLength: 255 }
        nodeGroupIds:
          type: array
          maxItems: 500
          items: { type: integer, format: int64 }
    Plan:
      allOf:
        - $ref: "#/components/schemas/PlanInput"
        - type: object
          required: [id, userCount, createdAt]
          properties:
            id: { type: integer, format: int64 }
            userCount: { type: integer, description: 当前分配了该套餐的用户数 }
            createdAt: { type: string, format: date-time }
    UserQuotaInput:
      type: object
      required: [trafficLimit, trafficUsed, expiresAt, pendingDays, limitIp, renewEveryDays, renewMonthDay, renewWeekday, renewMax, trafficReset, trafficResetDay]
      properties:
        trafficLimit: { type: integer, format: int64, minimum: 0 }
        trafficUsed: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: [string, "null"], format: date-time, description: null 表示不过期（或等待首次使用） }
        pendingDays: { type: integer, minimum: 0, maximum: 36500, description: ">0 且 expiresAt 为 null：首次使用后起算的天数" }
        limitIp: { type: integer, minimum: 0, maximum: 1000 }
        renewEveryDays: { type: integer, minimum: 0, maximum: 3650 }
        renewMonthDay: { type: integer, minimum: 0, maximum: 31 }
        renewWeekday: { type: integer, minimum: 0, maximum: 7 }
        renewMax: { type: integer, minimum: 0, maximum: 10000 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        trafficResetDay: { type: integer, minimum: 1, maximum: 31 }
    User:
      allOf:
        - $ref: "#/components/schemas/UserQuotaInput"
        - type: object
          required: [id, username, remark, planId, planName, status, isDisabled, renewCount, provisions, createdAt]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
            remark: { type: string }
            planId: { type: [integer, "null"], format: int64 }
            planName: { type: string }
            status: { $ref: "#/components/schemas/UserStatus" }
            isDisabled: { type: boolean }
            renewCount: { type: integer }
            provisions:
              type: object
              description: 各面板下发状态计数
              required: [synced, pending, failed]
              properties:
                synced: { type: integer }
                pending: { type: integer }
                failed: { type: integer }
            totpEnabled: { type: boolean, description: 是否已开启两步验证（0.2.6） }
            lastUsedAt: { type: [string, "null"], format: date-time, description: 最近一次产生流量的时间（0.2.6） }
            createdAt: { type: string, format: date-time }
    UserCreateInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[A-Za-z0-9_.@-]+$" }
        password: { $ref: "#/components/schemas/UserPassword" }
        remark: { type: string, maxLength: 255 }
        planId: { type: integer, format: int64, minimum: 1, description: 省略则不分配套餐（无可用节点） }
    UserUpdateInput:
      type: object
      required: [remark, isDisabled]
      properties:
        remark: { type: string, maxLength: 255 }
        isDisabled: { type: boolean }
    Provision:
      type: object
      required: [serverId, serverName, email, status, lastError, retryCount, syncedAt, updatedAt]
      properties:
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        email: { type: string, description: 面板上的 client email }
        status: { $ref: "#/components/schemas/ProvisionStatus" }
        lastError: { type: string }
        retryCount: { type: integer }
        syncedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    UserPassword:
      type: string
      minLength: 8
      maxLength: 128
    UserPasswordChangeInput:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { $ref: "#/components/schemas/UserPassword" }
    UserSession:
      type: object
      required: [user, csrfToken, totpEnabled]
      properties:
        user:
          type: object
          required: [id, username, status]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
            status: { $ref: "#/components/schemas/UserStatus" }
        totpEnabled: { type: boolean }
        csrfToken: { type: string }
    UserSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserSession" }
    UserDashboard:
      type: object
      required: [status, planName, trafficLimit, trafficUsed, trafficToday, expiresAt, pendingDays, limitIp, onlineDevices, lastUsedAt, nodeCount]
      properties:
        status: { $ref: "#/components/schemas/UserStatus" }
        planName: { type: string, description: 没有套餐时为空串 }
        trafficLimit: { type: integer, format: int64, description: 字节，0 不限 }
        trafficUsed: { type: integer, format: int64 }
        trafficToday: { type: integer, format: int64, description: 今日（平台时区）已用字节 }
        expiresAt: { type: [string, "null"], format: date-time }
        pendingDays: { type: integer, description: 大于 0 表示首次使用后才开始计时的天数 }
        limitIp: { type: integer, description: 同时在线 IP 数，0 不限 }
        onlineDevices: { type: [integer, "null"], description: 各面板在线 client 数之和；面板都不提供时为 null }
        lastUsedAt: { type: [string, "null"], format: date-time }
        nodeCount: { type: integer, description: 当前可用节点数 }
    TrafficPoint:
      type: object
      required: [hour, up, down]
      properties:
        hour: { type: string, format: date-time }
        up: { type: integer, format: int64 }
        down: { type: integer, format: int64 }
    UserNode:
      type: object
      required: [id, name, region, protocol, isServerOnline, serverLoad, onlineClients]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        region: { type: string }
        protocol: { type: string }
        isServerOnline: { type: boolean }
        serverLoad: { type: [number, "null"], description: 所在服务器的 CPU 占用百分比，未知为 null }
        onlineClients: { type: integer, description: 所在服务器的在线 client 数 }
    UserNodeGroup:
      type: object
      required: [id, name, nodes]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/UserNode" } }
    NodeLink:
      type: object
      required: [link]
      properties:
        link: { type: string, description: 分享链接，属于凭据 }
    SubscriptionFormat:
      type: string
      enum: [base64, mihomo, singbox, xray]
    SubscriptionInfo:
      type: object
      required: [url, formats, updateIntervalHours]
      properties:
        url: { type: string, description: 不带 format 参数的订阅地址，属于凭据 }
        formats:
          type: array
          items:
            type: object
            required: [format, url]
            properties:
              format: { $ref: "#/components/schemas/SubscriptionFormat" }
              url: { type: string }
        updateIntervalHours: { type: integer }
    LoginLog:
      type: object
      required: [clientIp, isSuccess, createdAt]
      properties:
        clientIp: { type: string }
        isSuccess: { type: boolean }
        createdAt: { type: string, format: date-time }
    SubscribeLog:
      type: object
      required: [id, userId, username, format, clientIp, userAgent, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        format: { $ref: "#/components/schemas/SubscriptionFormat" }
        clientIp: { type: string }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
    SubscribeLogPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SubscribeLog" } }
        total: { type: integer, format: int64 }
