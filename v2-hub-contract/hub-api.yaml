        nodeCount: { type: integer, description: 该套餐当前可用的节点数 }
        isTrial: { type: boolean }
        isCurrent: { type: boolean, description: 是不是本人当前的套餐（买它即续费） }
        canBuy: { type: boolean }
        reason: { type: string, description: 不能买的原因，可以买时为空串 }
        prices: { type: array, items: { $ref: "#/components/schemas/PlanPrice" } }
    PublicPlan:
      type: object
      description: 落地页展示的在售套餐（0.4.3）；不含与访问者有关的字段
      required: [id, name, description, trafficLimit, trafficReset, limitIp, nodeCount, prices]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, description: 卖点说明，纯文本，一行一条 }
        trafficLimit: { type: integer, format: int64, description: 字节，0 不限 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        limitIp: { type: integer }
        nodeCount: { type: integer }
        prices: { type: array, items: { $ref: "#/components/schemas/PlanPrice" } }
    AdminDashboard:
      type: object
      description: 管理端总览（0.4.3，docs/03 §5.20）；缺权限的区块为 null
      required: [users, traffic, servers, finance, tickets]
      properties:
        users:
          type: [object, "null"]
          required: [total, active, newToday, new7d, online]
          properties:
            total: { type: integer }
            active: { type: integer }
            newToday: { type: integer }
            new7d: { type: integer }
            online: { type: integer, description: 当前在线人数（各面板在线 client 去重到用户） }
        traffic:
          type: [object, "null"]
          required: [today, days]
          properties:
            today: { type: integer, format: int64, description: 今日流量（字节） }
            days:
              type: array
              description: 近 7 个自然日（含今天），旧的在前
              items:
                type: object
                required: [date, bytes]
                properties:
                  date: { type: string, format: date }
                  bytes: { type: integer, format: int64 }
        servers:
          type: [object, "null"]
          required: [total, online, nodeCount, offline]
          properties:
            total: { type: integer }
            online: { type: integer }
            nodeCount: { type: integer }
            offline:
              type: array
              maxItems: 10
              description: 启用中但不在线的服务器
              items:
                type: object
                required: [id, name, status, offlineSince]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
                  status: { type: string, enum: [unknown, online, offline, auth_failed] }
                  offlineSince: { type: [string, "null"], format: date-time }
        finance:
          type: [object, "null"]
          required: [todaySpend, todayTopup, monthSpend, monthTopup]
          properties:
            todaySpend: { type: integer, format: int64 }
            todayTopup: { type: integer, format: int64 }
            monthSpend: { type: integer, format: int64 }
            monthTopup: { type: integer, format: int64 }
        tickets:
          type: [object, "null"]
          required: [open]
          properties:
            open: { type: integer, description: 待回复（open）工单数 }
    ShopTrafficPack:
      type: object
      required: [id, name, trafficBytes, price]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        trafficBytes: { type: integer, format: int64 }
        price: { $ref: "#/components/schemas/Money" }
    Shop:
      type: object
      required: [balance, plans, trafficPacks, canBuyTrafficPack, trafficPackReason]
      properties:
        balance: { type: integer, format: int64 }
        plans: { type: array, items: { $ref: "#/components/schemas/ShopPlan" } }
        trafficPacks: { type: array, items: { $ref: "#/components/schemas/ShopTrafficPack" } }
        canBuyTrafficPack: { type: boolean }
        trafficPackReason: { type: string, description: 不能买流量包的原因，可以买时为空串 }
    Wallet:
      type: object
      required: [balance, autoRenew, gateways, rebateTotal]
      properties:
        balance: { type: integer, format: int64 }
        autoRenew:
          type: object
          required: [enabled, available, reason, planName, durationDays, price]
          properties:
            enabled: { type: boolean }
            available: { type: boolean, description: 现在能不能开启 }
            reason: { type: string, description: 不能开启的原因，可以开启时为空串 }
            planName: { type: string, description: 续费的套餐名，没有可续费的选项为空串 }
            durationDays: { type: integer, description: 每次续费的天数，没有为 0 }
            price: { type: [integer, "null"], format: int64, description: 该时长选项的当前售价；选项已不存在为 null }
        gateways:
          type: array
          description: 可用的在线充值方式；空 = 没有配置网关，只能用充值码
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
        rebateTotal: { type: integer, format: int64, description: 累计获得的邀请返利 }
    AutoRenewInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RedeemInput:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9 -]{16,24}$", description: 16 位充值码，可带分组用的空格或连字符 }
    RedeemResult:
      type: object
      required: [amount, balance]
      properties:
        amount: { type: integer, format: int64, description: 入账金额（分） }
        balance: { type: integer, format: int64, description: 入账后的余额 }
    ChainStatus:
      type: string
      enum: [ok, blocked]
      description: ok = 通畅（配置与授权成立，平台不探测连通性，Ruling-38）；blocked = 阻断，不进订阅
    ChainBlockedReason:
      type: string
      enum: ["", plan, entry, exit]
      description: 阻断原因；plan = 套餐不支持，entry = 入口节点当前不可用，exit = 落地节点当前不可用；通畅时为空串
    ChainExitKind:
      type: string
      enum: [node, custom]
      description: node = 平台节点，custom = 自有落地节点
    ChainNodeOption:
      type: object
      description: 新建规则时可选的平台节点（本人当前可用）
      required: [id, name, region, protocol, canBeExit, canBeServerEntry]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        region: { type: string }
        protocol: { type: string }
        canBeExit: { type: boolean, description: 能否作落地；hysteria2 不能 }
        canBeServerEntry: { type: boolean, description: 能否作服务端链式的入口：所在面板支持改内核配置（0.4.2） }
    ChainRule:
      type: object
      required: [id, name, displayName, entry, exit, isEnabled, status, blockedReason, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: 用户起的名称，没起为空串 }
        displayName: { type: string, description: 订阅里显示的节点名；没起名称时为“入口名 → 落地名” }
        entry:
          type: object
          required: [nodeId, name]
          properties:
            nodeId: { type: integer, format: int64 }
            name: { type: string }
        exit:
          type: object
          required: [kind, id, name, protocol]
          properties:
            kind: { $ref: "#/components/schemas/ChainExitKind" }
            id: { type: integer, format: int64, description: 平台节点 id 或自有落地节点 id，取决于 kind }
            name: { type: string }
            protocol: { type: string }
        isEnabled: { type: boolean }
        status: { $ref: "#/components/schemas/ChainStatus" }
        blockedReason: { $ref: "#/components/schemas/ChainBlockedReason" }
        createdAt: { type: string, format: date-time }
    ChainRuleInput:
      type: object
      required: [entryNodeId]
      description: exitNodeId 与 exitCustomNodeId 必须恰好给一个
      properties:
        entryNodeId: { type: integer, format: int64, minimum: 1 }
        exitNodeId: { type: integer, format: int64, minimum: 1 }
        exitCustomNodeId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 64, description: 可选；省略或空串 = 用“入口名 → 落地名” }
        isEnabled: { type: boolean, default: true }
    ChainRuleUpdateInput:
      type: object
      required: [name, isEnabled]
      properties:
        name: { type: string, maxLength: 64 }
        isEnabled: { type: boolean }
    CustomNode:
      type: object
      description: 自有落地节点；原链接属于凭据，不在这里返回
      required: [id, name, protocol, address, port, ruleCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        protocol: { type: string, enum: [vless, vmess, trojan, shadowsocks, socks] }
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        ruleCount: { type: integer, description: 引用它的规则数；删除前据此提示 }
        createdAt: { type: string, format: date-time }
    CustomNodeInput:
      type: object
      required: [link]
      properties:
        link: { type: string, minLength: 1, maxLength: 2048, description: "分享链接（vless / vmess / trojan / ss）或 socks5://[用户名:口令@]地址:端口" }
        name: { type: string, maxLength: 64, description: 可选；省略或空串 = 取链接里的名称 }
    CustomNodeUpdateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        link: { type: string, minLength: 1, maxLength: 2048, description: 省略 = 不改链接 }
    ChainOverview:
      type: object
      required: [allowed, customNodeAllowed, serverAllowed, maxRules, maxCustomNodes, maxServerRules, rules, customNodes, serverRules, nodes]
      properties:
        allowed: { type: boolean, description: 套餐是否允许客户端链式 }
        customNodeAllowed: { type: boolean, description: 套餐是否允许自有落地节点 }
        serverAllowed: { type: boolean, description: 套餐是否允许服务端链式（0.4.2） }
        maxRules: { type: integer }
        maxCustomNodes: { type: integer }
        maxServerRules: { type: integer, description: 0.4.2 }
        rules: { type: array, items: { $ref: "#/components/schemas/ChainRule" } }
        customNodes: { type: array, items: { $ref: "#/components/schemas/CustomNode" } }
        serverRules: { type: array, items: { $ref: "#/components/schemas/ServerChainRule" }, description: 0.4.2 }
        nodes: { type: array, items: { $ref: "#/components/schemas/ChainNodeOption" } }
    ServerChainApplyState:
      type: string
      enum: ["", applied, pending, failed]
      description: 服务端规则的下发情况（docs/03 §5.19）；applied = 已在入口面板生效，pending = 下发中，failed = 入口服务器最近一次下发被回滚；规则阻断或停用时为空串
    ServerChainRule:
      type: object
      required: [id, entry, exit, isEnabled, status, blockedReason, applyStatus, createdAt]
      properties:
        id: { type: integer, format: int64 }
        entry:
          type: object
          required: [nodeId, name]
          properties:
            nodeId: { type: integer, format: int64 }
            name: { type: string }
        exit:
          type: object
          required: [nodeId, name, protocol]
          properties:
            nodeId: { type: integer, format: int64 }
            name: { type: string }
            protocol: { type: string }
        isEnabled: { type: boolean }
        status: { $ref: "#/components/schemas/ChainStatus" }
        blockedReason: { $ref: "#/components/schemas/ChainBlockedReason" }
        applyStatus: { $ref: "#/components/schemas/ServerChainApplyState" }
        createdAt: { type: string, format: date-time }
    ServerChainRuleInput:
      type: object
      required: [entryNodeId, exitNodeId]
      properties:
        entryNodeId: { type: integer, format: int64, minimum: 1 }
        exitNodeId: { type: integer, format: int64, minimum: 1 }
        isEnabled: { type: boolean, default: true }
    ServerChainRuleUpdateInput:
      type: object
      required: [isEnabled]
      properties:
        isEnabled: { type: boolean }
    ChainApplyStatus:
      type: string
      enum: [none, pending, applied, failed]
      description: 入口服务器的下发状态（docs/03 §3 C1–C5）；none = 从未有过服务端规则
    ChainApply:
      type: object
      required: [serverId, isSupported, status, ruleCount, appliedRuleCount, failCount, isRetryStopped, lastError, lastAttemptAt, nextAttemptAt, appliedAt]
      properties:
        serverId: { type: integer, format: int64 }
        isSupported: { type: boolean, description: 面板是否支持改内核配置；不支持时不会有服务端规则以它为入口 }
        status: { $ref: "#/components/schemas/ChainApplyStatus" }
        ruleCount: { type: integer, description: 期望生效的规则数（不阻断、启用且落地凭据已就绪） }
        appliedRuleCount: { type: integer, description: 当前面板上生效的规则数 }
        failCount: { type: integer, description: 同一期望的连续失败次数 }
        isRetryStopped: { type: boolean, description: 失败次数已达上限，停止自动重试，等期望变化或手动重试 }
        lastError: { type: string, description: 脱敏后的最近错误，没有为空串 }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        nextAttemptAt: { type: [string, "null"], format: date-time, description: 失败退避到这个时刻 }
        appliedAt: { type: [string, "null"], format: date-time }
    AdminServerChainRule:
      type: object
      required: [id, user, entry, exit, isEnabled, status, blockedReason, applyStatus, createdAt]
      properties:
        id: { type: integer, format: int64 }
        user:
          type: object
          required: [id, username]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
        entry:
          type: object
          required: [nodeId, name, serverId, serverName]
          properties:
            nodeId: { type: integer, format: int64 }
            name: { type: string }
            serverId: { type: integer, format: int64 }
            serverName: { type: string }
        exit:
          type: object
          required: [nodeId, name]
          properties:
            nodeId: { type: integer, format: int64 }
            name: { type: string }
        isEnabled: { type: boolean }
        status: { $ref: "#/components/schemas/ChainStatus" }
        blockedReason: { $ref: "#/components/schemas/ChainBlockedReason" }
        applyStatus: { $ref: "#/components/schemas/ServerChainApplyState" }
        createdAt: { type: string, format: date-time }
    AdminServerChainRulePage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminServerChainRule" } }
        total: { type: integer, format: int64 }
