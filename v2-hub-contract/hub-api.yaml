        "200":
          description: 链式代理总览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
  /api/user/chain/rules:
    post:
      tags: [user-chain]
      operationId: createChainRule
      summary: 新建一条链式规则
      description: |
        入口与落地（平台节点时）必须是本人当前可用的节点；落地二选一。
        套餐没开链式、或落地是自有节点而套餐没开自有落地时返回 403 feature_disabled；
        落地是 hysteria2、入口与落地相同、超过上限返回 400；同一（入口，落地）已有规则返回 409。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainRuleInput" }
      responses:
        "200":
          description: 新建的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainRule" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
