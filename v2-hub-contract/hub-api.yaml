      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 本人的余额流水分页，按时间倒序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LedgerPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
  /api/user/wallet/redeem:
    post:
      tags: [user-shop]
      operationId: redeemTopupCode
      summary: 兑换充值码（docs/03 §5.15）
      description: |
        码不存在、已用、停用或过期一律返回 400，不区分原因；失败次数过多返回 429。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemInput" }
      responses:
        "200":
          description: 兑换充值码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RedeemResult" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/wallet/auto-renew:
    put:
      tags: [user-shop]
      operationId: setAutoRenew
      summary: 开 / 关到期自动续费（docs/03 §5.16）
      description: |
        没有买过可续费的时长选项、或当前是试用套餐时不能开启，返回 409。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoRenewInput" }
      responses:
        "200":
          description: 开 / 关到期自动续费
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Wallet" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/user/wallet/payments:
    post:
      tags: [user-shop]
      operationId: createPayment
      summary: 发起一笔在线充值，返回跳转地址或二维码内容（docs/03 §5.15）
      description: |
        没有配置任何支付网关时返回 403 feature_disabled。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCreateInput" }
      responses:
        "200":
          description: 发起一笔在线充值，返回跳转地址或二维码内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PaymentCreated" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/pay/notify/{gateway}:
    post:
      tags: [payment]
      operationId: paymentNotify
      summary: 支付网关的异步通知；验签后幂等入账（docs/03 §5.15）
      description: |
        请求体与应答格式由各网关决定，这里只约定路径。未配置的网关返回 404；验签失败或金额与充值单不符返回 400。
        同一笔网关交易重复通知只入账一次，重复通知仍返回成功。
      security: []
      parameters:
        - { name: gateway, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9_-]{1,32}$" } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: 已受理（内容为网关要求的应答文本）
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/user/chain:
    get:
      tags: [user-chain]
      operationId: getChainOverview
      summary: 链式代理总览：开关、上限、两类规则、我的出口与可选的节点 / 平台出口（docs/03 §5.18、§5.19、§5.21）
      description: |
        套餐没开链式时照常返回（开关为 false，已有规则状态为阻断），页面据此说明原因。
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 链式代理总览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
  /api/user/chain/routes:
    post:
      tags: [user-chain]
      operationId: createChainRoute
      summary: 新建一条链式规则，排在同类型的最后（0.5.0）
      description: |
        起飞节点必须是本人当前可用的节点；落地三选一：平台节点、平台出口、我的出口，都必须在本人权限范围内。
        套餐没开对应的链式、或落地是我的出口而套餐没开自有落地时返回 403 feature_disabled。
        超过上限、落地是 hysteria2、落地同时是起飞节点返回 400。
        服务端链式另有：起飞节点所在面板须支持改内核配置；落地节点不能是本人任何服务端规则的起飞节点、反之亦然（防环）；
        我的出口须是公网地址且不指向平台自己的服务器（Ruling-48、Ruling-49），不满足返回 400；写操作超过频率返回 429。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainRouteInput" }
      responses:
        "200":
          description: 新建的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainRoute" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/chain/routes/order:
    put:
      tags: [user-chain]
      operationId: reorderChainRoutes
      summary: 调整某一类型规则的顺序，越靠前优先级越高（Ruling-46；0.5.0）
      description: |
        ids 必须恰好是本人该类型全部规则的一个排列，否则返回 400。套餐没开对应的链式返回 403 feature_disabled；
        服务端链式的调序计入写操作频率。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainRouteOrderInput" }
      responses:
        "200":
          description: 调整后该类型的全部规则，按新顺序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ChainRoute" } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/chain/routes/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [user-chain]
      operationId: updateChainRoute
      summary: 改规则的起飞节点、落地、名称与启用开关；他人的返回 404（R8）（0.5.0）
      description: 类型不能改。校验与新建相同；套餐没开对应的链式时返回 403 feature_disabled。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainRouteUpdateInput" }
      responses:
        "200":
          description: 改后的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainRoute" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [user-chain]
      operationId: deleteChainRoute
      summary: 删除规则；套餐没开链式时也允许；他人的返回 404（R8）（0.5.0）
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/user/chain/exits:
    post:
      tags: [user-chain]
      operationId: createChainExit
      summary: 添加一个我的出口（原自有落地节点；0.5.0）
      description: |
        链接保存时解析校验，解析不了或协议不支持返回 400；套餐没开自有落地返回 403 feature_disabled；
        超过上限返回 400；同名返回 409。平台不向该地址发起任何连接（Ruling-38）。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainExitInput" }
      responses:
        "200":
          description: 新建的出口
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainExit" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/user/chain/exits/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [user-chain]
      operationId: updateChainExit
      summary: 改我的出口的名称或链接；他人的返回 404（R8）（0.5.0）
      description: |
        出口被服务端规则引用时，换链接要重新通过地址限制（不通过返回 400），并计入服务端链式的写操作频率（超出 429）。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainExitUpdateInput" }
      responses:
        "200":
          description: 改后的出口
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainExit" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [user-chain]
      operationId: deleteChainExit
      summary: 删除我的出口，引用它的规则一并删除；他人的返回 404（R8）（0.5.0）
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/user/chain/exits/{id}/link:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [user-chain]
      operationId: getChainExitLink
      summary: 取我的出口的原链接（凭据）；他人的与平台出口返回 404（R8）（0.5.0）
      security: [{ userSession: [] }]
      responses:
        "200":
          description: 原链接
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/NodeLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/user/chain/exits/{id}/test:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [user-chain]
      operationId: testChainExit
      summary: 从我可用的一个节点所在服务器测试我的出口的延迟（0.6.0）
      description: |
        由起点节点所在服务器的面板去连出口并返回结果（Ruling-52）。只能测自己的出口，他人的与平台出口返回 404（R8）；
        起点必须是本人可用、面板支持测试的节点，否则 400。出口先过服务端链式的地址限制（公网地址等，docs/03 §5.19），不过返回 400。
        每用户频控，超出返回 429；同一台服务器同时只跑一个测试，占用中返回 409。不返回面板的错误原文。
      security: [{ userSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainExitTestInput" }
      responses:
        "200":
          description: 测试结果（连不上也是 200，ok 为 false）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChainExitTestResult" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /{subPath}/{token}:
    get:
      tags: [subscription]
      operationId: getSubscription
      summary: 按格式渲染该用户的全部可用节点（docs/03 §5.4）
      description: |
        subPath 是系统设置 subscription.path，或过渡期内的旧前缀（0.8.0 起，Ruling-59；之前固定为 sub），其余前缀 404。
        不走响应信封。响应头带 Subscription-Userinfo、Profile-Update-Interval、Profile-Title、Content-Disposition。
        用户非 active 时仍返回 200，内容只有一条说明状态的信息节点。
      security: []
      parameters:
        - { name: subPath, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]{3,32}$" } }
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{22,64}$" } }
        - name: format
          in: query
          description: 未指定时按 User-Agent 判断
          schema: { $ref: "#/components/schemas/SubscriptionFormat" }
      responses:
        "200":
          description: 订阅内容
          content:
            text/plain: { schema: { type: string } }
            application/yaml: { schema: { type: string } }
            application/json: { schema: { type: object, additionalProperties: true } }
        "400":
          description: format 取值不认识
          content:
            text/plain: { schema: { type: string } }
        "404":
          description: token 不存在，或前缀不是当前 / 过渡中的前缀
          content:
            text/plain: { schema: { type: string } }
        "429":
          description: 触发频控
          content:
            text/plain: { schema: { type: string } }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: hub_admin_session
    userSession:
      type: apiKey
      in: cookie
      name: hub_user_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AnalyticsDays:
      name: days
      in: query
      description: 总览分析的时间范围（自然日，含今天；Ruling-66），其它值 400
      schema: { type: integer, enum: [7, 30, 90], default: 30 }
  responses:
    Ok:
      description: 成功（data 为空）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    InvalidArgument:
      description: invalid_argument
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    PermissionDenied:
      description: permission_denied（缺权限码、CSRF 校验失败、代理账号调用非代理接口或员工调用 /api/admin/agent/*，Ruling-101）；管理端接口另可能返回 totp_setup_required（超管未开启两步验证，查看会话、登出、生成与确认 TOTP、改自己密码除外，Ruling-98）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    ReauthRequired:
      description: |
        高危接口（Ruling-100，清单见 docs/03 §4.4）的 403：reauth_required（二次验证已过期，先调 POST /api/admin/auth/reauth 再重发原请求）、
        totp_setup_required（超管未开启两步验证，Ruling-98）或 permission_denied（缺权限码或 CSRF 校验失败）。
        判定顺序：认证 → CSRF → 两步验证绑定 → 权限码 → 二次验证，缺权限的人不会被要求二次验证。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    AccountDisabled:
      description: account_disabled（账号已停用，只能查看本人信息与退出）或 permission_denied（CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Conflict:
      description: conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    UpstreamUnavailable:
      description: upstream_unavailable（面板不可达、拒绝 token 或返回异常）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    FeatureDisabled:
      description: feature_disabled（功能未开启：注册关闭、邮件未配置等）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    OrderConflict:
      description: insufficient_balance（余额不足，data.shortfall 为差额，单位分）或 conflict（商品当前不可买）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      shortfall: { type: integer, format: int64 }
    UserForbidden:
      description: account_disabled、feature_disabled（功能未开启）或 permission_denied（CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    RateLimited:
      description: rate_limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    AgentQuotaConflict:
      description: |
        代理配额不足（docs/03 §5.23，Ruling-103）：agent_pool_insufficient（流量池不够本次扣减，data 带 poolCost 与 poolRemaining，单位字节）、
        agent_user_limit（名下未删除用户数已达上限，只在新建用户时出现）或 conflict（用户名 / 邮箱重复等）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      poolCost: { type: integer, format: int64, description: 本次需要扣减的字节数 }
                      poolRemaining: { type: integer, format: int64, description: 流量池剩余字节数 }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Envelope:
      type: object
      description: 业务接口统一响应信封（/healthz、/readyz 与 /sub 除外）
      required: [code, message]
      properties:
        code:
          type: string
          description: "\"0\" 表示成功，其余取值见 docs/03 §5；管理端 403 另有 reauth_required（Ruling-100）、totp_setup_required（Ruling-98）；代理接口 409 另有 agent_pool_insufficient、agent_user_limit（Ruling-103）"
        message:
          type: string
        data: {}
    Username:
      type: string
      pattern: "^[a-zA-Z0-9_.-]{3,64}$"
    Password:
      type: string
      minLength: 12
      maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 1, maxLength: 128 }
        totpCode: { $ref: "#/components/schemas/TotpCode" }
    TotpCode:
      type: string
      pattern: "^[0-9]{6}$"
    TotpCodeInput:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/TotpCode" }
    TotpSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: Base32 密钥，供无法扫码时手动输入 }
        otpauthUri: { type: string, description: "otpauth://totp/... 地址，前端渲染为二维码" }
    AdminPasswordChangeInput:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { $ref: "#/components/schemas/Password" }
    AdminReauthInput:
      type: object
      description: 二选一：已开启两步验证的账号必须给 totpCode，否则给 password（Ruling-100）
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
        totpCode: { $ref: "#/components/schemas/TotpCode" }
    AdminReauthResult:
      type: object
      required: [reauthUntil]
      properties:
        reauthUntil: { type: string, format: date-time, description: 在此之前高危接口不再要求重新验证 }
    AdminBrief:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    Session:
      type: object
      required: [admin, kind, permissions, csrfToken, totpEnabled, menuOrder, isSuperAdmin, isOwner, totpSetupRequired]
      properties:
        admin: { $ref: "#/components/schemas/AdminBrief" }
        kind:
          $ref: "#/components/schemas/AdminKind"
          description: |
            账号类型（0.18.0，Ruling-101）。agent 时 permissions 为空数组、isSuperAdmin / isOwner / totpSetupRequired 恒为 false，
            menuOrder 为空数组（代理菜单固定，docs/03 §5.6）；前端据此渲染代理布局。
        totpEnabled: { type: boolean }
        menuOrder: { $ref: "#/components/schemas/MenuOrder", description: "管理端侧栏菜单顺序（系统设置 menu.admin，0.7.3，Ruling-57）；空数组 = 默认顺序" }
        isSuperAdmin: { type: boolean, description: 持有 super_admin 角色（Ruling-95） }
        isOwner: { type: boolean, description: 是否所有者（Ruling-99） }
        totpSetupRequired:
          type: boolean
          description: 超管未开启两步验证；为 true 时除豁免接口外都返回 403 totp_setup_required，管理端停在账号安全页（Ruling-98）
        permissions:
          type: array
          description: 有效权限码（super_admin 返回全部）
          items: { type: string }
        csrfToken: { type: string }
    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Session" }
    Permission:
      type: object
      required: [code, name, superOnly]
      properties:
        code: { type: string }
        name: { type: string }
        superOnly: { type: boolean, description: 超管专属，不能放进任何其它角色（Ruling-95） }
    Role:
      type: object
      required: [id, code, name, isBuiltin, permissions]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        isBuiltin: { type: boolean, description: "内置角色：super_admin 与四个预设 operator / finance / ops / partner；不可改不可删，预设角色的 permissions 由代码定义（Ruling-95）" }
        permissions:
          type: array
          items: { type: string }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
          description: 仅新建时必填，创建后不可改
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 64
          items: { type: string }
    RoleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Role" }
    Admin:
      type: object
      required: [id, username, isDisabled, totpEnabled, isOwner, roles, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        isDisabled: { type: boolean }
        totpEnabled: { type: boolean }
        isOwner: { type: boolean, description: 所有者，不能经管理接口禁用、改角色、重置密码或两步验证（Ruling-99） }
        roles:
          type: array
          items: { type: string, description: 角色 code }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminCreateInput:
      type: object
      required: [username, password, roles]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/Password" }
        roles:
          type: array
          maxItems: 16
          items: { type: string }
    AdminUpdateInput:
      type: object
      required: [roles, isDisabled]
      properties:
        roles:
          type: array
          maxItems: 16
          items: { type: string }
        isDisabled: { type: boolean }
    AdminEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Admin" }
    AdminKind:
      type: string
      enum: [staff, agent]
      description: 管理端账号类型（Ruling-101）：staff 员工 / agent 代理，创建后不可改
    AgentBase:
      type: object
      required: [remark, maxUsers, trafficPoolTotal, planIds]
      description: 代理的配额（Ruling-103）
      properties:
        remark: { type: string, maxLength: 255 }
        maxUsers: { type: integer, minimum: 0, maximum: 1000000, description: 名下未删除用户数上限 }
        trafficPoolTotal: { type: integer, format: int64, minimum: 0, description: 流量池总量（字节），累计制，不能低于已用量 }
        planIds:
          type: array
          maxItems: 200
          uniqueItems: true
          description: 可分配的套餐白名单，整体替换；只收流量与时长都有限的套餐
          items: { type: integer, format: int64, minimum: 1 }
    AgentCreateInput:
      allOf:
        - $ref: "#/components/schemas/AgentBase"
        - type: object
          required: [username, password]
          properties:
            username: { $ref: "#/components/schemas/Username" }
            password: { $ref: "#/components/schemas/Password" }
    AgentUpdateInput:
      allOf:
        - $ref: "#/components/schemas/AgentBase"
        - type: object
          required: [isDisabled]
          properties:
            isDisabled: { type: boolean, description: 停用时其全部会话失效、邀请码不可用，名下用户不受影响 }
    Agent:
      allOf:
        - $ref: "#/components/schemas/AgentBase"
        - type: object
          required: [id, username, isDisabled, totpEnabled, lastLoginAt, createdAt, userCount, trafficPoolUsed]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
            isDisabled: { type: boolean }
            totpEnabled: { type: boolean }
            lastLoginAt: { type: [string, "null"], format: date-time }
            createdAt: { type: string, format: date-time }
            userCount: { type: integer, description: 名下未删除用户数；超管划转后可能超过 maxUsers }
            trafficPoolUsed: { type: integer, format: int64, description: 流量池已用（字节），只增不减 }
    AgentEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Agent" }
    AgentPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        total: { type: integer, format: int64 }
    AgentBrief:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    UserAgentInput:
      type: object
      required: [agentId]
      properties:
        agentId: { type: [integer, "null"], format: int64, minimum: 1, description: 目标代理的管理员 id；null = 收回为平台用户 }
    AgentAllocationKind:
      type: string
      enum: [create, assign]
      description: create = 新建用户时选的套餐；assign = 给已有用户分配或续期
    AgentAllocation:
      type: object
      required: [id, agentId, userId, username, planId, planName, trafficBytes, durationDays, kind, createdAt]
      properties:
        id: { type: integer, format: int64 }
        agentId: { type: integer, format: int64 }
        userId: { type: [integer, "null"], format: int64, description: 用户已删除为 null }
        username: { type: string, description: 开通时的用户名 }
        planId: { type: [integer, "null"], format: int64, description: 套餐已删除为 null }
        planName: { type: string, description: 开通时的套餐名 }
        trafficBytes: { type: integer, format: int64, description: 本次从流量池扣减的字节数 }
        durationDays: { type: integer, description: 套餐时长（天） }
        kind: { $ref: "#/components/schemas/AgentAllocationKind" }
        createdAt: { type: string, format: date-time }
    AgentAllocationPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentAllocation" } }
        total: { type: integer, format: int64 }
    AgentSummary:
      type: object
      required: [maxUsers, userCount, trafficPoolTotal, trafficPoolUsed]
      properties:
        maxUsers: { type: integer }
        userCount: { type: integer, description: 名下未删除用户数 }
        trafficPoolTotal: { type: integer, format: int64 }
        trafficPoolUsed: { type: integer, format: int64 }
    AgentPlan:
      type: object
      required: [id, name, trafficLimit, durationDays, trafficReset, limitIp, poolCost]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        trafficLimit: { type: integer, format: int64, description: 流量额度（字节），白名单里恒大于 0 }
        durationDays: { type: integer, description: 时长（天），白名单里恒大于 0 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        limitIp: { type: integer, description: 同时在线 IP 数，0 不限 }
        poolCost:
          type: integer
          format: int64
          description: 开通或续期一次从流量池扣减的字节数 = 流量 × 时长内的重置周期数（never 按 1 期；周按 7 天、月按 30 天，向上取整）
    AgentPlanAssignInput:
      type: object
      required: [planId]
      properties:
        planId: { type: integer, format: int64, minimum: 1, description: 必须在白名单内 }
    AgentUser:
      type: object
      description: 代理看到的名下用户（Ruling-104）：不含下发状态、订阅凭据、邀请关系、免费续期等字段
      required: [id, username, email, remark, status, isDisabled, planId, planName, trafficLimit, trafficUsed, expiresAt, pendingDays, balance, totpEnabled, createdAt, lastUsedAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: [string, "null"], description: 未绑定为 null }
        remark: { type: string }
        status: { $ref: "#/components/schemas/UserStatus" }
        isDisabled: { type: boolean }
        planId: { type: [integer, "null"], format: int64 }
        planName: { type: string, description: 没有套餐为空串 }
        trafficLimit: { type: integer, format: int64, description: 流量额度（字节），0 不限 }
        trafficUsed: { type: integer, format: int64 }
        expiresAt: { type: [string, "null"], format: date-time, description: null 表示不过期或等待首次使用 }
        pendingDays: { type: integer, description: ">0 且 expiresAt 为 null：首次使用后起算的天数" }
        balance: { type: integer, format: int64, description: 余额（分），只读 }
        totpEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time, description: 最近一次产生流量的时间 }
    AgentUserEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AgentUser" }
    AgentUserPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentUser" } }
        total: { type: integer, format: int64 }
    AgentUserCreateInput:
      type: object
      required: [username, password, planId]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/UserPassword" }
        email: { $ref: "#/components/schemas/Email" }
        remark: { type: string, maxLength: 255 }
        planId: { type: integer, format: int64, minimum: 1, description: 必须在白名单内 }
    AgentUserUpdateInput:
      type: object
      required: [remark, isDisabled]
      properties:
        remark: { type: string, maxLength: 255 }
        isDisabled: { type: boolean }
    AgentUserQuotaInput:
      type: object
      minProperties: 1
      description: 只能收紧（Ruling-103）；省略的字段不改，至少给一个
      properties:
        trafficLimit: { type: integer, format: int64, minimum: 1, description: 大于 0 且不超过当前额度 }
        expiresAt: { type: string, format: date-time, description: 不能为 null、不能晚于当前到期时间 }
    AuditLog:
      type: object
      required: [id, actorType, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorType: { type: string, enum: [admin, user, system] }
        actorId: { type: [integer, "null"], format: int64 }
        action: { type: string }
        targetType: { type: [string, "null"] }
        targetId: { type: [string, "null"] }
        detail: { type: [object, "null"], additionalProperties: true }
        clientIp: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    PanelBaseUrl:
      type: string
      maxLength: 512
      description: 面板根地址，含 scheme、端口与 web base path，如 https://panel.example.com:2053/abc
    TlsMode:
      type: string
      enum: [verify, pin, skip]
    ServerConnInput:
      type: object
      required: [providerType, baseUrl, apiToken, tlsMode]
      properties:
        providerType: { type: string, enum: [xui] }
        baseUrl: { $ref: "#/components/schemas/PanelBaseUrl" }
        apiToken: { type: string, maxLength: 512, description: 只写；更新时留空表示沿用原值，但面板类型或面板地址有变化时必填（Ruling-97） }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        certPinSha256: { type: string, maxLength: 128 }
    ServerInput:
      allOf:
        - $ref: "#/components/schemas/ServerConnInput"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 64 }
            region: { $ref: "#/components/schemas/CountryCode" }
            remark: { type: string, maxLength: 255 }
            isDisabled: { type: boolean }
    CountryCode:
      type: string
      pattern: "^([A-Z]{2})?$"
      maxLength: 2
      description: ISO 3166-1 两位国家码（大写），空串表示未知（Ruling-65）
    ServerLocation:
      type: object
      required: [region, publicIp]
      properties:
        region: { $ref: "#/components/schemas/CountryCode" }
        publicIp: { type: string, description: 面板报出的公网 IP }
    MetricRange:
      type: string
      enum: [24h, 7d]
      default: 24h
    NodeMetrics:
      type: object
      required: [range, points]
      properties:
        range: { $ref: "#/components/schemas/MetricRange" }
        points:
          type: array
          items: { $ref: "#/components/schemas/NodeMetricPoint" }
    NodeMetricPoint:
      type: object
      required: [at, onlineClients, load]
      properties:
        at: { type: string, format: date-time, description: 时段起点（5 分钟或 1 小时对齐） }
        onlineClients: { type: integer, description: 所在服务器的在线 client 数 }
        load: { type: [number, "null"], description: CPU 占用百分比，未知为 null }
    PanelInfo:
      type: object
      required: [version, guid]
      properties:
        version: { type: string }
        guid: { type: string }
        resources:
          oneOf:
            - $ref: "#/components/schemas/ServerResources"
            - type: "null"
          description: 资源快照（0.16.0，Ruling-83）
    Server:
      type: object
      required: [id, name, providerType, baseUrl, tlsMode, region, remark, isDisabled, status, lastError, panelVersion, inboundCount, createdAt, reach, hostId, clientFlow,
                 resources, publicIpv4, publicIpv6, onlineClients, billing, traffic, host]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        providerType: { type: string }
        baseUrl: { type: string }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        certPinSha256: { type: [string, "null"] }
        region: { type: string, description: 服务器位置，ISO 两位国家码，空串为未知（Ruling-65） }
        remark: { type: string }
        isDisabled: { type: boolean }
        status: { type: string, enum: [unknown, online, offline, auth_failed] }
        lastError: { type: string }
        lastSeenAt: { type: [string, "null"], format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        panelVersion: { type: string }
        resources:
          oneOf:
            - $ref: "#/components/schemas/ServerResources"
            - type: "null"
          description: 最近一次探测成功的资源快照（0.16.0，Ruling-83）；还没探测成功过为 null。服务器不在线时是掉线前的最后一份
        publicIpv4: { type: string, description: 面板自报的公网 IPv4，没报为空串（0.16.0） }
        publicIpv6: { type: string, description: 面板自报的公网 IPv6，没报为空串（0.16.0） }
        onlineClients: { type: integer, description: 面板在线 client 数（0.16.0） }
        billing: { $ref: "#/components/schemas/ServerBilling" }
        traffic: { $ref: "#/components/schemas/ServerTraffic" }
        host:
          oneOf:
            - $ref: "#/components/schemas/ServerHostBrief"
            - type: "null"
          description: 关联的托管主机的系统信息（0.16.0）；没有关联为 null
        inboundCount: { type: integer }
        createdAt: { type: string, format: date-time }
        hostId: { type: [integer, "null"], format: int64, description: 关联的托管主机（0.12.0，docs/03 §5.22）；没有为 null }
        clientFlow: { $ref: "#/components/schemas/ClientFlow" }
        reach:
          type: [object, "null"]
          description: 这台服务器上的大陆连通检测目标数（0.11.0，Ruling-67）；功能没开为 null
          required: [total, ok, blocked, partial]
          properties:
            total: { type: integer, description: 这台服务器上的检测目标数 }
            ok: { type: integer, description: 其中结论为 ok 的；其余可能是还没测、未知或端口不通 }
            blocked: { type: integer }
            partial: { type: integer }
    ServerResources:
      type: object
      description: 服务器资源快照，平台的中立模型（0.16.0，Ruling-83）；面板没报的数值为 0
      required: [cpu, cpuCores, memUsed, memTotal, swapUsed, swapTotal, diskUsed, diskTotal, load1, load5, load15, uptimeSeconds,
                 tcpCount, udpCount, netUpRate, netDownRate, netSent, netRecv, coreState, coreVersion]
      properties:
        cpu: { type: [number, "null"], description: CPU 占用百分比，面板没报为 null }
        cpuCores: { type: integer }
        memUsed: { type: integer, format: int64, description: 字节 }
        memTotal: { type: integer, format: int64 }
        swapUsed: { type: integer, format: int64 }
        swapTotal: { type: integer, format: int64 }
        diskUsed: { type: integer, format: int64 }
        diskTotal: { type: integer, format: int64 }
        load1: { type: number, description: 1 分钟平均负载 }
        load5: { type: number }
        load15: { type: number }
        uptimeSeconds: { type: integer, format: int64, description: 开机时长 }
        tcpCount: { type: integer }
        udpCount: { type: integer }
        netUpRate: { type: integer, format: int64, description: 上行速率，字节每秒 }
        netDownRate: { type: integer, format: int64, description: 下行速率，字节每秒 }
        netSent: { type: integer, format: int64, description: 开机以来网卡累计发送字节 }
        netRecv: { type: integer, format: int64, description: 开机以来网卡累计接收字节 }
        coreState: { type: string, description: "内核运行状态：running 为在运行，其它值为没在运行，空串为面板没报" }
        coreVersion: { type: string, description: 内核版本，面板没报为空串 }
    BillingCycle:
      type: string
      enum: [month, quarter, half_year, year, once]
    TrafficMode:
      type: string
      description: 流量额度的计量方式：both 收发合计，out 只算出站，max 收发取大
      enum: [both, out, max]
    ServerBilling:
      type: object
      description: 服务器的账单与流量额度（0.16.0，docs/03 §5.1，Ruling-84）
      required: [priceCents, priceCurrency, billingCycle, expiresOn, trafficQuotaBytes, trafficResetDay, trafficMode]
      properties:
        priceCents: { type: [integer, "null"], minimum: 0, maximum: 99999999, description: 价格，整数分；没填为 null }
        priceCurrency: { type: string, pattern: "^[A-Z]{3}$", description: 币种，三位大写字母 }
        billingCycle: { $ref: "#/components/schemas/BillingCycle" }
        expiresOn: { type: [string, "null"], format: date, description: 到期日（站点时区）；没填为 null }
        trafficQuotaBytes: { type: [integer, "null"], format: int64, minimum: 0, description: 每月流量额度；不限或没填为 null }
        trafficResetDay: { type: integer, minimum: 1, maximum: 31, description: 每月几号重置，当月没有这一天取月末 }
        trafficMode: { $ref: "#/components/schemas/TrafficMode" }
    ServerBillingInput:
      allOf:
        - $ref: "#/components/schemas/ServerBilling"
        - type: object
          properties:
            trafficUsedBytes:
              type: [integer, "null"]
              format: int64
              minimum: 0
              description: 校准：把本周期已用改成这个值；不带或 null 为不校准
    ServerTraffic:
      type: object
      description: 当前流量周期的用量（0.16.0，Ruling-84）；只有接入之后的数据
      required: [cycleStart, nextResetOn, sentBytes, recvBytes, usedBytes]
      properties:
        cycleStart: { type: string, format: date, description: 本周期起始日 }
        nextResetOn: { type: string, format: date, description: 下一次重置的日期 }
        sentBytes: { type: integer, format: int64, description: 本周期网卡发送（出站）字节 }
        recvBytes: { type: integer, format: int64, description: 本周期网卡接收（入站）字节 }
        usedBytes: { type: integer, format: int64, description: 按计量方式折算并加上校准值后的已用字节，不小于 0 }
    ServerHostBrief:
      type: object
      required: [osId, arch, certNotAfter]
      properties:
        osId: { type: string, description: 系统标识（如 debian、ubuntu），没检测到为空串 }
        arch: { type: string }
        certNotAfter: { type: [string, "null"], format: date-time, description: 平台申请的面板证书的到期时间 }
    LatencyIsp:
      type: string
      description: 运营商：telecom 电信，unicom 联通，mobile 移动
      enum: [telecom, unicom, mobile]
    LatencyPoint:
      type: object
      required: [at, avgMs, lossPercent]
      properties:
        at: { type: string, format: date-time }
        avgMs: { type: [integer, "null"], description: 平均延迟（毫秒）；全丢为 null }
        lossPercent: { type: integer, minimum: 0, maximum: 100 }
    LatencySeries:
      type: object
      description: 三家运营商各自的延迟序列，按时间升序（Ruling-86）
      required: [telecom, unicom, mobile]
      properties:
        telecom: { type: array, items: { $ref: "#/components/schemas/LatencyPoint" } }
        unicom: { type: array, items: { $ref: "#/components/schemas/LatencyPoint" } }
        mobile: { type: array, items: { $ref: "#/components/schemas/LatencyPoint" } }
    ServerNetPoint:
      type: object
      required: [at, up, down]
      properties:
        at: { type: string, format: date-time }
        up: { type: integer, format: int64, description: 上行速率，字节每秒 }
        down: { type: integer, format: int64, description: 下行速率，字节每秒 }
    ServerTrend:
      type: object
      required: [serverId, net, latency]
      properties:
        serverId: { type: integer, format: int64 }
        net: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/ServerNetPoint" } }
        latency:
          oneOf:
            - $ref: "#/components/schemas/LatencySeries"
            - type: "null"
          description: 每家最多 30 个点；三网延迟检测没开为 null
    ServerMetricPoint:
      type: object
      description: 一个时段的资源采样；Ruling-85 之前的采样只有 cpu 与 onlineClients，其余为 null
      required: [at, cpu, onlineClients, memUsed, memTotal, diskUsed, diskTotal, load1, netUpRate, netDownRate, tcpCount, udpCount]
      properties:
        at: { type: string, format: date-time, description: 时段起点（5 分钟或 1 小时对齐） }
        cpu: { type: [number, "null"] }
        onlineClients: { type: integer }
        memUsed: { type: [integer, "null"], format: int64 }
        memTotal: { type: [integer, "null"], format: int64 }
        diskUsed: { type: [integer, "null"], format: int64 }
        diskTotal: { type: [integer, "null"], format: int64 }
        load1: { type: [number, "null"] }
        netUpRate: { type: [integer, "null"], format: int64 }
        netDownRate: { type: [integer, "null"], format: int64 }
        tcpCount: { type: [integer, "null"] }
        udpCount: { type: [integer, "null"] }
    ServerMetrics:
      type: object
      required: [range, points, latency]
      properties:
        range: { $ref: "#/components/schemas/MetricRange" }
        points:
          type: array
          items: { $ref: "#/components/schemas/ServerMetricPoint" }
        latency:
          oneOf:
            - $ref: "#/components/schemas/LatencySeries"
            - type: "null"
          description: 三网延迟检测没开为 null
    ServerEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Server" }
    SshAuthType:
      type: string
      enum: [key, password]
    SshCredential:
      type: object
      required: [id, name, username, authType, keyFingerprint, remark, hostCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        username: { type: string }
        authType: { $ref: "#/components/schemas/SshAuthType" }
        keyFingerprint: { type: string, description: "公钥指纹（SHA256:…），只用于展示；密码认证为空串" }
        remark: { type: string }
        hostCount: { type: integer, description: 引用这份凭据的主机数 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SshCredentialInput:
      type: object
      required: [name, username, authType]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        username: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-zA-Z_][a-zA-Z0-9_.-]*$" }
        authType: { $ref: "#/components/schemas/SshAuthType" }
        secret: { type: string, maxLength: 16384, description: 只写。私钥（OpenSSH / PEM）或密码；新建必填，更新时留空表示沿用原值 }
        passphrase: { type: string, maxLength: 255, description: 只写。私钥口令；更新时留空表示沿用原值，随新私钥一起提交时以提交的为准 }
        remark: { type: string, maxLength: 255 }
    DnsProviderType:
      type: string
      enum: [cloudflare]
    DnsAccount:
      type: object
      required: [id, name, providerType, zone, remark, hostCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        providerType: { $ref: "#/components/schemas/DnsProviderType" }
        zone: { type: string, description: 根域名，如 example.com }
        remark: { type: string }
        hostCount: { type: integer, description: 引用这个账号的主机数 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DnsAccountInput:
      type: object
      required: [name, providerType, zone]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        providerType: { $ref: "#/components/schemas/DnsProviderType" }
        zone: { type: string, minLength: 1, maxLength: 255, description: 根域名；保存时转小写 }
        token: { type: string, maxLength: 255, description: 只写。服务商的 API 令牌，须能读这个域名并编辑它的 DNS 记录；新建必填，更新时留空表示沿用原值 }
        remark: { type: string, maxLength: 255 }
    HostDomain:
      type: string
      maxLength: 255
      description: 面板用的域名，须是所选 DNS 账号的根域名或其子域名；选了 DNS 账号而留空时由平台按主机名称生成；没选 DNS 账号时必须为空串
    HostAddress:
      type: string
      minLength: 1
      maxLength: 255
      description: IP 或域名；不能是回环或未指定地址
    HostTaskKind:
      type: string
      enum: [provision, verify, restart_panel, restart_core, upgrade, reissue_token, enable_tls, diagnose, deploy_inbounds]
      description: >-
        provision 部署（安装或接管）、verify 校验连接、restart_panel 重启面板、restart_core 重启内核、
        upgrade 升级或修复到平台基线版本、reissue_token 重签令牌、enable_tls 配置证书、diagnose 查看状态与最近日志、
        deploy_inbounds 一键部署入站（0.14.0）
    ClientFlow:
      type: string
      enum: ["", xtls-rprx-vision]
      description: 服务器的 VLESS 流控（Ruling-77）：空串为不带；打开后平台下发的 client 带这个 flow，只在支持它的 VLESS 入站上生效
    InboundPresetKey:
      type: string
      enum: [vless_reality_vision, vless_reality_mlkem, vless_xhttp_tls, vmess_ws_tls, trojan_tls, shadowsocks_2022, hysteria2_salamander]
      description: >-
        一键部署的预设（docs/03 §5.1）：vless_reality_vision VLESS+TCP+REALITY+Vision、vless_reality_mlkem 同上加 ML-KEM-768 VLESS Encryption、
        vless_xhttp_tls VLESS+XHTTP+TLS、vmess_ws_tls VMess+WebSocket+TLS、trojan_tls Trojan+TCP+TLS、
        shadowsocks_2022 Shadowsocks 2022-blake3-aes-256-gcm、hysteria2_salamander Hysteria2+TLS+Salamander
    InboundPresetOption:
      type: object
      required: [key, available, reason, port, needsCert]
      properties:
        key: { $ref: "#/components/schemas/InboundPresetKey" }
        available: { type: boolean }
        reason: { type: string, description: 不能部署的原因，可直接展示；能部署为空串 }
        port: { type: integer, description: 建议端口（避开主机正在监听的端口与面板已有入站） }
        needsCert: { type: boolean, description: 要主机的域名证书 }
    InboundPresetPreview:
      type: object
      required: [hostId, domain, certReady, items]
      properties:
        hostId: { type: integer, format: int64 }
        domain: { type: string, description: 主机域名，没有 DNS 账号为空串 }
        certReady: { type: boolean, description: 主机上已有平台签的证书；为 false 且有域名时部署会先配置证书 }
        items:
          type: array
          items: { $ref: "#/components/schemas/InboundPresetOption" }
    InboundPresetDeployInput:
      type: object
      required: [items, nodeGroupIds]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: object
            required: [key, port]
            properties:
              key: { $ref: "#/components/schemas/InboundPresetKey" }
              port: { type: integer, minimum: 1, maximum: 65535 }
        nodeGroupIds:
          type: array
          maxItems: 50
          items: { type: integer, format: int64 }
          description: 新入站的直连节点要加进的节点组，可为空
        namePrefix: { $ref: "#/components/schemas/NodeNameAffix" }
        nameSuffix: { $ref: "#/components/schemas/NodeNameAffix" }
    HostTaskStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    HostErrorCode:
      type: string
      enum: ["", unsupported_os, no_systemd, no_root, nonstandard_install, listen_local, version_too_old, download_failed,
             panel_unreachable, auth_failed, unreachable, host_key_changed, name_taken, dns_failed, cert_failed, interrupted, command_failed,
             port_in_use, xray_down]
      description: 失败或不能部署的原因大类（docs/03 §5.22），空串为没有；port_in_use（所选端口已被主机上的程序占用）、xray_down（建完入站后面板的 Xray 没在运行）自 0.14.0
    HostTask:
      type: object
      required: [id, hostId, kind, status, step, errorCode, lastError, createdByName, createdAt, startedAt, finishedAt]
      properties:
        id: { type: integer, format: int64 }
        hostId: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/HostTaskKind" }
        status: { $ref: "#/components/schemas/HostTaskStatus" }
        step: { type: string, description: "当前或最后所在的步骤：connect、detect、install、adopt、register、run、dns、issue、install_cert、ports、inbounds、firewall、xray、node_groups，还没开始为空串" }
        errorCode: { $ref: "#/components/schemas/HostErrorCode" }
        lastError: { type: string, description: 脱敏后的失败摘要，没有为空串 }
        createdByName: { type: string, description: 发起任务的管理员用户名；系统发起（证书自动续期）或管理员已被删除为空串 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    HostTaskDetail:
      allOf:
        - $ref: "#/components/schemas/HostTask"
        - type: object
          required: [log]
          properties:
            log: { type: string, description: 脱敏后的步骤日志，最多 64 KB }
    ServerHost:
      type: object
      required: [id, name, address, sshPort, credentialId, credentialName, providerType, region, panelPort, hostKeySha256, osId, arch, serverId, serverName, dnsAccountId, dnsAccountName, domain, certNotAfter, lastTask, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        sshPort: { type: integer }
        credentialId: { type: integer, format: int64 }
        credentialName: { type: string }
        providerType: { type: string }
        region: { type: string }
        panelPort: { type: [integer, "null"], description: 安装时指定的面板端口，null 为随机 }
        hostKeySha256: { type: string, description: "已固定的主机公钥指纹（SHA256:…），空串为还没记录" }
        osId: { type: string, description: 最近一次检测到的发行版标识，如 debian；未检测为空串 }
        arch: { type: string }
        serverId: { type: [integer, "null"], format: int64, description: 已关联的服务器 }
        serverName: { type: string, description: 已关联服务器的名称，没有为空串 }
        dnsAccountId: { type: [integer, "null"], format: int64, description: 申请公开证书用的 DNS 账号；null 为不申请，面板用自签证书 }
        dnsAccountName: { type: string, description: DNS 账号的名称，没有为空串 }
        domain: { type: string, description: 面板用的域名，没有为空串 }
        certNotAfter: { type: [string, "null"], format: date-time, description: 平台申请的证书的到期时间；null 为还没申请到 }
        lastTask:
          oneOf:
            - $ref: "#/components/schemas/HostTask"
            - type: "null"
        createdAt: { type: string, format: date-time }
    ServerHostInput:
      type: object
      required: [name, address, sshPort, credentialId]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        address: { $ref: "#/components/schemas/HostAddress" }
        sshPort: { type: integer, minimum: 1, maximum: 65535 }
        credentialId: { type: integer, format: int64, minimum: 1 }
        region: { $ref: "#/components/schemas/CountryCode" }
        panelPort: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        dnsAccountId: { type: [integer, "null"], format: int64, minimum: 1, description: null 或不带表示不用 DNS 账号 }
        domain: { $ref: "#/components/schemas/HostDomain" }
        credentialSecret: { type: string, maxLength: 255, writeOnly: true, description: "所选凭据的密码，再输入一次用于比对；凭据是 password 类型、且这个（地址，端口）还没用过该凭据时必填（Ruling-97）" }
    ServerHostBatchInput:
      type: object
      required: [credentialId, providerType, hosts]
      properties:
        credentialId: { type: integer, format: int64, minimum: 1 }
        credentialSecret: { type: string, maxLength: 255, writeOnly: true, description: "所选凭据的密码，再输入一次用于比对；凭据是 password 类型、且本批中有（地址，端口）还没用过该凭据时必填，整批比对一次（Ruling-97）" }
        sshPort: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        providerType: { type: string, enum: [xui] }
        panelPort: { type: [integer, "null"], minimum: 1, maximum: 65535, description: 安装时用的面板端口，整批相同；null 为各自随机 }
        dnsAccountId: { type: [integer, "null"], format: int64, minimum: 1, description: 整批共用的 DNS 账号；null 或不带表示不申请公开证书 }
        hosts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [address, name]
            properties:
              address: { $ref: "#/components/schemas/HostAddress" }
              name: { type: string, minLength: 1, maxLength: 64 }
              region: { $ref: "#/components/schemas/CountryCode" }
              domain: { $ref: "#/components/schemas/HostDomain" }
    ServerHostTestInput:
      type: object
      required: [address, credentialId, providerType]
      properties:
        address: { $ref: "#/components/schemas/HostAddress" }
        sshPort: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        credentialId: { type: integer, format: int64, minimum: 1 }
        providerType: { type: string, enum: [xui] }
        credentialSecret: { type: string, maxLength: 255, writeOnly: true, description: "所选凭据的密码，再输入一次用于比对；凭据是 password 类型、且这个（地址，端口）还没用过该凭据时必填（Ruling-97）" }
    ServerHostBindInput:
      type: object
      required: [address, credentialId]
      properties:
        address: { $ref: "#/components/schemas/HostAddress" }
        sshPort: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        credentialId: { type: integer, format: int64, minimum: 1 }
        credentialSecret: { type: string, maxLength: 255, writeOnly: true, description: "所选凭据的密码，再输入一次用于比对；凭据是 password 类型、且这个（地址，端口）还没用过该凭据时必填（Ruling-97）" }
    ServerHostResetKeyInput:
      type: object
      properties:
        credentialSecret: { type: string, maxLength: 255, writeOnly: true, description: "该主机所用凭据的密码，再输入一次用于比对；凭据是 password 类型时必填——重置后下次连接接受任何主机密钥，等同该（地址，端口）首次使用该凭据（Ruling-97）" }
    HostDetection:
      type: object
      required: [hostKeySha256, osId, arch, isPrivileged, panelState, panelVersion, plan, reason]
      properties:
        hostKeySha256: { type: string, description: "本次连接看到的主机公钥指纹（SHA256:…）" }
        osId: { type: string }
        arch: { type: string }
        isPrivileged: { type: boolean, description: 登录用户是 root 或能免密 sudo }
        panelState: { type: string, enum: [none, standard, nonstandard], description: 没有面板 / 标准安装的面板 / 非标准安装（如 Docker） }
        panelVersion: { type: string, description: 已有面板的版本，没有为空串 }
        plan: { type: string, enum: ["", install, adopt], description: 部署时会走安装还是接管；不能部署为空串 }
        reason: { $ref: "#/components/schemas/HostErrorCode" }
    HostActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [provision, restart_panel, restart_core, upgrade, reissue_token, enable_tls, diagnose]
    PanelLogin:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    SyncResult:
      type: object
      required: [inbounds, added, updated, missing, drifted]
      properties:
        inbounds: { type: integer, description: 面板上的入站总数 }
        added: { type: integer }
        updated: { type: integer }
        missing: { type: integer, description: 平台有、面板已不存在的入站数 }
        drifted: { type: integer, description: 本次发现面板侧改动的入站数 }
    Endpoint:
      type: object
      required: [id, address, port, remark, isDisabled, isMissing]
      properties:
        id: { type: integer, format: int64 }
        address: { type: string }
        port: { type: integer, description: 0 表示沿用入站端口 }
        remark: { type: string }
        isDisabled: { type: boolean }
        isMissing: { type: boolean }
    Inbound:
      type: object
      required: [id, serverId, remoteRef, protocol, port, listen, tag, remark, isEnabled, network, security, coreType, config, clientCount, isMissing, endpoints, createdAt]
      properties:
        id: { type: integer, format: int64 }
        serverId: { type: integer, format: int64 }
        remoteRef: { type: string }
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        tag: { type: string }
        remark: { type: string }
        isEnabled: { type: boolean }
        network: { type: string }
        security: { type: string }
        coreType: { type: string, enum: [xray] }
        config: { type: object, additionalProperties: true, description: 面板配置副本（settings、streamSettings、sniffing），敏感字段已删除 }
        clientCount: { type: integer }
        driftDetectedAt: { type: [string, "null"], format: date-time }
        isMissing: { type: boolean }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        createdAt: { type: string, format: date-time }
    InboundEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Inbound" }
    InboundTemplate:
      type: string
      enum: [vless-reality, vmess-ws, shadowsocks-2022]
    InboundCreateInput:
      type: object
      required: [remark, port]
      description: template 与 config 二选一；template 时按其参数生成配置与密钥，config 为高级 JSON（settings、streamSettings、sniffing）
      properties:
        remark: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        listen: { type: string, maxLength: 64 }
        enabled: { type: boolean, default: true }
        template: { $ref: "#/components/schemas/InboundTemplate" }
        templateParams:
          type: object
          description: vless-reality 需 target（如 www.cloudflare.com:443）与 serverNames；vmess-ws 需 path；shadowsocks-2022 可选 method
          additionalProperties: true
        protocol: { type: string, maxLength: 32, description: 高级 JSON 模式必填 }
        config: { type: object, additionalProperties: true, description: 高级 JSON 模式必填 }
    InboundPanelConfig:
      type: object
      required: [protocol, port, listen, remark, enabled, config]
      properties:
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        remark: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: 面板上的 settings / streamSettings / sniffing（含密钥，settings 不含 clients） }
    PanelKeyKind:
      type: string
      enum: [x25519, mldsa65, vlessenc]
    InboundUpdateInput:
      type: object
      required: [remark, port]
      properties:
        remark: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        listen: { type: string, maxLength: 64 }
        config: { type: object, additionalProperties: true, description: 省略则不改配置；提供时整体替换（敏感字段与 clients 由服务端补回） }
    EndpointInput:
      type: object
      required: [inboundIds, addresses]
      properties:
        inboundIds:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: integer, format: int64 }
        addresses:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 0, maximum: 65535, description: 0 表示沿用入站端口 }
        remark: { type: string, maxLength: 255 }
    Node:
      type: object
      required: [id, inboundId, serverId, serverName, protocol, address, port, displayName, region, tags, sortOrder, isEnabled, isMissing, groupIds, reach]
      properties:
        id: { type: integer, format: int64 }
        inboundId: { type: integer, format: int64 }
        endpointId: { type: [integer, "null"], format: int64 }
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        protocol: { type: string }
        address: { type: string, description: 直连节点为面板主机名，Host 节点为对外地址 }
        port: { type: integer }
        displayName: { type: string }
        region: { type: string, description: 所在服务器的位置（只读，跟随服务器，Ruling-65） }
        tags:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
        isEnabled: { type: boolean }
        isMissing: { type: boolean, description: 来源入站或地址在面板上已不存在 }
        groupIds:
          type: array
          items: { type: integer, format: int64 }
        reach:
          description: 大陆连通结论（0.11.0，Ruling-67）；功能没开或节点不在检测范围（停用、缺失、所在服务器停用）为 null
          oneOf:
            - { $ref: "#/components/schemas/NodeReach" }
            - { type: "null" }
    NodeInput:
      type: object
      required: [displayName, tags, sortOrder, isEnabled]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        tags:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 32 }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
        isEnabled: { type: boolean }
    NodeNameAffix:
      type: string
      maxLength: 32
      default: ""
      description: >-
        节点显示名的前缀或后缀（0.14.1，Ruling-80）：不含控制字符；前缀开头、后缀结尾的空白会被去掉，中间的空格保留；空串为不加
    NodeAffixInput:
      type: object
      required: [nodeIds, prefix, suffix]
      properties:
        nodeIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: integer, format: int64 }
        prefix: { $ref: "#/components/schemas/NodeNameAffix" }
        suffix: { $ref: "#/components/schemas/NodeNameAffix" }
    NodeGroup:
      type: object
      required: [id, name, remark, nodeIds]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        remark: { type: string }
        nodeIds:
          type: array
          items: { type: integer, format: int64 }
    NodeGroupInput:
      type: object
      required: [name, nodeIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        remark: { type: string, maxLength: 255 }
        nodeIds:
          type: array
          maxItems: 5000
          items: { type: integer, format: int64 }
    TrafficReset:
      type: string
      enum: [never, hourly, daily, weekly, monthly]
    UserStatus:
      type: string
      enum: [active, limited, expired, disabled]
    ProvisionStatus:
      type: string
      enum: [pending, synced, failed]
    PlanBase:
      type: object
      required: [name, trafficLimit, durationDays, nodeGroupIds]
      description: 套餐的额度模板与售卖属性（docs/03 §5.2、§5.12）；免费续期自 0.4.0 起只在用户上（Ruling-20）
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        trafficLimit: { type: integer, format: int64, minimum: 0, description: 流量额度（字节），0 不限 }
        durationDays: { type: integer, minimum: 0, maximum: 36500, description: 时长（天），0 不限 }
        startOnFirstUse: { type: boolean, default: false, description: 首次使用后才开始计时 }
        limitIp: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        trafficResetDay: { type: integer, minimum: 1, maximum: 31, default: 1 }
        allowClientChain: { type: boolean, default: false }
        allowCustomNode: { type: boolean, default: false }
        allowServerChain: { type: boolean, default: false, description: 服务端链式（0.4.2，Ruling-41） }
        remark: { type: string, maxLength: 255 }
        nodeGroupIds:
          type: array
          maxItems: 500
          items: { type: integer, format: int64 }
        isOnSale: { type: boolean, default: false, description: 是否在商店上架；没有时长选项的套餐上架了也不显示（0.4.0） }
        isTrial: { type: boolean, default: false, description: 试用套餐：每个用户终身只能下单一次（0.4.0） }
        sortOrder: { type: integer, minimum: 0, maximum: 100000, default: 0, description: 商店里的排序，小的在前（0.4.0） }
        description: { type: string, maxLength: 500, description: 卖点说明，纯文本，一行一条（0.4.0） }
    PlanInput:
      allOf:
        - $ref: "#/components/schemas/PlanBase"
        - type: object
          properties:
            prices:
              type: array
              maxItems: 6
              description: 时长选项，整体替换；天数不得重复；省略 = 不改（新建时为空）（0.4.0）
              items: { $ref: "#/components/schemas/PlanPriceInput" }
    Plan:
      allOf:
        - $ref: "#/components/schemas/PlanBase"
        - type: object
          required: [id, userCount, createdAt, prices]
          properties:
            id: { type: integer, format: int64 }
            userCount: { type: integer, description: 当前分配了该套餐的用户数 }
            createdAt: { type: string, format: date-time }
            prices: { type: array, items: { $ref: "#/components/schemas/PlanPrice" }, description: 按天数升序（0.4.0） }
    UserQuotaInput:
      type: object
      required: [trafficLimit, trafficUsed, expiresAt, pendingDays, limitIp, renewEveryDays, renewMonthDay, renewWeekday, renewMax, trafficReset, trafficResetDay]
      properties:
        trafficLimit: { type: integer, format: int64, minimum: 0 }
        trafficUsed: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: [string, "null"], format: date-time, description: null 表示不过期（或等待首次使用） }
        pendingDays: { type: integer, minimum: 0, maximum: 36500, description: ">0 且 expiresAt 为 null：首次使用后起算的天数" }
        limitIp: { type: integer, minimum: 0, maximum: 1000 }
        renewEveryDays: { type: integer, minimum: 0, maximum: 3650 }
        renewMonthDay: { type: integer, minimum: 0, maximum: 31 }
        renewWeekday: { type: integer, minimum: 0, maximum: 7 }
        renewMax: { type: integer, minimum: 0, maximum: 10000 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        trafficResetDay: { type: integer, minimum: 1, maximum: 31 }
    User:
      allOf:
        - $ref: "#/components/schemas/UserQuotaInput"
        - type: object
          required: [id, username, remark, planId, planName, status, isDisabled, renewCount, provisions, agent, createdAt]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
            remark: { type: string }
            planId: { type: [integer, "null"], format: int64 }
            planName: { type: string }
            status: { $ref: "#/components/schemas/UserStatus" }
            isDisabled: { type: boolean }
            renewCount: { type: integer }
            provisions:
              type: object
              description: 各面板下发状态计数
              required: [synced, pending, failed]
              properties:
                synced: { type: integer }
                pending: { type: integer }
                failed: { type: integer }
            totpEnabled: { type: boolean, description: 是否已开启两步验证（0.2.6） }
            lastUsedAt: { type: [string, "null"], format: date-time, description: 最近一次产生流量的时间（0.2.6） }
            email: { type: [string, "null"], description: 未绑定为 null（0.3.0） }
            isEmailVerified: { type: boolean, description: 0.3.0 }
            invitedBy: { type: [integer, "null"], format: int64, description: 邀请人用户 id（0.3.0） }
            invitedByUsername: { type: string, description: 没有邀请人时为空串（0.3.0） }
            balance: { type: integer, format: int64, description: 余额（分）（0.4.0） }
            autoRenew: { type: boolean, description: 是否开了扣余额自动续费（0.4.0） }
            agent:
              description: 所属代理；null = 平台用户（0.18.0，Ruling-102）
              oneOf:
                - $ref: "#/components/schemas/AgentBrief"
                - type: "null"
            createdAt: { type: string, format: date-time }
    UserCreateInput:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/UserPassword" }
        email: { $ref: "#/components/schemas/Email" }
        remark: { type: string, maxLength: 255 }
        planId: { type: integer, format: int64, minimum: 1, description: 省略则不分配套餐（无可用节点） }
    UserUpdateInput:
      type: object
      required: [remark, isDisabled]
      properties:
        remark: { type: string, maxLength: 255 }
        isDisabled: { type: boolean }
        email: { type: string, maxLength: 254, description: 省略不改；空串清除；其余按邮箱校验并视为已验证（0.3.0） }
    Provision:
      type: object
      required: [serverId, serverName, email, status, lastError, retryCount, syncedAt, updatedAt]
      properties:
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        email: { type: string, description: 面板上的 client email }
        status: { $ref: "#/components/schemas/ProvisionStatus" }
        lastError: { type: string }
        retryCount: { type: integer }
        syncedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    UserPassword:
      type: string
      minLength: 8
      maxLength: 128
    UserPasswordChangeInput:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { $ref: "#/components/schemas/UserPassword" }
    UserSession:
      type: object
      required: [user, csrfToken, totpEnabled]
      properties:
        user:
          type: object
          required: [id, username, status]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
            status: { $ref: "#/components/schemas/UserStatus" }
            email: { type: [string, "null"], description: 未绑定为 null（0.3.0） }
            isEmailVerified: { type: boolean, description: 0.3.0 }
        totpEnabled: { type: boolean }
        csrfToken: { type: string }
        impersonated: { type: boolean, description: 真 = 管理员代入的只读会话，除退出外的写请求都会被拒（0.4.0，Ruling-33） }
        features:
          type: object
          description: 当前套餐开了哪些功能，决定菜单显隐；后端仍做最终校验（0.4.1）
          required: [clientChain, customNode, serverChain]
          properties:
            clientChain: { type: boolean, description: 可以使用客户端链式 }
            customNode: { type: boolean, description: 可以添加自有落地节点 }
            serverChain: { type: boolean, description: 可以使用服务端链式（0.4.2） }
    UserSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserSession" }
    UserDashboard:
      type: object
      required: [status, planName, trafficLimit, trafficUsed, trafficToday, expiresAt, pendingDays, limitIp, onlineDevices, lastUsedAt, nodeCount]
      properties:
        status: { $ref: "#/components/schemas/UserStatus" }
        planName: { type: string, description: 没有套餐时为空串 }
        trafficLimit: { type: integer, format: int64, description: 字节，0 不限 }
        trafficUsed: { type: integer, format: int64 }
        trafficToday: { type: integer, format: int64, description: 今日（平台时区）已用字节 }
        expiresAt: { type: [string, "null"], format: date-time }
        pendingDays: { type: integer, description: 大于 0 表示首次使用后才开始计时的天数 }
        limitIp: { type: integer, description: 同时在线 IP 数，0 不限 }
        onlineDevices: { type: [integer, "null"], description: 各面板在线 client 数之和；面板都不提供时为 null }
        lastUsedAt: { type: [string, "null"], format: date-time }
        nodeCount: { type: integer, description: 当前可用节点数 }
        announcement: { oneOf: [{ $ref: "#/components/schemas/Announcement" }, { type: "null" }], description: 最新一条已发布公告（0.3.0） }
        popupAnnouncement: { oneOf: [{ $ref: "#/components/schemas/Announcement" }, { type: "null" }], description: 最新一条标了弹窗的已发布公告（0.3.0） }
        balance: { type: integer, format: int64, description: 余额（分）（0.4.0） }
    TrafficPoint:
      type: object
      required: [hour, up, down]
      properties:
        hour: { type: string, format: date-time }
        up: { type: integer, format: int64 }
        down: { type: integer, format: int64 }
    UserNode:
      type: object
      required: [id, name, region, protocol, isServerOnline, serverLoad, onlineClients]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        region: { type: string, description: 所在服务器的位置（ISO 两位国家码，空串为未知；Ruling-65） }
        protocol: { type: string }
        isServerOnline: { type: boolean }
        serverLoad: { type: [number, "null"], description: 所在服务器的 CPU 占用百分比，未知为 null }
        onlineClients: { type: integer, description: 所在服务器的在线 client 数 }
    UserNodeGroup:
      type: object
      required: [id, name, nodes]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/UserNode" } }
    NodeLink:
      type: object
      required: [link]
      properties:
        link: { type: string, description: 分享链接，属于凭据 }
    SubscriptionFormat:
      type: string
      enum: [base64, mihomo, singbox, xray]
    SubscriptionInfo:
      type: object
      required: [url, formats, updateIntervalHours, hasCustomPassword]
      properties:
        url: { type: string, description: 不带 format 参数的订阅地址，属于凭据 }
        hasCustomPassword: { type: boolean, description: 是否自设了连接密码（0.8.0，Ruling-58）；不回传密码本身 }
        formats:
          type: array
          items:
            type: object
            required: [format, url]
            properties:
              format: { $ref: "#/components/schemas/SubscriptionFormat" }
              url: { type: string }
        updateIntervalHours: { type: integer }
    LoginLog:
      type: object
      required: [clientIp, isSuccess, createdAt]
      properties:
        clientIp: { type: string }
        isSuccess: { type: boolean }
        createdAt: { type: string, format: date-time }
    SubscribeLog:
      type: object
      required: [id, userId, username, format, clientIp, userAgent, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        format: { $ref: "#/components/schemas/SubscriptionFormat" }
        clientIp: { type: string }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
    SubscribeLogPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SubscribeLog" } }
        total: { type: integer, format: int64 }
    Email:
      type: string
      format: email
      maxLength: 254
    EmailCode:
      type: string
      pattern: "^[0-9]{6}$"
    Markdown:
      type: string
      maxLength: 20000
      description: Markdown 源文本；前端渲染不执行原始 HTML（Ruling-25）
    RegisterMode:
      type: string
      enum: [open, invite, closed]
    SiteInfo:
      type: object
      required: [siteName, registerMode, emailVerifyRequired, mailEnabled, checkinEnabled, ticketEnabled, sharedEnabled, menuOrder]
      properties:
        siteName: { type: string }
        menuOrder: { $ref: "#/components/schemas/MenuOrder", description: "客户门户侧栏菜单顺序（系统设置 menu.user，0.7.3，Ruling-57）；空数组 = 默认顺序" }
        registerMode: { $ref: "#/components/schemas/RegisterMode" }
        emailVerifyRequired: { type: boolean, description: 注册是否要先验证邮箱（设置为真且邮件可用） }
        mailEnabled: { type: boolean, description: 邮件是否可用；为假时找回密码与换绑邮箱不可用 }
        checkinEnabled: { type: boolean }
        ticketEnabled: { type: boolean }
        sharedEnabled: { type: boolean }
        shopEnabled: { type: boolean, description: 商店与钱包是否开启（0.4.0） }
        currency: { $ref: "#/components/schemas/Currency" }
        landing:
          type: object
          description: 落地页（0.4.3）；enabled 为假时 headline 与 intro 为空串
          required: [enabled, headline, intro]
          properties:
            enabled: { type: boolean }
            headline: { type: string, description: 空串 = 用站点名 }
            intro: { type: string, description: Markdown，按公告规则渲染（Ruling-25） }
        support:
          type: object
          description: 客服入口（0.4.3，Ruling-44）；url 为空串时不显示
          required: [url, label]
          properties:
            url: { type: string }
            label: { type: string }
    Settings:
      type: object
      description: 全部系统设置（docs/03 §5.6 设置清单），键名去掉点号改驼峰分组
      required: [site, register, invite, checkin, ticket, shared, mail, subscription, shop, rebate, notify, mailEnabled, alert, telegram, report, landing, support, routing, menu, telegramEnabled, reach,
                 latency]
      properties:
        mailEnabled: { type: boolean, readOnly: true, description: SMTP 环境变量是否已配置（Ruling-24），不可经接口修改 }
        telegramEnabled: { type: boolean, readOnly: true, description: 环境变量 HUB_TELEGRAM_BOT_TOKEN 是否已配置（0.4.3，Ruling-42） }
        alert:
          type: object
          description: 掉线告警（0.4.3，docs/03 §5.20）
          required: [emails, offlineMinutes]
          properties:
            emails: { type: array, maxItems: 10, items: { type: string, maxLength: 254 } }
            offlineMinutes: { type: integer, minimum: 1, maximum: 60 }
        telegram:
          type: object
          description: Telegram 管理员通知（0.4.3，Ruling-42）
          required: [chatId, notifyAlerts, notifyTickets, notifyPayments]
          properties:
            chatId: { type: string, maxLength: 64, description: 空串 = 不发 }
            notifyAlerts: { type: boolean }
            notifyTickets: { type: boolean }
            notifyPayments: { type: boolean }
        report:
          type: object
          description: 运营日报（0.4.3）
          required: [dailyEnabled, dailyHour]
          properties:
            dailyEnabled: { type: boolean }
            dailyHour: { type: integer, minimum: 0, maximum: 23 }
        landing:
          type: object
          description: 落地页（0.4.3）
          required: [enabled, headline, intro]
          properties:
            enabled: { type: boolean }
            headline: { type: string, maxLength: 64 }
            intro: { type: string, maxLength: 2000 }
        support:
          type: object
          description: 客服入口（0.4.3，Ruling-44）
          required: [url, label]
          properties:
            url: { type: string, maxLength: 255, description: https:// 地址或空串 }
            label: { type: string, minLength: 1, maxLength: 16 }
        routing:
          type: object
          description: 服务器 Xray 模板里的平台条目（0.7.1，docs/03 §5.19 拦截规则）
          required: [blockRule]
          properties:
            blockRule: { type: boolean, description: 在每台已接入服务器的模板里加平台拦截规则 hub-block（Ruling-55），默认开 }
        reach:
          type: object
          description: 大陆连通检测（0.11.0，docs/03 §5.20，Ruling-67）
          required: [enabled, intervalMinutes, notify, hasToken]
          properties:
            enabled: { type: boolean, description: 开启后节点地址与端口会发给第三方探测服务，默认关 }
            intervalMinutes: { type: integer, minimum: 10, maximum: 1440, description: 同一目标两次检测的最小间隔 }
            notify: { type: boolean, description: 被墙与恢复时是否发通知 }
            hasToken: { type: boolean, readOnly: true, description: 环境变量 HUB_GLOBALPING_TOKEN 是否已配置（决定每小时额度），不可经接口修改 }
        latency:
          type: object
          description: 三网延迟检测（0.16.0，docs/03 §5.20，Ruling-86）
          required: [enabled, intervalMinutes]
          properties:
            enabled: { type: boolean, description: 开启后服务器的公网 IP 会发给第三方探测服务，默认关 }
            intervalMinutes: { type: integer, minimum: 15, maximum: 1440, description: 同一台服务器两次检测的最小间隔 }
        menu:
          type: object
          description: 侧栏菜单顺序（0.7.3，docs/03 §5.6 菜单顺序，Ruling-57）；空数组 = 默认顺序
          required: [admin, user]
          properties:
            admin: { $ref: "#/components/schemas/MenuOrder" }
            user: { $ref: "#/components/schemas/MenuOrder" }
        site:
          type: object
          required: [name, timezone]
          properties:
            name: { type: string, minLength: 1, maxLength: 32 }
            timezone: { type: string, minLength: 1, maxLength: 64, description: IANA 时区名 }
            portalUrl: { type: string, maxLength: 255, description: 客户门户的对外地址（https://…），切换为用户身份时用；空串 = 与管理端同源（0.4.0） }
        register:
          type: object
          required: [mode, emailVerify, emailAllow, emailBlock, planId]
          properties:
            mode: { $ref: "#/components/schemas/RegisterMode" }
            emailVerify: { type: boolean }
            emailAllow: { type: array, maxItems: 100, items: { type: string, maxLength: 253 } }
            emailBlock: { type: array, maxItems: 100, items: { type: string, maxLength: 253 } }
            planId: { type: integer, format: int64, minimum: 0, description: 0 = 注册不送套餐 }
        invite:
          type: object
          required: [userEnabled, userMaxUses]
          properties:
            userEnabled: { type: boolean }
            userMaxUses: { type: integer, minimum: 0, maximum: 10000 }
        checkin:
          type: object
          required: [enabled, minMb, maxMb]
          properties:
            enabled: { type: boolean }
            minMb: { type: integer, minimum: 1, maximum: 102400 }
            maxMb: { type: integer, minimum: 1, maximum: 102400 }
        ticket:
          type: object
          required: [enabled, notifyEmail]
          properties:
            enabled: { type: boolean }
            notifyEmail: { type: string, maxLength: 254, description: 空串 = 不通知 }
        shared:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
        mail:
          type: object
          required: [ratePerMinute]
          properties:
            ratePerMinute: { type: integer, minimum: 1, maximum: 600 }
        shop:
          type: object
          required: [enabled, currency]
          properties:
            enabled: { type: boolean }
            currency: { $ref: "#/components/schemas/Currency" }
        rebate:
          type: object
          required: [percent, mode]
          properties:
            percent: { type: integer, minimum: 0, maximum: 100, description: 0 = 关闭返利 }
            mode: { type: string, enum: [first, always], description: 只返被邀请人的首笔消费 / 每笔都返 }
        notify:
          type: object
          required: [expireDays, trafficPercent]
          properties:
            expireDays: { type: integer, minimum: 0, maximum: 30, description: 到期前几天提醒，0 = 不提醒 }
            trafficPercent: { type: integer, minimum: 0, maximum: 50, description: 剩余流量低于额度的百分之几时提醒，0 = 不提醒 }
        subscription:
          type: object
          required: [baseUrl, title, updateIntervalHours, infoNodes, logRetentionDays, path, pathGraceDays, oldPath, oldPathUntil]
          properties:
            baseUrl: { type: string, maxLength: 255, description: 空串 = 取请求的协议与主机 }
            title: { type: string, minLength: 1, maxLength: 64 }
            updateIntervalHours: { type: integer, minimum: 1, maximum: 168 }
            infoNodes: { type: boolean }
            logRetentionDays: { type: integer, minimum: 1, maximum: 365 }
            path: { type: string, pattern: "^[a-z0-9]{10,32}$", description: 订阅地址的路径前缀（0.8.0，Ruling-59）；修改时原值转为旧前缀 }
            pathGraceDays: { type: integer, minimum: 0, maximum: 90, description: 改前缀后旧前缀还能用几天；0 = 立即失效 }
            oldPath: { type: string, readOnly: true, description: 过渡中的旧前缀；空串 = 没有 }
            oldPathUntil: { type: [string, "null"], format: date-time, readOnly: true, description: 旧前缀的失效时间 }
    ConnectionPasswordInput:
      type: object
      required: [password]
      properties:
        password: { type: string, pattern: "^([A-Za-z0-9._~-]{8,64})?$", description: 新的连接密码；空串 = 恢复为平台随机生成 }
    SettingsInput:
      type: object
      description: 与 Settings 同形，但各分组与各键都可省略；只改出现的键
      properties:
        site: { type: object, additionalProperties: true }
        register: { type: object, additionalProperties: true }
        invite: { type: object, additionalProperties: true }
        checkin: { type: object, additionalProperties: true }
        ticket: { type: object, additionalProperties: true }
        shared: { type: object, additionalProperties: true }
        mail: { type: object, additionalProperties: true }
        shop: { type: object, additionalProperties: true }
        rebate: { type: object, additionalProperties: true }
        notify: { type: object, additionalProperties: true }
        subscription: { type: object, additionalProperties: true }
        alert: { type: object, additionalProperties: true }
        telegram: { type: object, additionalProperties: true }
        report: { type: object, additionalProperties: true }
        landing: { type: object, additionalProperties: true }
        support: { type: object, additionalProperties: true }
        routing: { type: object, additionalProperties: true }
        reach: { type: object, additionalProperties: true }
        latency: { type: object, additionalProperties: true }
        menu: { type: object, additionalProperties: true }
    MenuOrder:
      type: array
      description: 菜单键按期望顺序排成的列表（docs/03 §5.6 菜单键目录）；后端只校验格式，前端忽略不认识的键，没列到的项按默认顺序排在后面
      maxItems: 64
      uniqueItems: true
      items: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
    TestMailInput:
      type: object
      required: [to]
      properties:
        to: { $ref: "#/components/schemas/Email" }
    MailStatus:
      type: string
      enum: [pending, sent, failed]
    MailOutboxItem:
      type: object
      required: [id, recipient, subject, status, attempts, lastError, createdAt, sentAt]
      properties:
        id: { type: integer, format: int64 }
        recipient: { type: string }
        subject: { type: string }
        status: { $ref: "#/components/schemas/MailStatus" }
        attempts: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
    MailOutboxPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MailOutboxItem" } }
        total: { type: integer, format: int64 }
    MailBatchResult:
      type: object
      required: [queued]
      properties:
        queued: { type: integer, description: 入发件箱的封数 }
    InviteCodeInput:
      type: object
      required: [maxUses, isDisabled]
      properties:
        maxUses: { type: integer, minimum: 0, maximum: 100000, description: 0 = 不限；个人码忽略本项 }
        expiresAt: { type: [string, "null"], format: date-time }
        remark: { type: string, maxLength: 255 }
        isDisabled: { type: boolean }
    InviteCode:
      type: object
      required: [id, code, kind, ownerUsername, maxUses, usedCount, expiresAt, isDisabled, remark, createdAt]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        kind: { type: string, enum: [admin, user, agent], description: agent = 代理的码，经它注册的用户归该代理（0.18.0，Ruling-102） }
        ownerUserId: { type: [integer, "null"], format: int64 }
        ownerUsername: { type: string, description: 管理员码与代理码为空串 }
        agentId: { type: [integer, "null"], format: int64, description: 代理码的代理 id，其余为 null（0.18.0） }
        agentUsername: { type: string, description: 代理码的代理用户名，其余为空串（0.18.0） }
        maxUses: { type: integer, description: 个人码为设置 invite.userMaxUses 的当前值 }
        usedCount: { type: integer }
        expiresAt: { type: [string, "null"], format: date-time }
        isDisabled: { type: boolean }
        remark: { type: string }
        createdAt: { type: string, format: date-time }
    InviteCodePage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InviteCode" } }
        total: { type: integer, format: int64 }
    InviteInfo:
      type: object
      required: [enabled, code, maxUses, usedCount, invitees]
      properties:
        rebatePercent: { type: integer, description: 当前返利比例，0 = 未开启（0.4.0） }
        rebateTotal: { type: integer, format: int64, description: 累计获得的返利（分）（0.4.0） }
        rebates:
          type: array
          description: 最近 100 条返利（0.4.0）
          items:
            type: object
            required: [username, amount, createdAt]
            properties:
              username: { type: string, description: 打码后的被邀请人用户名 }
              amount: { type: integer, format: int64 }
              createdAt: { type: string, format: date-time }
        enabled: { type: boolean, description: 设置 invite.userEnabled 且本人的码未被停用 }
        code: { type: string, description: 未开启时为空串 }
        maxUses: { type: integer, description: 0 = 不限 }
        usedCount: { type: integer }
        invitees:
          type: array
          description: 最近 100 个被邀请人
          items:
            type: object
            required: [username, createdAt]
            properties:
              username: { type: string, description: 打码后的用户名 }
              createdAt: { type: string, format: date-time }
    EmailCodeInput:
      type: object
      required: [email, purpose]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        purpose: { type: string, enum: [register, reset] }
    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/UserPassword" }
        inviteCode: { type: string, minLength: 1, maxLength: 16 }
        emailCode: { $ref: "#/components/schemas/EmailCode" }
    PasswordResetInput:
      type: object
      required: [email, emailCode, newPassword]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        emailCode: { $ref: "#/components/schemas/EmailCode" }
        newPassword: { $ref: "#/components/schemas/UserPassword" }
    BindEmailCodeInput:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    BindEmailInput:
      type: object
      required: [currentPassword, email, emailCode]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        email: { $ref: "#/components/schemas/Email" }
        emailCode: { $ref: "#/components/schemas/EmailCode" }
    AccountDeleteInput:
      type: object
      required: [currentPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        totpCode: { $ref: "#/components/schemas/TotpCode" }
    AnnouncementInput:
      type: object
      required: [title, content, isPinned, isPopup, isPublished]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        content: { $ref: "#/components/schemas/Markdown" }
        isPinned: { type: boolean }
        isPopup: { type: boolean }
        isPublished: { type: boolean, description: 由假变真时记发布时间；由真变假退回草稿 }
    Announcement:
      type: object
      required: [id, title, content, isPinned, isPopup, publishedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { $ref: "#/components/schemas/Markdown" }
        isPinned: { type: boolean }
        isPopup: { type: boolean }
        publishedAt: { type: [string, "null"], format: date-time, description: null = 草稿（只在管理端出现） }
        mailedAt: { type: [string, "null"], format: date-time, description: 只在管理端返回 }
        createdAt: { type: string, format: date-time, description: 只在管理端返回 }
    AnnouncementPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Announcement" } }
        total: { type: integer, format: int64 }
    TutorialPlatform:
      type: string
      enum: [windows, macos, android, ios, linux, router]
    TutorialLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 32 }
        url: { type: string, maxLength: 512, pattern: "^https://", description: 只收 https 地址 }
    TutorialInput:
      type: object
      required: [platform, clientName, isPublished]
      properties:
        platform: { $ref: "#/components/schemas/TutorialPlatform" }
        clientName: { type: string, minLength: 1, maxLength: 64 }
        summary: { type: string, maxLength: 255 }
        links: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/TutorialLink" } }
        content: { $ref: "#/components/schemas/Markdown" }
        sortOrder: { type: integer, minimum: 0, maximum: 100000 }
        isPublished: { type: boolean }
    Tutorial:
      type: object
      required: [id, platform, clientName, summary, links, content, sortOrder, isPublished]
      properties:
        id: { type: integer, format: int64 }
        platform: { $ref: "#/components/schemas/TutorialPlatform" }
        clientName: { type: string }
        summary: { type: string }
        links: { type: array, items: { $ref: "#/components/schemas/TutorialLink" } }
        content: { $ref: "#/components/schemas/Markdown" }
        sortOrder: { type: integer }
        isPublished: { type: boolean }
    UploadedImage:
      type: object
      required: [url, contentType, size]
      properties:
        url: { type: string, description: 站内路径，形如 /uploads/202611/0123456789abcdef0123456789abcdef.png }
        contentType: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        size: { type: integer, format: int64, description: 字节数 }
    SharedAccountInput:
      type: object
      required: [name, category, account, isPublished]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        category: { type: string, minLength: 1, maxLength: 32 }
        account: { type: string, minLength: 1, maxLength: 255 }
        credential: { type: string, maxLength: 255, description: 新建时必填；修改时省略或空串表示沿用原值 }
        remark: { type: string, maxLength: 255 }
        sortOrder: { type: integer, minimum: 0, maximum: 100000 }
        isPublished: { type: boolean }
        planIds: { type: array, maxItems: 100, items: { type: integer, format: int64, minimum: 1 }, description: 空 = 所有有套餐的用户可见 }
    SharedAccount:
      type: object
      required: [id, name, category, account, remark, sortOrder]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: string }
        account: { type: string }
        remark: { type: string }
        sortOrder: { type: integer }
        isPublished: { type: boolean, description: 只在管理端返回 }
        planIds: { type: array, items: { type: integer, format: int64 }, description: 只在管理端返回 }
    SharedCredential:
      type: object
      required: [credential]
      properties:
        credential: { type: string, description: 凭据，前端默认不显示，点击才取 }
    TicketStatus:
      type: string
      enum: [open, answered, closed]
    Ticket:
      type: object
      required: [id, subject, status, lastReplyAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        subject: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        lastReplyAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        userId: { type: integer, format: int64, description: 只在管理端返回 }
        username: { type: string, description: 只在管理端返回 }
    TicketPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
        total: { type: integer, format: int64 }
    TicketMessage:
      type: object
      required: [id, authorKind, content, createdAt]
      properties:
        id: { type: integer, format: int64 }
        authorKind: { type: string, enum: [user, admin] }
        authorName: { type: string, description: 只在管理端返回：管理员用户名；用户侧一律显示“客服” }
        content: { type: string, description: 纯文本，按原样显示 }
        createdAt: { type: string, format: date-time }
    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [messages]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/TicketMessage" } }
    TicketCreateInput:
      type: object
      required: [subject, content]
      properties:
        subject: { type: string, minLength: 1, maxLength: 100 }
        content: { type: string, minLength: 1, maxLength: 5000 }
    TicketMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
    CheckinInfo:
      type: object
      required: [enabled, canCheckin, reason, checkedToday, logs]
      properties:
        enabled: { type: boolean }
        canCheckin: { type: boolean }
        reason: { type: string, description: 不能签到的原因，可以签到时为空串 }
        checkedToday: { type: boolean }
        logs:
          type: array
          description: 最近 30 条
          items:
            type: object
            required: [date, rewardBytes]
            properties:
              date: { type: string, format: date }
              rewardBytes: { type: integer, format: int64 }
    CheckinResult:
      type: object
      required: [rewardBytes, trafficLimit]
      properties:
        rewardBytes: { type: integer, format: int64 }
        trafficLimit: { type: integer, format: int64, description: 奖励后的流量额度 }
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 99999999
      description: 金额，整数分（docs/03 §5.12）
    Currency:
      type: string
      enum: [CNY, USD, EUR, HKD, JPY]
      description: 显示币种；只影响前端显示，不做换算
    PlanPriceInput:
      type: object
      required: [durationDays, price]
      properties:
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        price: { $ref: "#/components/schemas/Money" }
    PlanPrice:
      allOf:
        - $ref: "#/components/schemas/PlanPriceInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    TrafficPackInput:
      type: object
      required: [name, trafficBytes, price, isOnSale]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        trafficBytes: { type: integer, format: int64, minimum: 1 }
        price: { $ref: "#/components/schemas/Money" }
        isOnSale: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    TrafficPack:
      allOf:
        - $ref: "#/components/schemas/TrafficPackInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
    CouponKind:
      type: string
      enum: [percent, fixed]
    CouponInput:
      type: object
      required: [code, kind, value, allPlans, isDisabled]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9]{4,32}$", description: 存大写，全站唯一 }
        kind: { $ref: "#/components/schemas/CouponKind" }
        value: { type: integer, format: int64, minimum: 1, maximum: 99999999, description: "percent：1–100；fixed：分" }
        allPlans: { type: boolean, description: 真 = 适用于全部套餐；假 = 只适用于 planIds }
        planIds: { type: array, maxItems: 100, items: { type: integer, format: int64, minimum: 1 } }
        forTrafficPack: { type: boolean, default: false, description: 是否适用于流量包 }
        minAmount: { $ref: "#/components/schemas/Money" }
        maxUses: { type: integer, minimum: 0, maximum: 1000000, default: 0, description: 总次数上限，0 不限 }
        maxUsesPerUser: { type: integer, minimum: 0, maximum: 1000, default: 1, description: 每人次数上限，0 不限 }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        isDisabled: { type: boolean }
        remark: { type: string, maxLength: 255 }
    Coupon:
      allOf:
        - $ref: "#/components/schemas/CouponInput"
        - type: object
          required: [id, usedCount, createdAt]
          properties:
            id: { type: integer, format: int64 }
            usedCount: { type: integer }
            createdAt: { type: string, format: date-time }
    CouponPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Coupon" } }
        total: { type: integer, format: int64 }
    TopupCodeStatus:
      type: string
      enum: [unused, used, disabled, expired]
    TopupCodeBatchInput:
      type: object
      required: [amount, count]
      properties:
        amount: { type: integer, format: int64, minimum: 1, maximum: 99999999, description: 面值（分） }
        count: { type: integer, minimum: 1, maximum: 500 }
        expiresAt: { type: [string, "null"], format: date-time }
        batch: { type: string, maxLength: 64, description: 批次备注 }
    TopupCodeBatch:
      type: object
      required: [amount, codes]
      properties:
        amount: { type: integer, format: int64 }
        codes: { type: array, items: { type: string }, description: 充值码明文（16 位）；只在生成时返回这一次（Ruling-31） }
    TopupCode:
      type: object
      required: [id, codeTail, amount, batch, status, expiresAt, isDisabled, usedByUsername, usedAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        codeTail: { type: string, description: 码的末 4 位 }
        amount: { type: integer, format: int64 }
        batch: { type: string }
        status: { $ref: "#/components/schemas/TopupCodeStatus" }
        expiresAt: { type: [string, "null"], format: date-time }
        isDisabled: { type: boolean }
        usedByUserId: { type: [integer, "null"], format: int64 }
        usedByUsername: { type: string, description: 未使用时为空串 }
        usedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    TopupCodePage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TopupCode" } }
        total: { type: integer, format: int64 }
    TopupCodeUpdateInput:
      type: object
      required: [isDisabled]
      properties:
        isDisabled: { type: boolean }
    TopupCodeSecret:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 充值码明文，前端默认不显示，点击才取 }
    OrderKind:
      type: string
      enum: [plan, traffic_pack, renew]
      description: renew = 到期时扣余额自动续费生成的订单
    Order:
      type: object
      required: [id, orderNo, kind, itemName, durationDays, trafficBytes, isTrial, amountOriginal, amountDiscount, amountPaid, couponCode, createdAt]
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string }
        kind: { $ref: "#/components/schemas/OrderKind" }
        itemName: { type: string, description: 下单时的套餐或流量包名称 }
        durationDays: { type: integer, description: 套餐的天数；流量包为 0 }
        trafficBytes: { type: integer, format: int64, description: 套餐的流量额度（0 不限）或流量包的字节数 }
        isTrial: { type: boolean }
        amountOriginal: { type: integer, format: int64 }
        amountDiscount: { type: integer, format: int64 }
        amountPaid: { type: integer, format: int64 }
        couponCode: { type: string, description: 没用优惠码为空串 }
        createdAt: { type: string, format: date-time }
        userId: { type: [integer, "null"], format: int64, description: 只在管理端返回；用户已删除为 null }
        username: { type: string, description: 只在管理端返回：下单时的用户名 }
    OrderPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
        total: { type: integer, format: int64 }
    OrderInput:
      type: object
      required: [kind]
      description: kind = plan 时给 planPriceId，kind = traffic_pack 时给 trafficPackId
      properties:
        kind: { type: string, enum: [plan, traffic_pack] }
        planPriceId: { type: integer, format: int64, minimum: 1 }
        trafficPackId: { type: integer, format: int64, minimum: 1 }
        couponCode: { type: string, maxLength: 32, description: 省略或空串 = 不用优惠码 }
    Quote:
      type: object
      required: [amountOriginal, amountDiscount, amountPayable, balance, shortfall, isRenewal, expiresAt, trafficLimit, couponCode]
      properties:
        amountOriginal: { type: integer, format: int64 }
        amountDiscount: { type: integer, format: int64 }
        amountPayable: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        shortfall: { type: integer, format: int64, description: 还差多少（分）；余额够时为 0 }
        isRenewal: { type: boolean, description: 买的是当前套餐（续费）；假 = 换购或流量包 }
        expiresAt: { type: [string, "null"], format: date-time, description: 下单后的到期时间 }
        trafficLimit: { type: integer, format: int64, description: 下单后的流量额度（字节，0 不限） }
        couponCode: { type: string, description: 已应用的优惠码，没有为空串 }
    LedgerKind:
      type: string
      enum: [topup_code, topup_online, purchase, renew, rebate, admin_adjust, forfeit]
    LedgerEntry:
      type: object
      required: [id, kind, amount, balanceAfter, remark, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/LedgerKind" }
        amount: { type: integer, format: int64, description: 带符号的变动金额（分） }
        balanceAfter: { type: integer, format: int64 }
        remark: { type: string }
        createdAt: { type: string, format: date-time }
        userId: { type: [integer, "null"], format: int64, description: 只在管理端返回 }
        username: { type: string, description: 只在管理端返回 }
        adminUsername: { type: string, description: 只在管理端返回：管理员调整时的操作人，其余为空串 }
    LedgerPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
        total: { type: integer, format: int64 }
    BalanceAdjustInput:
      type: object
      required: [amount, remark]
      properties:
        amount: { type: integer, format: int64, minimum: -9999999999, maximum: 9999999999, description: 带符号的调整金额（分），不能为 0 }
        remark: { type: string, minLength: 1, maxLength: 255 }
    PaymentStatus:
      type: string
      enum: [pending, paid, expired]
    Payment:
      type: object
      required: [id, tradeNo, gateway, amount, status, paidAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        tradeNo: { type: string }
        gateway: { type: string }
        amount: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        paidAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        userId: { type: [integer, "null"], format: int64 }
        username: { type: string }
    PaymentPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        total: { type: integer, format: int64 }
    PaymentCreateInput:
      type: object
      required: [gateway, amount]
      properties:
        gateway: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }
        amount: { type: integer, format: int64, minimum: 100, maximum: 99999999, description: 充值金额（分），最低 1 元 }
    PaymentCreated:
      type: object
      required: [tradeNo, payUrl, qrContent, expiresAt]
      properties:
        tradeNo: { type: string }
        payUrl: { type: string, description: 跳转支付的地址；该网关不提供时为空串 }
        qrContent: { type: string, description: 生成二维码用的内容；该网关不提供时为空串 }
        expiresAt: { type: string, format: date-time }
    Rebate:
      type: object
      required: [id, inviterUsername, inviteeUsername, orderNo, orderAmount, percent, amount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        inviterUsername: { type: string }
        inviteeUsername: { type: string }
        orderNo: { type: string }
        orderAmount: { type: integer, format: int64 }
        percent: { type: integer }
        amount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    RebatePage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Rebate" } }
        total: { type: integer, format: int64 }
    FinanceGranularity:
      type: string
      enum: [day, month]
      default: day
    FinanceStats:
      type: object
      required: [days, totals]
      properties:
        granularity: { $ref: "#/components/schemas/FinanceGranularity" }
        days:
          type: array
          description: 按平台时区的自然日（按月时为每月 1 日，代表整月），旧的在前；没有流水的日期也给 0
          items:
            type: object
            required: [date, topup, spend, rebate, orderCount]
            properties:
              date: { type: string, format: date }
              topup: { type: integer, format: int64, description: 充值码与在线充值入账合计 }
              spend: { type: integer, format: int64, description: 订单实付合计（含自动续费） }
              rebate: { type: integer, format: int64 }
              orderCount: { type: integer }
        totals:
          type: object
          required: [balance, topup, spend, rebate]
          properties:
            balance: { type: integer, format: int64, description: 当前全部用户余额之和 }
            topup: { type: integer, format: int64, description: 区间内合计 }
            spend: { type: integer, format: int64 }
            rebate: { type: integer, format: int64 }
    ImpersonateTicket:
      type: object
      required: [ticket, expiresAt, portalUrl]
      properties:
        ticket: { type: string, description: 一次性票据，60 秒内有效；属于凭据，不写日志 }
        expiresAt: { type: string, format: date-time }
        portalUrl: { type: string, description: 设置 site.portalUrl；空串 = 客户门户与管理端同源 }
    ImpersonateInput:
      type: object
      required: [ticket]
      properties:
        ticket: { type: string, minLength: 32, maxLength: 128 }
    ShopPlan:
      type: object
      required: [id, name, description, trafficLimit, trafficReset, limitIp, nodeCount, isTrial, isCurrent, canBuy, reason, prices]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, description: 卖点说明，纯文本，一行一条 }
        trafficLimit: { type: integer, format: int64, description: 字节，0 不限 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        limitIp: { type: integer }
        nodeCount: { type: integer, description: 该套餐当前可用的节点数 }
        isTrial: { type: boolean }
        isCurrent: { type: boolean, description: 是不是本人当前的套餐（买它即续费） }
        canBuy: { type: boolean }
        reason: { type: string, description: 不能买的原因，可以买时为空串 }
        prices: { type: array, items: { $ref: "#/components/schemas/PlanPrice" } }
    PublicPlan:
      type: object
      description: 落地页展示的在售套餐（0.4.3）；不含与访问者有关的字段
      required: [id, name, description, trafficLimit, trafficReset, limitIp, nodeCount, prices]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, description: 卖点说明，纯文本，一行一条 }
        trafficLimit: { type: integer, format: int64, description: 字节，0 不限 }
        trafficReset: { $ref: "#/components/schemas/TrafficReset" }
        limitIp: { type: integer }
        nodeCount: { type: integer }
        prices: { type: array, items: { $ref: "#/components/schemas/PlanPrice" } }
    AdminDashboard:
      type: object
      description: 管理端总览（0.4.3，docs/03 §5.20）；缺权限的区块为 null
      required: [users, traffic, servers, finance, tickets]
      properties:
        users:
          type: [object, "null"]
          required: [total, active, newToday, new7d, online]
          properties:
            total: { type: integer }
            active: { type: integer }
            newToday: { type: integer }
            new7d: { type: integer }
            online: { type: integer, description: 当前在线人数（各面板在线 client 去重到用户） }
        traffic:
          type: [object, "null"]
          required: [today, days]
          properties:
            today: { type: integer, format: int64, description: 今日流量（字节） }
            days:
              type: array
              description: 近 7 个自然日（含今天），旧的在前
              items:
                type: object
                required: [date, bytes]
                properties:
                  date: { type: string, format: date }
                  bytes: { type: integer, format: int64 }
        servers:
          type: [object, "null"]
          required: [total, online, nodeCount, offline]
          properties:
            total: { type: integer }
            online: { type: integer }
            nodeCount: { type: integer }
            offline:
              type: array
              maxItems: 10
              description: 启用中但不在线的服务器
              items:
                type: object
                required: [id, name, status, offlineSince]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
                  status: { type: string, enum: [unknown, online, offline, auth_failed] }
                  offlineSince: { type: [string, "null"], format: date-time }
        finance:
          type: [object, "null"]
          required: [todaySpend, todayTopup, monthSpend, monthTopup]
          properties:
            todaySpend: { type: integer, format: int64 }
            todayTopup: { type: integer, format: int64 }
            monthSpend: { type: integer, format: int64 }
            monthTopup: { type: integer, format: int64 }
        tickets:
          type: [object, "null"]
          required: [open]
          properties:
            open: { type: integer, description: 待回复（open）工单数 }
    ReachVerdict:
      type: string
      description: |
        大陆连通检测的结论（Ruling-67）：pending 还没测过；ok 大陆探测点全通；partial 大陆有通有不通；
        blocked 大陆全不通而境外通（被墙）；port_down 境内外都不通（端口没开，只对 tcp 目标）；unknown 探测点不够、接口出错或地址不是公网地址。
      enum: [pending, ok, partial, blocked, port_down, unknown]
    ReachScope:
      type: string
      description: port = 测的是 TCP 端口；ip = 只测了 ICMP（UDP 类入站），结论只说明 IP 层
      enum: [port, ip]
    NodeReach:
      type: object
      description: 节点所属目标的大陆连通结论（0.11.0）
      required: [verdict, scope, cnOk, cnTotal, checkedAt]
      properties:
        verdict: { $ref: "#/components/schemas/ReachVerdict" }
        scope: { $ref: "#/components/schemas/ReachScope" }
        cnOk: { type: integer, description: 连通的大陆探测点数 }
        cnTotal: { type: integer, description: 计入的大陆探测点数 }
        checkedAt: { type: [string, "null"], format: date-time }
    ReachProbe:
      type: object
      required: [isMainland, country, city, network, isOk, rttMs]
      properties:
        isMainland: { type: boolean, description: 真 = 大陆探测点，假 = 境外对照点 }
        country: { type: string, description: ISO 两位国家码 }
        city: { type: string }
        network: { type: string, description: 探测点所在网络（运营商或机房）的名称 }
        isOk: { type: boolean }
        rttMs: { type: [number, "null"], description: 平均往返时间（毫秒），不通为 null }
    NodeReachDetail:
      type: object
      required: [address, port, transport, verdict, scope, cnOk, cnTotal, controlOk, controlTotal, ipReachable, checkedAt, blockedSince, lastError, probes]
      properties:
        address: { type: string }
        port: { type: integer }
        transport: { type: string, enum: [tcp, udp] }
        verdict: { $ref: "#/components/schemas/ReachVerdict" }
        scope: { $ref: "#/components/schemas/ReachScope" }
        cnOk: { type: integer }
        cnTotal: { type: integer }
        controlOk: { type: integer, description: 连通的境外对照点数 }
        controlTotal: { type: integer }
        ipReachable: { type: [boolean, "null"], description: tcp 目标判为 blocked 时补测的大陆 ICMP 是否还通（真 = 只封了端口，假 = 封了 IP）；其余情形为 null }
        checkedAt: { type: [string, "null"], format: date-time }
        blockedSince: { type: [string, "null"], format: date-time, description: 这一轮连续 blocked 的起点 }
        lastError: { type: string, description: 上一次检测没出结论的原因，正常为空串 }
        probes:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ReachProbe" }
    NodeReachDetailEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/NodeReachDetail" }
    AnalyticsUsers:
      type: object
      description: 总览用户分区（0.11.0，docs/03 §5.20 总览分析）；都只算未注销的用户，自然日按 site.timezone
      required: [growth, activeDays, dau, wau, mau, status, expiry, plans, silentUsers, topUsers, subscription]
      properties:
        growth:
          type: array
          description: 窗口内每个自然日，旧的在前
          items:
            type: object
            required: [date, newUsers, totalUsers]
            properties:
              date: { type: string, format: date }
              newUsers: { type: integer }
              totalUsers: { type: integer, description: 截至当日的累计用户数 }
        activeDays:
          type: array
          description: 每日活跃（当日有流量）的用户数
          items:
            type: object
            required: [date, users]
            properties:
              date: { type: string, format: date }
              users: { type: integer }
        dau: { type: integer, description: 今日活跃用户数 }
        wau: { type: integer, description: 近 7 个自然日活跃的去重用户数 }
        mau: { type: integer, description: 近 30 个自然日活跃的去重用户数 }
        status:
          type: object
          required: [active, limited, expired, disabled]
          properties:
            active: { type: integer }
            limited: { type: integer }
            expired: { type: integer }
            disabled: { type: integer }
        expiry:
          type: object
          required: [expired, within7d, within30d, later, never, within7dNoAutoRenew]
          properties:
            expired: { type: integer }
            within7d: { type: integer }
            within30d: { type: integer, description: 8–30 日内到期 }
            later: { type: integer }
            never: { type: integer, description: 不过期（含等待首次使用） }
            within7dNoAutoRenew: { type: integer, description: 7 日内到期且没开自动续费 }
        plans:
          type: array
          items:
            type: object
            required: [planId, name, users, activeUsers]
            properties:
              planId: { type: [integer, "null"], format: int64, description: null = 没有套餐 }
              name: { type: string }
              users: { type: integer }
              activeUsers: { type: integer }
        silentUsers: { type: integer, description: active 且近 7 日没有流量（含从未使用） }
        topUsers:
          type: array
          maxItems: 10
          items:
            type: object
            required: [userId, username, planName, bytes]
            properties:
              userId: { type: integer, format: int64 }
              username: { type: string }
              planName: { type: string, description: 没有套餐为空串 }
              bytes: { type: integer, format: int64 }
        subscription:
          type: object
          description: 订阅拉取；只能看到订阅记录保留期内的数据
          required: [days, clients, formats]
          properties:
            days:
              type: array
              items:
                type: object
                required: [date, pulls, users]
                properties:
                  date: { type: string, format: date }
                  pulls: { type: integer }
                  users: { type: integer }
            clients:
              type: array
              items:
                type: object
                required: [client, pulls, users]
                properties:
                  client: { type: string, enum: [clash, singbox, v2rayn, v2rayng, shadowrocket, stash, quantumult, surge, loon, hiddify, nekobox, other] }
                  pulls: { type: integer }
                  users: { type: integer }
            formats:
              type: array
              items:
                type: object
                required: [format, pulls]
                properties:
                  format: { type: string }
                  pulls: { type: integer }
    AnalyticsTraffic:
      type: object
      description: 总览流量分区（0.11.0）
      required: [days, hours, servers]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, up, down]
            properties:
              date: { type: string, format: date }
              up: { type: integer, format: int64 }
              down: { type: integer, format: int64 }
        hours:
          type: array
          description: 一天 24 个小时各自的日均流量（按 site.timezone），固定 24 项
          minItems: 24
          maxItems: 24
          items:
            type: object
            required: [hour, bytes]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              bytes: { type: integer, format: int64 }
        servers:
          type: [array, "null"]
          description: 窗口内每台服务器的流量，按合计取前 20；没有 server:read 为 null。只有 0.11.0 上线之后的数据
          maxItems: 20
          items:
            type: object
            required: [serverId, name, up, down]
            properties:
              serverId: { type: integer, format: int64 }
              name: { type: string }
              up: { type: integer, format: int64 }
              down: { type: integer, format: int64 }
    AnalyticsServerLoad:
      type: object
      required: [serverId, name, cpu, onlineClients]
      properties:
        serverId: { type: integer, format: int64 }
        name: { type: string }
        cpu: { type: [number, "null"], description: CPU 占用百分比，面板没报为 null }
        onlineClients: { type: integer }
    ReachProblem:
      type: object
      description: 一个结论不是 ok 的检测目标
      required: [address, port, transport, verdict, scope, cnOk, cnTotal, ipReachable, checkedAt, blockedSince, servers, nodes, nodeCount]
      properties:
        address: { type: string }
        port: { type: integer }
        transport: { type: string, enum: [tcp, udp] }
        verdict: { $ref: "#/components/schemas/ReachVerdict" }
        scope: { $ref: "#/components/schemas/ReachScope" }
        cnOk: { type: integer }
        cnTotal: { type: integer }
        ipReachable: { type: [boolean, "null"] }
        checkedAt: { type: [string, "null"], format: date-time }
        blockedSince: { type: [string, "null"], format: date-time }
        servers: { type: array, maxItems: 5, items: { type: string }, description: 涉及的服务器名 }
        nodes: { type: array, maxItems: 5, items: { type: string }, description: 涉及的节点显示名（最多 5 个） }
        nodeCount: { type: integer }
    AnalyticsServers:
      type: object
      description: 总览服务器分区（0.11.0）
      required: [availability, online, topCpu, topOnline, reach]
      properties:
        availability:
          type: array
          description: 启用中的服务器近 7 日可用率，从低到高
          maxItems: 100
          items:
            type: object
            required: [serverId, name, percent, samples, expected]
            properties:
              serverId: { type: integer, format: int64 }
              name: { type: string }
              percent: { type: number, minimum: 0, maximum: 100, description: 保留一位小数 }
              samples: { type: integer, description: 有负载采样的 5 分钟时段数 }
              expected: { type: integer, description: 应有的时段数 }
        online:
          type: array
          description: 全站在线连接数（各服务器在线 client 数之和），按时间升序
          items:
            type: object
            required: [at, connections]
            properties:
              at: { type: string, format: date-time }
              connections: { type: integer }
        topCpu:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/AnalyticsServerLoad" }
        topOnline:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/AnalyticsServerLoad" }
        reach:
          type: [object, "null"]
          description: 大陆连通检测汇总（Ruling-67）；功能没开为 null
          required: [counts, problems]
          properties:
            counts:
              type: object
              required: [pending, ok, partial, blocked, portDown, unknown]
              properties:
                pending: { type: integer }
                ok: { type: integer }
                partial: { type: integer }
                blocked: { type: integer }
                portDown: { type: integer }
                unknown: { type: integer }
            problems:
              type: array
              description: 结论为 blocked / partial / port_down 的目标，被墙的在前
              maxItems: 20
              items: { $ref: "#/components/schemas/ReachProblem" }
    AnalyticsFinance:
      type: object
      description: 总览财务分区（0.11.0）；金额为整数分，按建单时间
      required: [days, orderKinds, trialCount, plans, funnel, payers, balanceTotal, payments, coupons]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, orderPaid, topup]
            properties:
              date: { type: string, format: date }
              orderPaid: { type: integer, format: int64 }
              topup: { type: integer, format: int64 }
        orderKinds:
          type: array
          description: 新购、续费、流量包，固定三项
          items:
            type: object
            required: [kind, count, paid]
            properties:
              kind: { type: string, enum: [plan, renew, traffic_pack] }
              count: { type: integer }
              paid: { type: integer, format: int64 }
        trialCount: { type: integer, description: 窗口内的试用单数 }
        plans:
          type: array
          maxItems: 10
          items:
            type: object
            required: [planId, name, count, paid]
            properties:
              planId: { type: [integer, "null"], format: int64, description: null = 套餐已删除（合并为一行） }
              name: { type: string }
              count: { type: integer }
              paid: { type: integer, format: int64 }
        funnel:
          type: object
          required: [registered, trial, paid]
          properties:
            registered: { type: integer, description: 窗口内注册的用户数 }
            trial: { type: integer, description: 其中下过试用单的 }
            paid: { type: integer, description: 其中有过实付 > 0 订单的 }
        payers:
          type: object
          required: [users, paid]
          properties:
            users: { type: integer, description: 窗口内实付 > 0 的去重用户数 }
            paid: { type: integer, format: int64 }
        balanceTotal: { type: integer, format: int64, description: 全站用户余额合计 }
        payments:
          type: object
          description: 窗口内建的充值单按状态计数
          required: [paid, expired, pending]
          properties:
            paid: { type: integer }
            expired: { type: integer }
            pending: { type: integer }
        coupons:
          type: array
          maxItems: 5
          items:
            type: object
            required: [code, count, discount, paid]
            properties:
              code: { type: string }
              count: { type: integer }
              discount: { type: integer, format: int64 }
              paid: { type: integer, format: int64 }
    AnalyticsBacklog:
      type: object
      description: 总览待处理分区（0.11.0）；缺权限的块为 null
      required: [tickets, provisions, panels, outbox]
      properties:
        tickets:
          type: [object, "null"]
          required: [open, oldestWaitingSince, avgFirstReplyMinutes]
          properties:
            open: { type: integer }
            oldestWaitingSince: { type: [string, "null"], format: date-time, description: 等得最久的待回复工单的最后回复时间 }
            avgFirstReplyMinutes: { type: [integer, "null"], description: 近 30 日新建且已有管理员回复的工单的平均首次回复时长 }
        provisions:
          type: [object, "null"]
          required: [failed, servers]
          properties:
            failed: { type: integer, description: 下发失败的 client 总数 }
            servers:
              type: array
              maxItems: 10
              items:
                type: object
                required: [serverId, name, failed]
                properties:
                  serverId: { type: integer, format: int64 }
                  name: { type: string }
                  failed: { type: integer }
        panels:
          type: [object, "null"]
          required: [chainFailed, driftInbounds, missingInbounds]
          properties:
            chainFailed:
              type: array
              maxItems: 10
              items:
                type: object
                required: [serverId, name, failCount, lastAttemptAt]
                properties:
                  serverId: { type: integer, format: int64 }
                  name: { type: string }
                  failCount: { type: integer }
                  lastAttemptAt: { type: [string, "null"], format: date-time }
            driftInbounds: { type: integer }
            missingInbounds: { type: integer }
        outbox:
          type: [object, "null"]
          required: [mailPending, mailFailed24h, telegramPending, telegramFailed24h]
          properties:
            mailPending: { type: integer }
            mailFailed24h: { type: integer }
            telegramPending: { type: integer }
            telegramFailed24h: { type: integer }
    ShopTrafficPack:
      type: object
      required: [id, name, trafficBytes, price]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        trafficBytes: { type: integer, format: int64 }
        price: { $ref: "#/components/schemas/Money" }
    Shop:
      type: object
      required: [balance, plans, trafficPacks, canBuyTrafficPack, trafficPackReason]
      properties:
        balance: { type: integer, format: int64 }
        plans: { type: array, items: { $ref: "#/components/schemas/ShopPlan" } }
        trafficPacks: { type: array, items: { $ref: "#/components/schemas/ShopTrafficPack" } }
        canBuyTrafficPack: { type: boolean }
        trafficPackReason: { type: string, description: 不能买流量包的原因，可以买时为空串 }
    Wallet:
      type: object
      required: [balance, autoRenew, gateways, rebateTotal]
      properties:
        balance: { type: integer, format: int64 }
        autoRenew:
          type: object
          required: [enabled, available, reason, planName, durationDays, price]
          properties:
            enabled: { type: boolean }
            available: { type: boolean, description: 现在能不能开启 }
            reason: { type: string, description: 不能开启的原因，可以开启时为空串 }
            planName: { type: string, description: 续费的套餐名，没有可续费的选项为空串 }
            durationDays: { type: integer, description: 每次续费的天数，没有为 0 }
            price: { type: [integer, "null"], format: int64, description: 该时长选项的当前售价；选项已不存在为 null }
        gateways:
          type: array
          description: 可用的在线充值方式；空 = 没有配置网关，只能用充值码
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
        rebateTotal: { type: integer, format: int64, description: 累计获得的邀请返利 }
    AutoRenewInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RedeemInput:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9 -]{16,24}$", description: 16 位充值码，可带分组用的空格或连字符 }
    RedeemResult:
      type: object
      required: [amount, balance]
      properties:
        amount: { type: integer, format: int64, description: 入账金额（分） }
        balance: { type: integer, format: int64, description: 入账后的余额 }
    ChainKind:
      type: string
      enum: [client, server]
      description: client = 客户端链式（只在订阅里表达），server = 服务端链式（改起飞面板的 Xray 配置）
    ChainStatus:
      type: string
      enum: [ok, blocked]
      description: ok = 通畅（配置与授权成立，平台不探测连通性，Ruling-38）；blocked = 阻断，不进订阅、不下发
    ChainBlockedReason:
      type: string
      enum: ["", plan, exit, unsafe, quarantined]
      description: |
        阻断原因，通畅时为空串。plan = 套餐不支持；exit = 落地当前不可用（节点不可用，平台出口未授权 / 停用 / 不允许该类型，我的出口被管理员停用）；
        unsafe = 我的出口没通过服务端链式的地址限制或字段校验（Ruling-48）；quarantined = 下发失败后被隔离，改规则或出口后解除（Ruling-49）
    ChainExitKind:
      type: string
      enum: [node, platform, own]
      description: node = 平台节点，platform = 平台出口（管理员添加），own = 我的出口（用户自己添加）
    ChainEntryState:
      type: string
      enum: [inactive, ok, unavailable, duplicate, shadowed, applied, pending, failed]
      description: |
        规则里每个起飞节点的状态（docs/03 §5.18、§5.19）。inactive = 规则阻断或停用；unavailable = 该节点当前不可用。
        客户端链式：ok = 进订阅，duplicate = 同一（起飞，落地）组合已在更靠前的规则里输出。
        服务端链式：shadowed = 被更靠前的规则覆盖（见 coveredBy），applied = 已在面板生效，pending = 下发中，failed = 该服务器最近一次下发被回滚。
    ChainNodeOption:
      type: object
      description: 可选的平台节点（本人当前可用）
      required: [id, name, region, protocol, canBeExit, canBeServerEntry]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        region: { type: string, description: 所在服务器的位置（ISO 两位国家码，空串为未知；Ruling-65） }
        protocol: { type: string }
        canBeExit: { type: boolean, description: 能否作落地；hysteria2 不能 }
        canBeServerEntry: { type: boolean, description: 能否作服务端链式的起飞节点：所在面板支持改内核配置 }
    ChainPlatformExitOption:
      type: object
      description: 本人可用的平台出口；地址与链接不返回
      required: [id, name, protocol, allowServer, allowClient]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        protocol: { type: string }
        allowServer: { type: boolean, description: 可用于服务端链式 }
        allowClient: { type: boolean, description: 可用于客户端链式 }
    ChainRouteEntry:
      type: object
      required: [nodeId, name, state, coveredBy]
      properties:
        nodeId: { type: integer, format: int64 }
        name: { type: string }
        state: { $ref: "#/components/schemas/ChainEntryState" }
        coveredBy: { type: integer, description: state 为 shadowed 或 duplicate 时，覆盖它的规则的序号（从 1 起）；否则为 0 }
    ChainRouteExit:
      type: object
      required: [kind, id, name, protocol]
      properties:
        kind: { $ref: "#/components/schemas/ChainExitKind" }
        id: { type: integer, format: int64, description: 平台节点 id 或出口 id，取决于 kind }
        name: { type: string }
        protocol: { type: string }
    ChainRoute:
      type: object
      required: [id, kind, position, name, displayName, entries, exit, isEnabled, status, blockedReason, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/ChainKind" }
        position: { type: integer, minimum: 1, description: 在本人同类型规则里的序号，从 1 起连续；越小越优先（Ruling-46） }
        name: { type: string, description: 用户起的名称，没起为空串 }
        displayName: { type: string, description: 显示用的名称；没起名称时为落地的名称 }
        entries: { type: array, items: { $ref: "#/components/schemas/ChainRouteEntry" } }
        exit: { $ref: "#/components/schemas/ChainRouteExit" }
        isEnabled: { type: boolean }
        status: { $ref: "#/components/schemas/ChainStatus" }
        blockedReason: { $ref: "#/components/schemas/ChainBlockedReason" }
        createdAt: { type: string, format: date-time }
    ChainRouteInput:
      type: object
      required: [kind, entryNodeIds, exitKind, exitId]
      properties:
        kind: { $ref: "#/components/schemas/ChainKind" }
        entryNodeIds:
          type: array
          description: 起飞节点不限个数（Ruling-87），1000 只是防超大请求的防御性上限
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        exitKind: { $ref: "#/components/schemas/ChainExitKind" }
        exitId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 64, description: 可选；省略或空串 = 用落地的名称 }
        isEnabled: { type: boolean, default: true }
    ChainRouteUpdateInput:
      type: object
      required: [entryNodeIds, exitKind, exitId, name, isEnabled]
      properties:
        entryNodeIds:
          type: array
          description: 起飞节点不限个数（Ruling-87），1000 只是防超大请求的防御性上限
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        exitKind: { $ref: "#/components/schemas/ChainExitKind" }
        exitId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 64 }
        isEnabled: { type: boolean }
    ChainRouteOrderInput:
      type: object
      required: [kind, ids]
      properties:
        kind: { $ref: "#/components/schemas/ChainKind" }
        ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
    ChainExit:
      type: object
      description: 我的出口（用户自己添加）；原链接属于凭据，不在这里返回
      required: [id, name, protocol, address, port, isEnabled, routeCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        protocol: { type: string, enum: [vless, vmess, trojan, shadowsocks, socks, http], description: "http = HTTP 或 HTTPS 代理（自 0.6.0）" }
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        isEnabled: { type: boolean, description: false = 已被管理员停用，引用它的规则阻断 }
        routeCount: { type: integer, description: 引用它的规则数；删除前据此提示 }
        createdAt: { type: string, format: date-time }
    ChainExitTestMode:
      type: string
      enum: [tcp, http, real]
      description: tcp = 只做 TCP 连接；http = 经出口发一次 HTTP 请求，报热连接的往返时间；real = 真实延迟，含建立隧道在内的整次请求耗时（Ruling-52）
    ChainExitTestFailReason:
      type: string
      enum: [none, refused, timeout, proxy_rejected, proxy_no_response, bad_status, unknown]
      description: |
        不通的原因大类（0.7.2，docs/03 §5.21，Ruling-56）；连通时为 none。
        refused = 出口拒绝连接；timeout = 连接出口超时；proxy_rejected = 端口能连上但代理请求被断开；
        proxy_no_response = 端口能连上但代理请求一直没有回应；bad_status = 请求发出去了但测试地址返回异常状态；unknown = 其他。
    ChainExitTestInput:
      type: object
      required: [nodeId, mode]
      properties:
        nodeId: { type: integer, format: int64, description: 起点节点（本人可用），由它所在服务器的面板发起测试 }
        mode: { $ref: "#/components/schemas/ChainExitTestMode" }
    ChainExitTestResult:
      type: object
      required: [ok, mode, reason, delayMs, httpStatus, egressIp, egressRegion]
      properties:
        ok: { type: boolean, description: 是否连通 }
        mode: { $ref: "#/components/schemas/ChainExitTestMode" }
        reason: { $ref: "#/components/schemas/ChainExitTestFailReason" }
        delayMs: { type: integer, format: int64, description: 延迟，毫秒；不通时为 0 }
        httpStatus: { type: integer, description: http / real 方式下测试请求的 HTTP 状态码；没有则为 0 }
        egressIp: { type: string, description: http 方式下探到的出口 IP；没有则为空串 }
        egressRegion: { type: string, description: 出口 IP 的国家或地区代码；没有则为空串 }
    AdminChainExitTestInput:
      type: object
      required: [serverId, mode]
      properties:
        serverId: { type: integer, format: int64, description: 发起测试的服务器 }
        mode: { $ref: "#/components/schemas/ChainExitTestMode" }
    AdminChainExitTestResult:
      allOf:
        - $ref: "#/components/schemas/ChainExitTestResult"
        - type: object
          required: [error]
          properties:
            error: { type: string, description: 面板返回的错误原文（已截断）；连通时为空串 }
    RealityScanInput:
      type: object
      required: [target]
      properties:
        target: { type: string, minLength: 1, maxLength: 255, description: "域名或 IP，可带端口（缺省 443），如 www.cloudflare.com:443" }
        sni: { type: string, maxLength: 255, description: 握手时用的 SNI；省略或空串 = 用目标的域名 }
        xver: { type: integer, minimum: 0, maximum: 2, description: 目标期望的 PROXY 协议版本，与入站的 Xver 一致；省略 = 0 }
    RealityTargetsInput:
      type: object
      properties:
        targets:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 255 }
          description: 省略或空数组 = 探测面板自己的候选站点
    RealityScanResult:
      type: object
      required: [target, host, port, ip, feasible, reason, latencyMs, tlsVersion, alpn, certValid, certSubject, certIssuer, serverNames, privateTarget]
      properties:
        target: { type: string, description: 归一化后的目标，域名或 IP 加端口 }
        host: { type: string }
        port: { type: integer }
        ip: { type: string, description: 实际探测的 IP；没有解析到为空串 }
        feasible: { type: boolean, description: 是否适合作 REALITY 目标（TLS 1.3 + h2 + X25519 + 可信证书） }
        reason: { type: string, description: 不可用的原因（面板给出的原文）；可用时为空串 }
        latencyMs: { type: integer, description: 握手耗时，毫秒 }
        tlsVersion: { type: string }
        alpn: { type: string }
        certValid: { type: boolean, description: 证书对这个 SNI 是否有效 }
        certSubject: { type: string }
        certIssuer: { type: string }
        serverNames: { type: array, items: { type: string }, description: 证书里可作 SNI 的域名；可能为空 }
        privateTarget: { type: boolean, description: 目标解析到内网 / 回环地址，没有探测 }
    ServerWebCert:
      type: object
      required: [certFile, keyFile]
      properties:
        certFile: { type: string, description: 证书文件在面板所在机器上的路径；没配为空串 }
        keyFile: { type: string, description: 私钥文件在面板所在机器上的路径；没配为空串 }
    ChainExitInput:
      type: object
      required: [link]
      properties:
        link: { type: string, minLength: 1, maxLength: 2048, description: "分享链接（vless / vmess / trojan / ss），或代理地址 socks5:// http:// https://[用户名:密码@]地址:端口（http / https 自 0.6.0）" }
        name: { type: string, maxLength: 64, description: 可选；省略或空串 = 取链接里的名称 }
    ChainExitUpdateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        link: { type: string, minLength: 1, maxLength: 2048, description: 省略 = 不改链接 }
    ChainOverview:
      type: object
      required: [allowed, exitAllowed, serverAllowed, maxClientRoutes, maxServerRoutes, maxRouteEntries, maxExits, clientRoutes, serverRoutes, exits, platformExits, nodes]
      properties:
        allowed: { type: boolean, description: 套餐是否允许客户端链式 }
        exitAllowed: { type: boolean, description: 套餐是否允许添加我的出口（allow_custom_node） }
        serverAllowed: { type: boolean, description: 套餐是否允许服务端链式 }
        maxClientRoutes: { type: integer }
        maxServerRoutes: { type: integer }
        maxRouteEntries: { type: integer, description: 一条规则起飞节点个数的防御性上限（Ruling-87，不是业务上限，实际不会超过本人可用节点数） }
        maxExits: { type: integer }
        clientRoutes: { type: array, items: { $ref: "#/components/schemas/ChainRoute" }, description: 按顺序 }
        serverRoutes: { type: array, items: { $ref: "#/components/schemas/ChainRoute" }, description: 按顺序 }
        exits: { type: array, items: { $ref: "#/components/schemas/ChainExit" } }
        platformExits: { type: array, items: { $ref: "#/components/schemas/ChainPlatformExitOption" } }
        nodes: { type: array, items: { $ref: "#/components/schemas/ChainNodeOption" } }
    ChainApplyStatus:
      type: string
      enum: [none, pending, applied, failed]
      description: 起飞服务器的下发状态（docs/03 §3 C1–C5）；none = 从未有过服务端规则
    ChainApply:
      type: object
      required: [serverId, isSupported, status, ruleCount, appliedRuleCount, failCount, isRetryStopped, lastError, lastAttemptAt, nextAttemptAt, appliedAt]
      properties:
        serverId: { type: integer, format: int64 }
        isSupported: { type: boolean, description: 面板是否支持改内核配置；不支持时不会有服务端规则以它为起飞 }
        status: { $ref: "#/components/schemas/ChainApplyStatus" }
        ruleCount: { type: integer, description: 期望在这台服务器上生效的规则数 }
        appliedRuleCount: { type: integer, description: 当前面板上生效的规则数 }
        failCount: { type: integer, description: 同一期望的连续失败次数 }
        isRetryStopped: { type: boolean, description: 失败次数已达上限，停止自动重试，等期望变化或手动重试 }
        lastError: { type: string, description: 脱敏后的最近错误，没有为空串 }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        nextAttemptAt: { type: [string, "null"], format: date-time, description: 失败退避到这个时刻 }
        appliedAt: { type: [string, "null"], format: date-time }
    AdminChainRouteEntry:
      type: object
      required: [nodeId, name, serverId, serverName, state, coveredBy]
      properties:
        nodeId: { type: integer, format: int64 }
        name: { type: string }
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        state: { $ref: "#/components/schemas/ChainEntryState" }
        coveredBy: { type: integer }
    AdminChainRoute:
      type: object
      required: [id, user, kind, position, name, entries, exit, isEnabled, status, blockedReason, createdAt]
      properties:
        id: { type: integer, format: int64 }
        user:
          type: object
          required: [id, username]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
        kind: { $ref: "#/components/schemas/ChainKind" }
        position: { type: integer, minimum: 1 }
        name: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/AdminChainRouteEntry" } }
        exit: { $ref: "#/components/schemas/ChainRouteExit" }
        isEnabled: { type: boolean }
        status: { $ref: "#/components/schemas/ChainStatus" }
        blockedReason: { $ref: "#/components/schemas/ChainBlockedReason" }
        createdAt: { type: string, format: date-time }
    AdminChainRoutePage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminChainRoute" } }
        total: { type: integer, format: int64 }
    ChainExitOwner:
      type: string
      enum: [platform, user]
      description: platform = 平台出口（管理员添加），user = 用户出口
    AdminChainExit:
      type: object
      description: 管理端看到的出口；原链接不在这里返回，用户出口的链接管理员始终不能查看（Ruling-50）
      required: [id, owner, user, name, protocol, address, port, remark, isEnabled, allowServer, allowClient, assignMode, nodeGroups, users, routeCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        owner: { $ref: "#/components/schemas/ChainExitOwner" }
        user:
          type: [object, "null"]
          description: 用户出口的所有者；平台出口为 null
          required: [id, username]
          properties:
            id: { type: integer, format: int64 }
            username: { type: string }
        name: { type: string }
        protocol: { type: string, enum: [vless, vmess, trojan, shadowsocks, socks, http], description: "http = HTTP 或 HTTPS 代理（自 0.6.0）" }
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        remark: { type: string }
        isEnabled: { type: boolean }
        allowServer: { type: boolean, description: 可用于服务端链式；只对平台出口有意义 }
        allowClient: { type: boolean, description: 可用于客户端链式（凭据会进用户的订阅）；只对平台出口有意义 }
        assignMode: { $ref: "#/components/schemas/ChainExitAssignMode" }
        nodeGroups:
          type: array
          description: 平台出口所属的节点组（assignMode = group 时）；其余为空数组
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        users:
          type: array
          description: 平台出口指定的用户（assignMode = user 时，自 0.9.0）；其余为空数组
          items:
            type: object
            required: [id, username]
            properties:
              id: { type: integer, format: int64 }
              username: { type: string }
        routeCount: { type: integer, description: 引用它的规则数 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChainExitAssignMode:
      type: string
      enum: [group, user]
      description: 平台出口的分配方式（自 0.9.0，Ruling-64）：group = 按节点组，user = 指定用户；用户出口恒为 group，无意义
    AdminChainExitPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminChainExit" } }
        total: { type: integer, format: int64 }
    AdminChainExitInput:
      type: object
      required: [name, link, allowServer, allowClient, nodeGroupIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        link: { type: string, minLength: 1, maxLength: 2048, description: "分享链接（vless / vmess / trojan / ss），或代理地址 socks5:// http:// https://[用户名:密码@]地址:端口（http / https 自 0.6.0）" }
        remark: { type: string, maxLength: 255, default: "" }
        isEnabled: { type: boolean, default: true }
        allowServer: { type: boolean }
        allowClient: { type: boolean }
        nodeGroupIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        assignMode:
          allOf: [{ $ref: "#/components/schemas/ChainExitAssignMode" }]
          default: group
          description: 省略 = group（兼容 0.8 的调用方）；保存时只保留所选方式那一组
        userIds:
          type: array
          maxItems: 500
          uniqueItems: true
          default: []
          description: assignMode = user 时的用户（自 0.9.0）；须是未注销的用户
          items: { type: integer, format: int64, minimum: 1 }
    AdminChainExitUpdateInput:
      type: object
      required: [name, remark, isEnabled, allowServer, allowClient, nodeGroupIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        link: { type: string, minLength: 1, maxLength: 2048, description: 省略 = 不改链接 }
        remark: { type: string, maxLength: 255 }
        isEnabled: { type: boolean }
        allowServer: { type: boolean }
        allowClient: { type: boolean }
        nodeGroupIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        assignMode:
          allOf: [{ $ref: "#/components/schemas/ChainExitAssignMode" }]
          default: group
          description: 省略 = group（兼容 0.8 的调用方）；保存时只保留所选方式那一组
        userIds:
          type: array
          maxItems: 500
          uniqueItems: true
          default: []
          description: assignMode = user 时的用户（自 0.9.0）；须是未注销的用户
          items: { type: integer, format: int64, minimum: 1 }
    ChainExitEnabledInput:
      type: object
      required: [isEnabled]
      properties:
        isEnabled: { type: boolean }
