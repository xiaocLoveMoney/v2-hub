openapi: 3.1.0
info:
  title: v2-hub API
  version: 0.2.7
  description: |
    v2-hub 对外接口契约（hub-server 提供，v2-hub-admin-web / v2-hub-user-web 消费）。
    - 管理端接口前缀 /api/admin，客户端接口前缀 /api/user，订阅端点前缀 /sub。
    - 会话用 HttpOnly + SameSite=Lax Cookie；非 GET/HEAD 请求必须带 X-CSRF-Token（docs/03 §4.2）。
    - 业务接口统一响应信封 Envelope；错误码表见 docs/03 §5。授权规则 R1–R7 见 docs/03 §4.1。
    版本纪律：additive 变更升修订号，破坏性变更升次版本号并在同一 PR 改引用方。
    0.2.0：新增管理员认证、管理员 / 角色 / 权限、审计日志接口。
    0.2.2：M1 服务器接入、入站增删改查、Host 端点、节点目录与节点组；错误响应 UpstreamUnavailable（502）。
    0.2.1：两步验证（docs/03 §4.3）——登录可带 totpCode，新增 totp_required 错误码与 TOTP 开启 / 关闭 / 重置接口。
    0.2.3：删除对外地址只删所点的那一个；对“面板上已不存在”的入站做编辑 / 启停 / 确认漂移 / 添加对外地址返回 409（docs/03 §5.1）。
    0.2.4：入站表单与 3x-ui 同构（Ruling-16）——新增读取面板完整入站配置、代理面板生成密钥两个接口。
    0.2.5：M2 套餐与用户（docs/03 §5.2）——套餐增删改查、用户增删改查、分配 / 续费套餐、直接改用量与额度、重置口令、下发状态与手动对账。
    0.2.6：M3 客户后台与订阅（docs/03 §5.3–§5.5）——终端用户登录 / 两步验证 / 改口令、仪表盘、用量、节点、订阅地址与重置、
      登录记录、订阅记录、订阅端点 /sub/{token}；管理端新增重置用户订阅、清除用户两步验证、订阅记录；新增错误码 account_disabled。
    0.2.7：管理员建用户、重置用户口令的口令长度放宽为 8–128（docs/03 §5.3，原误用管理员的 12 位下限）；xray 格式的订阅说明改为每节点一份完整配置。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: system
    description: 探活与系统信息
  - name: admin-auth
    description: 管理员登录、登出、当前会话
  - name: admin-rbac
    description: 管理员、角色、权限码（需 admin:read / admin:write）
  - name: admin-audit
    description: 审计日志（需 audit:read）
  - name: admin-panel
    description: 服务器（server:*）、入站与节点（node:*），docs/03 §5.1
  - name: admin-users
    description: 套餐（plan:*）与用户（user:*），docs/03 §5.2
  - name: user-auth
    description: 终端用户登录、登出、当前会话、口令与两步验证（docs/03 §5.3）
  - name: user-portal
    description: 客户后台数据：仪表盘、用量、节点、订阅地址、登录与订阅记录（docs/03 §5.4、§5.5）；身份只取自会话（R8）
  - name: subscription
    description: 订阅端点，供代理客户端直接拉取，凭 token 访问（docs/03 §5.4）
security:
  - adminSession: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: 存活探针（只说明进程在跑，不探测依赖）
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: 就绪探针（数据库可达才返回 200；失败原因只写服务端日志）
      security: []
      responses:
        "200":
          description: 依赖就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: 用户名口令登录，成功后 Set-Cookie hub_admin_session
      description: 失败一律 401“用户名或密码错误”；触发频控返回 429（docs/03 §4.2）。本接口不需要 CSRF 头。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401":
          description: unauthenticated（用户名或口令错误）或 totp_required（需再提交验证码）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: 登出并删除当前会话
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/auth/me:
    get:
      tags: [admin-auth]
      operationId: adminMe
      summary: 当前管理员、有效权限码与 CSRF token（前端据此渲染菜单）
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/admin/auth/totp/setup:
    post:
      tags: [admin-auth]
      operationId: adminTotpSetup
      summary: 生成待确认的 TOTP 密钥，返回 otpauth 地址与 Base32 密钥（只返回这一次）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 待确认的密钥
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/auth/totp/enable:
    post:
      tags: [admin-auth]
      operationId: adminTotpEnable
      summary: 提交验证码确认并开启两步验证
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/totp/disable:
    post:
      tags: [admin-auth]
      operationId: adminTotpDisable
      summary: 提交当前验证码关闭两步验证
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/admin/permissions:
    get:
      tags: [admin-rbac]
      operationId: listPermissions
      summary: 全部权限码（admin:read）
      responses:
        "200":
          description: 权限码列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Permission" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/roles:
    get:
      tags: [admin-rbac]
      operationId: listRoles
      summary: 全部角色及其权限码（admin:read）
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-rbac]
      operationId: createRole
      summary: 新建角色（admin:write；权限须为操作者子集，R2）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 新建的角色
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: updateRole
      summary: 修改角色名称与权限码（admin:write；内置角色不可改，R2、R6）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 修改后的角色
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin-rbac]
      operationId: deleteRole
      summary: 删除角色（admin:write；内置或被引用的角色不可删，R6）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins:
    get:
      tags: [admin-rbac]
      operationId: listAdmins
      summary: 分页列出管理员（admin:read）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 管理员分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Admin" }
                          total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-rbac]
      operationId: createAdmin
      summary: 新建管理员（admin:write；只能分配权限为自己子集的角色，R3）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateInput" }
      responses:
        "200":
          description: 新建的管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: updateAdmin
      summary: 修改管理员角色与禁用状态（admin:write；R3、R4、R5、R7）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateInput" }
      responses:
        "200":
          description: 修改后的管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}/password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: resetAdminPassword
      summary: 重置管理员口令（admin:write；对方全部会话失效，R7）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/admins/{id}/totp:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [admin-rbac]
      operationId: resetAdminTotp
      summary: 清除他人的两步验证（遗失设备时；admin:write，R3、R4；对方全部会话失效）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/audit-logs:
    get:
      tags: [admin-audit]
      operationId: listAuditLogs
      summary: 分页列出审计日志，按时间倒序（audit:read）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审计日志分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/AuditLog" }
                          total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }

  /api/admin/servers:
    get:
      tags: [admin-panel]
      operationId: listServers
      summary: 全部服务器及其连接状态（server:read）
      responses:
        "200":
          description: 服务器列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-panel]
      operationId: createServer
      summary: 接入一台面板（server:write）；保存前先探测，探测失败不保存
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerInput" }
      responses:
        "200":
          description: 新接入的服务器（已完成一次同步）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/test:
    post:
      tags: [admin-panel]
      operationId: testServer
      summary: 用未保存的接入信息探测面板（server:write），返回面板版本等信息
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerConnInput" }
      responses:
        "200":
          description: 探测成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PanelInfo" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/cert-fingerprint:
    post:
      tags: [admin-panel]
      operationId: serverCertFingerprint
      summary: 不校验证书地连接 https 面板，返回叶子证书 SHA-256（Base64），供 tlsMode=pin 使用（server:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl]
              properties:
                baseUrl: { $ref: "#/components/schemas/PanelBaseUrl" }
      responses:
        "200":
          description: 证书指纹
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sha256]
                        properties:
                          sha256: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-panel]
      operationId: getServer
      summary: 服务器详情（server:read）
      responses:
        "200":
          description: 服务器
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin-panel]
      operationId: updateServer
      summary: 修改服务器（server:write）；apiToken 留空表示沿用原值；连接信息变化时先探测
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerInput" }
      responses:
        "200":
          description: 修改后的服务器
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      tags: [admin-panel]
      operationId: deleteServer
      summary: 移除服务器及其入站、节点的平台记录（server:write）；不改动面板本身
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/servers/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-panel]
      operationId: syncServer
