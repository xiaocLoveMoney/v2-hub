openapi: 3.1.0
info:
  title: v2-hub API
  version: 0.18.0
  description: |
    v2-hub 对外接口契约（hub-server 提供，v2-hub-admin-web / v2-hub-user-web 消费）。
    - 管理端接口前缀 /api/admin，客户端接口前缀 /api/user，订阅端点前缀 /sub。
    - 会话用 HttpOnly + SameSite=Lax Cookie；非 GET/HEAD 请求必须带 X-CSRF-Token（docs/03 §4.2）。
    - 业务接口统一响应信封 Envelope；错误码表见 docs/03 §5。授权规则 R1–R7 见 docs/03 §4.1。
    版本纪律：additive 变更升修订号，破坏性变更升次版本号并在同一 PR 改引用方。
    0.2.0：新增管理员认证、管理员 / 角色 / 权限、审计日志接口。
    0.2.2：M1 服务器接入、入站增删改查、Host 端点、节点目录与节点组；错误响应 UpstreamUnavailable（502）。
    0.2.1：两步验证（docs/03 §4.3）——登录可带 totpCode，新增 totp_required 错误码与 TOTP 开启 / 关闭 / 重置接口。
    0.2.3：删除对外地址只删所点的那一个；对“面板上已不存在”的入站做编辑 / 启停 / 确认漂移 / 添加对外地址返回 409（docs/03 §5.1）。
    0.2.4：入站表单与 3x-ui 同构（Ruling-16）——新增读取面板完整入站配置、代理面板生成密钥两个接口。
    0.2.5：M2 套餐与用户（docs/03 §5.2）——套餐增删改查、用户增删改查、分配 / 续费套餐、直接改用量与额度、重置密码、下发状态与手动对账。
    0.2.6：M3 客户后台与订阅（docs/03 §5.3–§5.5）——终端用户登录 / 两步验证 / 改密码、仪表盘、用量、节点、订阅地址与重置、
      登录记录、订阅记录、订阅端点 /sub/{token}；管理端新增重置用户订阅、清除用户两步验证、订阅记录；新增错误码 account_disabled。
    0.2.7：管理员建用户、重置用户密码的密码长度放宽为 8–128（docs/03 §5.3，原误用管理员的 12 位下限）；xray 格式的订阅说明改为每节点一份完整配置。
    0.4.1：M6 客户端链式（docs/03 §5.18）——链式规则与自有落地节点接口；会话信息带套餐的链式开关。
    0.5.0：M9 链式改造（docs/03 §5.18、§5.19、§5.21）——规则改为有序的“起飞节点（多选）→ 落地（单选）”（chain/routes），
      自有落地节点改名为出口（chain/exits），新增平台出口与管理端的出口、规则接口；删除 chain/rules、chain/server-rules、admin/server-chain-rules。
    0.7.1：系统设置增加 routing 分组（routing.blockRule，平台拦截规则，Ruling-55）。
    0.7.2：出口延迟测试结果增加 reason（不通的原因大类，Ruling-56）。
    0.7.3：侧栏菜单顺序（Ruling-57）——系统设置增加 menu 分组（menu.admin、menu.user），管理员会话信息与公开站点信息带 menuOrder。
    0.8.0：订阅地址的路径前缀改为全站随机串（Ruling-59），端点由 /sub/{token} 改为 /{subPath}/{token}，系统设置 subscription 增加 path、pathGraceDays 与只读的 oldPath、oldPathUntil；
      用户自设连接密码（Ruling-58）——新增 PUT /api/user/subscription/password，订阅信息带 hasCustomPassword。
    0.11.0：总览分析（Ruling-66）——新增 /api/admin/analytics/{users,traffic,servers,finance,backlog}；
      大陆连通检测（Ruling-67）——节点带 reach、服务器带 reach 汇总，新增 /api/admin/nodes/{id}/reach 与 /reach/check，系统设置增加 reach 分组。
    0.12.0：SSH 托管与面板部署（docs/03 §5.22，Ruling-68 – Ruling-71）——新增 SSH 凭据、托管主机、主机任务与动作接口（权限码 host:read / host:write），
      给已接入的服务器绑定 SSH（PUT /api/admin/servers/{id}/host），服务器带 hostId。
    0.14.1：节点显示名的前缀 / 后缀（Ruling-80）——一键部署参数加 namePrefix / nameSuffix，新增 POST /api/admin/nodes/affix。
    0.16.0：服务器状态卡片（Ruling-83 – Ruling-86）——服务器的 statusSnapshot 换成类型化的 resources，另带 publicIpv4 / publicIpv6、onlineClients、
      billing、traffic、host；连接测试结果的 status 同样换成 resources；新增 PUT /api/admin/servers/{id}/billing、GET /api/admin/servers/{id}/metrics、
      GET /api/admin/servers/trends；系统设置增加 latency 分组。
    0.16.2：公告与教程的图片上传（Ruling-89）——新增 POST /api/admin/uploads（multipart，content:write），返回站内路径 /uploads/…。
    0.17.0：管理员分级加固（Ruling-95 – Ruling-100）——新增 PUT /api/admin/auth/password（本人改密码）、POST /api/admin/auth/reauth（二次验证）；
      Session 加 isSuperAdmin、isOwner、totpSetupRequired，Admin 加 isOwner，Permission 加 superOnly；admin:* 与 host:* 改为超管专属；
      主机批量新建 / 测试 / 修改 / 绑定 SSH / 重置主机密钥加只写的 credentialSecret；修改服务器时面板类型或地址有变化须重新提交 apiToken；
      新增错误码 reauth_required、totp_setup_required（均 403）与可复用响应 ReauthRequired。
    0.18.0：二级代理（docs/03 §5.23，Ruling-101 – Ruling-104）——Session 加 kind；新增超管侧代理管理 /api/admin/agents*、用户划转 PUT /api/admin/users/{id}/agent，
      User 加 agent、用户列表加 agentId 筛选，InviteCode 的 kind 加 agent 并带 agentId / agentUsername；新增代理专用接口 /api/admin/agent/*（tag agent）；
      新增错误码 agent_pool_insufficient、agent_user_limit（均 409）与可复用响应 AgentQuotaConflict。
      隔离（Ruling-101）：代理账号调用 admin-auth 以外的现有管理端接口一律 403 permission_denied，只有 admin-auth 下的本人接口与 /api/admin/agent/* 可用；
      员工调用 /api/admin/agent/* 同样 403 permission_denied；代理按 id 访问不在名下的对象一律 404 not_found。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: system
    description: 探活与系统信息
  - name: admin-auth
    description: 管理员登录、登出、当前会话；员工与代理共用（代理只能用本组接口与 tag agent 的接口，Ruling-101）
  - name: admin-rbac
    description: 管理员、角色、权限码（需 admin:read / admin:write，超管专属，Ruling-95）
  - name: admin-agents
    description: 二级代理的管理与用户划转（读 admin:read、写 admin:write，超管专属；写操作须二次验证），docs/03 §5.23
  - name: agent
    description: |
      代理专用接口（docs/03 §5.23，Ruling-101）：只接受代理会话，员工调用 403 permission_denied；不看权限码。
      每个查询都限定在当前代理名下，身份只取自会话；按 id 访问不在名下的用户、工单、邀请码一律 404 not_found。
      写操作带 X-CSRF-Token，合计每小时最多 120 次（agent.writeRatePerHour），超出 429 rate_limited。
  - name: admin-audit
    description: 审计日志（需 audit:read）
  - name: admin-panel
    description: 服务器（server:*）、入站与节点（node:*），docs/03 §5.1
  - name: admin-hosts
    description: SSH 凭据、托管主机、部署与运维任务（host:*，超管专属，Ruling-95），docs/03 §5.22
  - name: admin-users
    description: 套餐（plan:*）与用户（user:*），docs/03 §5.2
  - name: admin-settings
    description: 系统设置、发件箱与 Telegram 测试（setting:*），docs/03 §5.6、§5.7、§5.20
  - name: admin-dashboard
    description: 管理端总览，各区块按权限码出现（docs/03 §5.20，0.4.3）
  - name: admin-content
    description: 公告、教程与共享账号（content:*），docs/03 §5.9
  - name: admin-tickets
    description: 工单（ticket:*），docs/03 §5.10
  - name: admin-shop
    description: 流量包与优惠码（shop:*）；套餐的时长选项与上架随套餐接口（docs/03 §5.12、§5.15）
  - name: admin-finance
    description: 充值码、订单、余额流水、充值单、返利与收支统计（finance:*），docs/03 §5.13–§5.16
  - name: user-auth
    description: 终端用户登录、登出、当前会话、密码与两步验证（docs/03 §5.3）
  - name: user-account
    description: 账号自助：邮箱绑定、注销、邀请码（docs/03 §5.8）
  - name: user-portal
    description: 客户后台数据：仪表盘、用量、节点、订阅地址、登录与订阅记录（docs/03 §5.4、§5.5）；身份只取自会话（R8）
  - name: user-shop
    description: 商店、下单、钱包与充值（docs/03 §5.12–§5.16）；身份只取自会话（R8）
  - name: user-chain
    description: 链式代理：有序的链式规则（客户端 §5.18、服务端 §5.19）与我的出口（§5.21）；身份只取自会话（R8）
  - name: payment
    description: 支付网关回调（docs/03 §5.15）
  - name: subscription
    description: 订阅端点，供代理客户端直接拉取，凭 token 访问（docs/03 §5.4）
security:
  - adminSession: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: 存活探针（只说明进程在跑，不探测依赖）
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: 就绪探针（数据库可达才返回 200；失败原因只写服务端日志）
      security: []
      responses:
        "200":
          description: 依赖就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: 用户名密码登录，成功后 Set-Cookie hub_admin_session
      description: 失败一律 401“用户名或密码错误”；触发频控返回 429（docs/03 §4.2）。本接口不需要 CSRF 头。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401":
          description: unauthenticated（用户名或密码错误）或 totp_required（需再提交验证码）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: 登出并删除当前会话
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/auth/me:
    get:
      tags: [admin-auth]
      operationId: adminMe
      summary: 当前管理员、有效权限码与 CSRF token（前端据此渲染菜单）
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/admin/auth/totp/setup:
    post:
      tags: [admin-auth]
      operationId: adminTotpSetup
      summary: 生成待确认的 TOTP 密钥，返回 otpauth 地址与 Base32 密钥（只返回这一次）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 待确认的密钥
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/auth/totp/enable:
    post:
      tags: [admin-auth]
      operationId: adminTotpEnable
      summary: 提交验证码确认并开启两步验证
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/totp/disable:
    post:
      tags: [admin-auth]
      operationId: adminTotpDisable
      summary: 提交当前验证码关闭两步验证（超管 409，Ruling-98）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/password:
    put:
      tags: [admin-auth]
      operationId: adminChangePassword
      summary: 修改自己的密码（任何已登录管理员；须提交旧密码，Ruling-96）
      description: |
        旧密码错误返回 400 并计入频控；成功后当前会话保留、本人其余会话全部失效。
        超管未开启两步验证时本接口仍可用（Ruling-98 豁免）。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPasswordChangeInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/auth/reauth:
    post:
      tags: [admin-auth]
      operationId: adminReauth
      summary: 高危操作前重新验证身份（任何已登录管理员，Ruling-100）
      description: |
        已开启两步验证的账号必须给 totpCode，否则给 password；成功后 reauthUntil 之前高危接口不再返回 reauth_required。
        验证失败返回 400 invalid_argument（不用 401，以免前端当成会话失效），计入频控并写审计。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReauthInput" }
      responses:
        "200":
          description: 验证通过
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminReauthResult" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/admin/dashboard:
    get:
      tags: [admin-dashboard]
      operationId: getAdminDashboard
      summary: 管理端总览（任何已登录管理员；docs/03 §5.20，0.4.3）
      description: 缺对应权限码的区块为 null：users、traffic 要 user:read，servers 要 server:read，finance 要 finance:read，tickets 要 ticket:read。
      responses:
        "200":
          description: 总览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/analytics/users:
    get:
      tags: [admin-dashboard]
      operationId: getAnalyticsUsers
      summary: 总览的用户分区（user:read；docs/03 §5.20 总览分析，Ruling-66，0.11.0）
      parameters:
        - $ref: "#/components/parameters/AnalyticsDays"
      responses:
        "200":
          description: 用户分析
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsUsers" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/analytics/traffic:
    get:
      tags: [admin-dashboard]
      operationId: getAnalyticsTraffic
      summary: 总览的流量分区（user:read；按服务器那一块另需 server:read，没有则为 null；0.11.0）
      parameters:
        - $ref: "#/components/parameters/AnalyticsDays"
      responses:
        "200":
          description: 流量分析
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsTraffic" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/analytics/servers:
    get:
      tags: [admin-dashboard]
      operationId: getAnalyticsServers
      summary: 总览的服务器分区（server:read；0.11.0）
      description: 可用率与负载排行固定看近 7 日 / 最近 15 分钟；range 只影响在线连接数曲线（24h 为 5 分钟原值，7d 按小时平均）。
      parameters:
        - name: range
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MetricRange" }
      responses:
        "200":
          description: 服务器分析
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsServers" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/analytics/finance:
    get:
      tags: [admin-dashboard]
      operationId: getAnalyticsFinance
      summary: 总览的财务分区（finance:read；0.11.0）
      parameters:
        - $ref: "#/components/parameters/AnalyticsDays"
      responses:
        "200":
          description: 财务分析
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsFinance" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/analytics/backlog:
    get:
      tags: [admin-dashboard]
      operationId: getAnalyticsBacklog
      summary: 总览的待处理分区（任何已登录管理员；0.11.0）
      description: 缺对应权限码的块为 null：tickets 要 ticket:read，provisions 要 user:read，panels 要 server:read，outbox 要 setting:read。
      responses:
        "200":
          description: 待处理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsBacklog" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/permissions:
    get:
      tags: [admin-rbac]
      operationId: listPermissions
      summary: 全部权限码（admin:read）
      responses:
        "200":
          description: 权限码列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Permission" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/roles:
    get:
      tags: [admin-rbac]
      operationId: listRoles
      summary: 全部角色及其权限码（admin:read）
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-rbac]
      operationId: createRole
      summary: 新建角色（admin:write；权限码含超管专属码时 400，Ruling-95）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 新建的角色
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: updateRole
      summary: 修改角色名称与权限码（admin:write；权限码含超管专属码时 400；内置角色含四个预设均不可改，R6、Ruling-95）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 修改后的角色
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin-rbac]
      operationId: deleteRole
      summary: 删除角色（admin:write；内置角色含四个预设、或被引用的角色不可删，R6、Ruling-95）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins:
    get:
      tags: [admin-rbac]
      operationId: listAdmins
      summary: 分页列出管理员（admin:read）；只含员工，不含代理（代理见 /api/admin/agents，Ruling-101）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 管理员分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Admin" }
                          total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-rbac]
      operationId: createAdmin
      summary: 新建管理员（admin:write，超管专属，Ruling-95）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateInput" }
      responses:
        "200":
          description: 新建的管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: updateAdmin
      summary: 修改管理员角色与禁用状态（admin:write；R4、R5、R7；目标是所有者时 403，Ruling-99）
      description: 目标是代理账号时 409 conflict，改用 `PUT /api/admin/agents/{id}`（代理不能持有角色，Ruling-101）。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateInput" }
      responses:
        "200":
          description: 修改后的管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}/password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin-rbac]
      operationId: resetAdminPassword
      summary: 重置管理员密码（admin:write；对方全部会话失效，R7）
      description: |
        对自己 409，改自己的密码用 `PUT /api/admin/auth/password`（Ruling-96）；目标是所有者时 403（Ruling-99）。
        目标是代理账号时照常可用（docs/03 §5.23）。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/admins/{id}/totp:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [admin-rbac]
      operationId: resetAdminTotp
      summary: 清除他人的两步验证（遗失设备时；admin:write，R4；对方全部会话失效；目标是所有者时 403，Ruling-99）
      description: 目标是代理账号时照常可用（docs/03 §5.23）。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/agents:
    get:
      tags: [admin-agents]
      operationId: listAgents
      summary: 代理分页，按创建时间倒序（admin:read，docs/03 §5.23）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: keyword, in: query, description: 按用户名模糊匹配, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: 代理分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [admin-agents]
      operationId: createAgent
      summary: 新建代理账号与其配额（admin:write，Ruling-103、Ruling-104）
      description: |
        账号与配额同一事务建出；用户名与管理员共用一个命名空间，重名 409。
        planIds 里有不存在的套餐、或流量 / 时长任一为“不限”的套餐，400 invalid_argument。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCreateInput" }
      responses:
        "200":
          description: 新建的代理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-agents]
      operationId: getAgent
      summary: 代理详情（admin:read）；id 不是代理账号时 404
      responses:
        "200":
          description: 代理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin-agents]
      operationId: updateAgent
      summary: 修改代理的备注、配额、白名单与停用状态（整体替换；admin:write，Ruling-103、Ruling-104）
      description: |
        trafficPoolTotal 低于当前已用量 409 conflict；planIds 含不存在或流量 / 时长任一为“不限”的套餐 400 invalid_argument。
        maxUsers 可以调到低于当前名下用户数：已有用户不受影响，只是不能再新增（docs/03 §5.23 用户数上限）。
        停用时其全部会话立即失效、邀请码不可用，名下用户不受影响。id 不是代理账号时 404。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUpdateInput" }
      responses:
        "200":
          description: 修改后的代理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/agents/{id}/allocations:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-agents]
      operationId: listAgentAllocations
      summary: 该代理的开通记录，按时间倒序（admin:read，线下结算的依据，Ruling-103）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: from, in: query, description: 创建时间下限（含）, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 创建时间上限（不含）, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: 开通记录分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentAllocationPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/agent/summary:
    get:
      tags: [agent]
      operationId: agentGetSummary
      summary: 我的配额与用量（仅代理会话）
      responses:
        "200":
          description: 配额与用量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/agent/plans:
    get:
      tags: [agent]
      operationId: agentListPlans
      summary: 我可以分配的套餐（白名单），按套餐排序字段升序
      description: 只返回额度字段与本次开通将扣减的流量，不带全站人数、价格、节点组等平台数据。
      responses:
        "200":
          description: 白名单套餐
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AgentPlan" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/admin/agent/users:
    get:
      tags: [agent]
      operationId: agentListUsers
      summary: 名下用户分页（不含待删除的），按创建时间倒序
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: keyword, in: query, description: 按用户名、邮箱或备注模糊匹配, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/UserStatus" } }
        - { name: planId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: 名下用户分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentUserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [agent]
      operationId: agentCreateUser
      summary: 新建名下用户，同时分配一个白名单套餐（扣流量池，写开通记录 kind = create）
      description: |
        planId 不在白名单 400 invalid_argument；名下未删除用户数已达上限 409 agent_user_limit；
        流量池不够这次扣减 409 agent_pool_insufficient（不建用户、不部分开通）；用户名或邮箱重复 409 conflict。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUserCreateInput" }
      responses:
        "200":
          description: 新建的用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUserEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/AgentQuotaConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/agent/users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [agent]
      operationId: agentGetUser
      summary: 名下用户详情；不在名下或待删除一律 404
      responses:
        "200":
          description: 用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [agent]
      operationId: agentUpdateUser
      summary: 修改名下用户的备注与启用 / 停用
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUserUpdateInput" }
      responses:
        "200":
          description: 修改后的用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUserEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [agent]
      operationId: agentDeleteUser
      summary: 删除名下用户（高危，须二次验证；流量池不退回）
      description: 流程同管理端删除用户（面板不可达时记为待删除）；删除后其订单与余额流水不再对代理可见，开通记录保留（docs/03 §5.23）。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/agent/users/{id}/plan:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [agent]
      operationId: agentAssignUserPlan
      summary: 给名下用户分配或续期白名单套餐（扣流量池，写开通记录 kind = assign）
      description: |
        规则同管理端分配套餐：未到期的顺延、已到期的从当时起算、已用流量清零。
        planId 不在白名单 400 invalid_argument；流量池不够 409 agent_pool_insufficient（不部分开通）。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPlanAssignInput" }
      responses:
        "200":
          description: 分配后的用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUserEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AgentQuotaConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/agent/users/{id}/quota:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [agent]
      operationId: agentUpdateUserQuota
      summary: 调低名下用户的流量额度、把到期时间提前（只能收紧，Ruling-103）
      description: |
        两个字段都可省略（省略 = 不改），但至少给一个。trafficLimit 必须大于 0 且不超过当前额度（当前为不限时任意正数都算调低）；
        expiresAt 不能为 null、不能晚于当前到期时间（当前不过期时任意时间都算提前；用户还在等首次使用、尚未开始计时时不能改，400）。
        违反任一条 400 invalid_argument。不改流量池、不写开通记录。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUserQuotaInput" }
      responses:
        "200":
          description: 修改后的用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUserEnvelope" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/agent/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [agent]
      operationId: agentResetUserPassword
      summary: 重置名下用户的客户后台登录密码（高危，须二次验证）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { $ref: "#/components/schemas/UserPassword" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/agent/users/{id}/totp:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [agent]
      operationId: agentClearUserTotp
      summary: 清除名下用户的两步验证（高危，须二次验证），其全部会话失效
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
