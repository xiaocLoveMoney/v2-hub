      summary: 一键部署入站的预览（node:write 且 host:write；docs/03 §5.1，Ruling-76，0.14.0）
      description: >-
        给出 7 个预设各自能否部署（不能时附原因）与建议端口。经 SSH 读一次主机正在监听的端口，
        与面板已有入站一起避开；按管理员频控（与主机连接测试共用额度）。服务器没绑 SSH 时返回 409。
