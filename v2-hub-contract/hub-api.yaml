    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin-panel]
      operationId: getServerMetrics
      summary: 一台服务器的资源趋势与三网延迟（server:read；Ruling-85、Ruling-86，0.16.0）
      description: 近 24 小时为原值（资源 5 分钟一点，延迟每次检测一点），近 7 天按小时平均；服务器不在线的时段没有点。
