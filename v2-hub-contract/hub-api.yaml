      description: |
        票据 60 秒内有效、只能用一次；管理端拿到后打开 `{portalUrl}/impersonate#ticket=…`，由客户门户兑换成只读会话。
        用户已停用或待删除返回 409。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
