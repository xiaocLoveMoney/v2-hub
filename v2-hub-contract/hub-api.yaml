    get:
      tags: [admin-finance]
      operationId: exportFinanceStats
      summary: 把收支统计导出为 CSV（finance:read；docs/03 §5.20，0.4.3）
      description: 参数同 /api/admin/finance/stats。不走响应信封；UTF-8 带 BOM，金额以元为单位、两位小数；记审计。
      parameters:
        - { name: granularity, in: query, schema: { $ref: "#/components/schemas/FinanceGranularity" } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 12 } }
      responses:
        "200":
          description: CSV 文件
          headers:
            Content-Disposition: { schema: { type: string }, description: attachment; filename=finance-<粒度>-<日期>.csv }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
