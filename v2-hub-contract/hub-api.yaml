      parameters:
        - { name: granularity, in: query, description: day = 按日，month = 按月（0.4.3）, schema: { $ref: "#/components/schemas/FinanceGranularity" } }
        - { name: days, in: query, description: 按日时最近多少天（按平台时区的自然日；0.4.3 起上限 366）, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
        - { name: months, in: query, description: 按月时最近多少个月（含本月，0.4.3）, schema: { type: integer, minimum: 1, maximum: 24, default: 12 } }
      responses:
        "200":
          description: 按天的充值、消费与返利合计，以及当前余额总和
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FinanceStats" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
