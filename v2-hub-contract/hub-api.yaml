                      data: { $ref: "#/components/schemas/ServerLocation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
  /api/admin/servers/{id}/reality-scan:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-panel]
      operationId: scanRealityTarget
      summary: 让该服务器的面板探测一个 REALITY 目标是否可用（Ruling-54，node:write；0.7.0）
      description: 由面板所在机器对目标做一次 TLS 1.3 探测。目标是“域名或 IP[:端口]”，不接受网段；面板判定为内网地址的不探测，结果的 privateTarget 为 true。面板类型不支持时返回 409。不记审计。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealityScanInput" }
      responses:
        "200":
          description: 探测结果（目标不可用也是 200，feasible 为 false）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RealityScanResult" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
