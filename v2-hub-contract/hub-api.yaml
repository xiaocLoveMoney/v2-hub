        "429": { $ref: "#/components/responses/RateLimited" }
  /api/pay/notify/{gateway}:
    post:
      tags: [payment]
      operationId: paymentNotify
      summary: 支付网关的异步通知；验签后幂等入账（docs/03 §5.15）
      description: |
        请求体与应答格式由各网关决定，这里只约定路径。未配置的网关返回 404；验签失败或金额与充值单不符返回 400。
        同一笔网关交易重复通知只入账一次，重复通知仍返回成功。
      security: []
      parameters:
        - { name: gateway, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9_-]{1,32}$" } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: 已受理（内容为网关要求的应答文本）
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

