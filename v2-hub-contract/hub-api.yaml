      summary: 一键部署入站（node:write 且 host:write；Ruling-76，0.14.0），排一条 deploy_inbounds 主机任务
      description: >-
        端口须在 1–65535 且互不相同，不能选当前不可用的预设（如主机没有 DNS 账号时的 TLS 预设，400）；
        服务器没绑 SSH、主机有未结束的任务时返回 409。端口是否被占在任务执行时再查一次。
        namePrefix / nameSuffix（0.14.1，Ruling-80）填了的话，新入站的直连节点显示名取“前缀 + 默认名 + 后缀”。
