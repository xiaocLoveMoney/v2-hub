    post:
      tags: [admin-panel]
      operationId: generatePanelKeys
      summary: 让该服务器的面板生成一组密钥（Reality x25519、ML-DSA-65、VLESS encryption），原样返回给表单（Ruling-16，node:write）
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
