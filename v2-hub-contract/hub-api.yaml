    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin-panel]
      operationId: scanRealityTargets
      summary: 让该服务器的面板探测一组 REALITY 候选目标并排序（Ruling-54，node:write；0.7.0）
      description: targets 为空时探测面板自己的候选站点；否则最多 20 个，每个是“域名或 IP[:端口]”，不接受网段。结果按可用优先、延迟从低到高排。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealityTargetsInput" }
      responses:
        "200":
          description: 探测结果（目标不可用也是 200，feasible 为 false）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/RealityScanResult" } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
