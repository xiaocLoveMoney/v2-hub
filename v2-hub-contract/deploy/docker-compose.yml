# 开发 / 联调用中间件。应用编排在 compose.deploy.yml。
# 账号口令从同目录 .env 读（.env 不入库，模板 .env.example）。
# 宿主机端口默认避开 5432/9000/9001（本机其它项目常占用），可在 .env 覆盖。
name: v2-hub-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # MinIO 官方社区镜像已停更，沿用 pgsty 维护的发行版（Ruling-6）。
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      retries: 20

  # 两台 3x-ui 面板，供 M1 起的 Provider 集成测试与联调使用；默认不起：
  #   docker compose -f deploy/docker-compose.yml --profile xui up -d
  xui-a:
    image: ghcr.io/mhsanaei/3x-ui:v3.11.0
    profiles: ["xui"]
    ports: ["127.0.0.1:${XUI_A_PORT:-12053}:2053"]
    volumes: ["xui-a-db:/etc/x-ui"]
  xui-b:
    image: ghcr.io/mhsanaei/3x-ui:v3.11.0
    profiles: ["xui"]
    ports: ["127.0.0.1:${XUI_B_PORT:-12054}:2053"]
    volumes: ["xui-b-db:/etc/x-ui"]

volumes:
  pg-data:
  minio-data:
  xui-a-db:
  xui-b-db:
