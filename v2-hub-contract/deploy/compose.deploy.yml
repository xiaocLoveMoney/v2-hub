# 生产编排（单台独立服务器）：hub-server + Caddy + PostgreSQL + MinIO。
# v2-hub 只做控制面，不转发代理流量；对外只开 80/443。
# 由 deploy_prod.sh 同步到生产机 /opt/v2-hub 后执行（Ruling-62）；手动操作：
#   docker compose -f /opt/v2-hub/compose.deploy.yml --env-file /opt/v2-hub/.env ps
name: v2-hub
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }
services:
  hub-server:
    # 部署时以提交号为标签构建并同时打上 current；手动执行 compose 时用 current
    image: v2-hub-server:${IMAGE_TAG:-current}
    restart: unless-stopped
    logging: *logging
    environment:
      HUB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      HUB_ENCRYPTION_KEY: ${HUB_ENCRYPTION_KEY}
      # 留空 = 邮件 / Telegram 不可用（docs/03 §5.7，Ruling-42）
      HUB_SMTP_HOST: ${HUB_SMTP_HOST:-}
      HUB_SMTP_PORT: ${HUB_SMTP_PORT:-587}
      HUB_SMTP_USERNAME: ${HUB_SMTP_USERNAME:-}
      HUB_SMTP_PASSWORD: ${HUB_SMTP_PASSWORD:-}
      HUB_SMTP_FROM: ${HUB_SMTP_FROM:-}
      HUB_SMTP_TLS: ${HUB_SMTP_TLS:-starttls}
      HUB_TELEGRAM_BOT_TOKEN: ${HUB_TELEGRAM_BOT_TOKEN:-}
      HUB_GLOBALPING_TOKEN: ${HUB_GLOBALPING_TOKEN:-}
      HUB_IPQ_IP2LOCATION_KEY: ${HUB_IPQ_IP2LOCATION_KEY:-}
      HUB_IPQ_IPAPIIS_KEY: ${HUB_IPQ_IPAPIIS_KEY:-}
      HUB_IPQ_ABUSEIPDB_KEY: ${HUB_IPQ_ABUSEIPDB_KEY:-}
      HUB_IPQ_IPQS_KEY: ${HUB_IPQ_IPQS_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    logging: *logging
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [hub-server, minio]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    logging: *logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # 控制台只绑本机，运维经 SSH 隧道访问
    ports: ["127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]

volumes:
  caddy-data:
  caddy-config:
  pg-data:
  minio-data:
