# v2-hub-admin-web：本模块或契约目录变动时跑；main 每次合入由 deploy.yml 调用全量跑。
name: v2-hub-admin-web
on:
  # main 上由 deploy.yml 调用（检查全绿才部署，Ruling-62），这里不再单独监听 push
  workflow_call:
  pull_request:
    paths:
      - "v2-hub-admin-web/**"
      - "v2-hub-contract/**"
      - ".github/workflows/admin-web.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2-hub-admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-hub-admin-web/package-lock.json
      - run: make lint
      - run: make test
      - run: make build
